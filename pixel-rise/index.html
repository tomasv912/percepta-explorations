<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Rise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The bundled serif (shared with Text Dissolve) for the wordmark; Trust 3A takes over when its Adobe kit is loaded. */
@font-face { font-family: 'EB Garamond'; font-weight: 400; src: url('../text-dissolve/vendor/eb-garamond-latin-400-normal.woff') format('woff'); }
@font-face { font-family: 'EB Garamond'; font-weight: 500; src: url('../text-dissolve/vendor/eb-garamond-latin-500-normal.woff') format('woff'); }
@font-face { font-family: 'EB Garamond'; font-weight: 700; src: url('../text-dissolve/vendor/eb-garamond-latin-700-normal.woff') format('woff'); }
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

/* Same layout as Gradient Shapes: a 288px control rail on the left, the plate on the right. */
.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 288px minmax(0, 1fr); }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; padding: 22px 20px; overflow-y: auto; }
.brand { display: flex; align-items: baseline; justify-content: space-between; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.group { display: flex; flex-direction: column; gap: 10px; }
.lbl { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; }
.seg { display: grid; gap: 4px; }
.chip { appearance: none; border: 1px solid transparent; background: var(--fill); color: var(--text); font: inherit; font-size: 12px; padding: 7px 4px; border-radius: 6px; cursor: pointer; }
.chip:hover { border-color: var(--line); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 10px; }
.row .v { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--text); margin: 0; }
.note { color: var(--text-3); font-size: 12px; line-height: 1.45; margin: 0; }
.text { font: 13px var(--font); height: 32px; min-width: 0; border-radius: 7px; border: 1px solid var(--line); background: var(--page); color: var(--text); padding: 0 10px; }
.file { display: flex; gap: 8px; align-items: center; }
.file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 12px; }
.swatches { display: grid; grid-template-columns: 56px 1fr; gap: 8px 10px; align-items: center; }
.swatches input[type=color] { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 2px; cursor: pointer; }
.tg { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.tg input { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.tg input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.tg input:checked { background: var(--text); }
.tg input:checked::after { transform: translateX(12px); }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 500; padding: 10px 12px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.btn:hover { background: var(--fill); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn kbd { font-family: var(--mono); font-size: 10px; opacity: .7; }
.chip:focus-visible, .btn:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 28px; background: var(--stage); }
.canvas { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.plate { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 40px rgb(0 0 0 / .08); }
.plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.drop .canvas { outline: 2px dashed var(--text-2); outline-offset: -8px; }
.guide { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.guide line { stroke-width: 3; stroke: rgb(0 0 0 / .35); }
.guide line + line { stroke-width: 1.25; stroke: #fff; }
.node { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 2px 6px rgb(0 0 0 / .25); cursor: grab; touch-action: none; }
#nodeB { background: #1a1714; }
.node:active { cursor: grabbing; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 9px 14px; border-radius: 7px; font-size: 12px; z-index: 5; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; flex: none; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 20px 16px; }
  .stage { padding: 16px; min-height: 60vh; }
}
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<div class="app">
  <aside class="rail">
    <div class="brand"><h1>Pixel Rise</h1><span id="seedTag">#0</span></div>

    <div class="group">
      <div class="lbl">Fuente</div>
      <div class="seg" id="source" style="grid-template-columns:repeat(2,1fr)"></div>
      <input class="text" id="text" aria-label="Texto" spellcheck="false">
      <div class="file" id="fileRow" hidden><span id="fileName"></span><button class="btn sm" id="change">Cambiar</button></div>
    </div>

    <!-- Dispersion controls, in the same place as Gradient Shapes' "Gesto" group. -->
    <div class="group">
      <div class="lbl">Dispersión</div>
      <div class="seg" id="mode" style="grid-template-columns:repeat(2,1fr)"></div>
      <p class="note" id="nodeNote">Mové los dos nodos sobre el lienzo: el blanco marca dónde arranca la dispersión y el negro dónde la forma queda concreta.</p>
      <div class="row"><span>Dispersión</span><span class="v" id="dispV"></span><input type="range" id="disp" min="0" max="1" step="0.01"></div>
      <div class="row"><span>Sueltos</span><span class="v" id="looseV"></span><input type="range" id="loose" min="0" max="1" step="0.01"></div>
      <div class="row"><span>Definición</span><span class="v" id="defV"></span><input type="range" id="def" min="0" max="1" step="0.01"></div>
      <div class="row"><span>Irregularidad</span><span class="v" id="irregV"></span><input type="range" id="irreg" min="0" max="1" step="0.01"></div>
    </div>

    <div class="group">
      <div class="lbl">Píxeles</div>
      <div class="row"><span>Tamaño</span><span class="v" id="cellV"></span><input type="range" id="cell" min="1" max="16" step="0.5"></div>
    </div>

    <div class="group">
      <div class="lbl">Color</div>
      <div class="swatches"><span>Tinta</span><input type="color" id="ink"><span>Fondo</span><input type="color" id="paper"></div>
      <label class="tg" id="imageColorsRow" for="imageColors"><span>Colores de la imagen</span><input type="checkbox" id="imageColors"></label>
      <label class="tg" for="transparent"><span>PNG transparente</span><input type="checkbox" id="transparent"></label>
    </div>

    <div class="group">
      <div class="lbl">Formato</div>
      <div class="seg" id="aspect" style="grid-template-columns:repeat(5,1fr)"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="reseed">Nueva semilla <kbd>R</kbd></button>
      <button class="btn" id="png">Descargar PNG <kbd>↓</kbd></button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="canvas"><div class="plate" id="plate">
      <canvas id="cv" role="img" aria-label="Forma que se dispersa en píxeles hacia arriba"></canvas>
      <svg class="guide" id="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line id="lineA" vector-effect="non-scaling-stroke"/><line id="lineB" vector-effect="non-scaling-stroke"/></svg>
      <button class="node" id="nodeA" title="Inicio: dispersión máxima" aria-label="Inicio de la dispersión"></button>
      <button class="node" id="nodeB" title="Fin: forma concreta" aria-label="Fin de la dispersión"></button>
    </div></div>
    <div class="meta"><span id="meta"></span><span>Soltá una imagen acá · exporta PNG al doble</span></div>
  </main>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
const SIZES = { '3:2': [1800, 1200], '4:3': [1800, 1350], '1:1': [1500, 1500], '4:5': [1440, 1800], '16:9': [1920, 1080] };
const RES = 2; // raster and export at 2x
const DEFAULTS = {
  seed: 1, source: 'text', text: 'Percepta', mode: 'prog',
  disp: .85, loose: .25, def: .35, irreg: .5, cell: 3,
  ink: '#141414', paper: '#f4f3f1', imageColors: true, transparent: false, aspect: '3:2',
  A: [.5, .08], B: [.5, .7],
};
const S = structuredClone(DEFAULTS);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// ---------- Noise ----------
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function perlin(rand) {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  return (x, y) => {
    const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
    const u = fade(xf), v = fade(yf);
    const aa = p[p[xi] + yi], ab = p[p[xi] + yi + 1], ba = p[p[xi + 1] + yi], bb = p[p[xi + 1] + yi + 1];
    const x1 = g(aa, xf, yf) + u * (g(ba, xf - 1, yf) - g(aa, xf, yf));
    const x2 = g(ab, xf, yf - 1) + u * (g(bb, xf - 1, yf - 1) - g(ab, xf, yf - 1));
    return x1 + v * (x2 - x1);
  };
}
// Stateless per-cell random, so moving a slider never reshuffles unrelated cells.
function hash(a, b) {
  let t = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x632BE5AB, 0xC2B2AE35);
  t ^= t >>> 15; t = Math.imul(t, 0x2C1B3C6D); t ^= t >>> 12; t = Math.imul(t, 0x297A2D39); t ^= t >>> 15;
  return (t >>> 0) / 4294967296;
}

// ---------- Source ----------
// Text (the wordmark) or an image, drawn at 2x and placed in the lower part of the plate so the
// dispersion has room to rise. Trust 3A is used when the Adobe Fonts kit saved by Text Dissolve loads.
let img = null, imgName = '', srcKey = '', src = null, family = '"EB Garamond", serif', nodesMoved = false;
function buildSource(W, H) {
  const c = document.createElement('canvas'); c.width = W * RES; c.height = H * RES;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.scale(RES, RES);
  let box;
  if (S.source === 'image' && img) {
    const bw = W * .84, bh = H * .62, k = Math.min(bw / img.width, bh / img.height), w = img.width * k, h = img.height * k;
    box = { x: (W - w) / 2, y: H * .92 - h, w, h };
    ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, box.x, box.y, w, h);
  } else {
    const t = S.text.trim() || ' ';
    ctx.font = `500 100px ${family}`;
    const m = ctx.measureText(t), k = Math.min(W * .72 / Math.max(1, m.width), H * .32 / 100), size = 100 * k;
    ctx.font = `500 ${size}px ${family}`; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const base = H * .74; ctx.fillText(t, W / 2, base);
    const mm = ctx.measureText(t);
    box = { x: W / 2 - mm.actualBoundingBoxLeft, y: base - mm.actualBoundingBoxAscent, w: mm.actualBoundingBoxLeft + mm.actualBoundingBoxRight, h: mm.actualBoundingBoxAscent + mm.actualBoundingBoxDescent };
  }
  return { canvas: c, data: ctx.getImageData(0, 0, c.width, c.height).data, box, isText: !(S.source === 'image' && img) };
}

// ---------- Dispersion ----------
// The source is cut into pixel-sized cells. Each cell gets a local dispersion: in Progresivo it falls
// linearly from Dispersión at the white node to 0 at the black node (measured along the line between them); in Libre it's Dispersión everywhere.
// A cell lets go with a probability that rises with that value (Definición makes the onset later and
// sharper), leaves its place in the source and lands as one pixel shifted along the node direction
// (upwards by default) by a distance proportional to the local dispersion. Sueltos throws some of them
// much further; Irregularidad adds streaks and a little sideways wander. Pixels carry the cell's colour
// and appear with probability = its coverage, so the dispersed part is made of the source itself.
function disperse(W, H) {
  const { data, box } = src, d = S.cell, PW = W * RES, PH = H * RES;
  const cols = Math.ceil(W / d), rows = Math.ceil(H / d), cut = new Uint8Array(cols * rows), pix = [];
  const n = perlin(rng(S.seed * 7919 + 13)), sf = 5 / Math.min(W, H), sb = S.seed * 131;
  const A = [S.A[0] * W, S.A[1] * H], B = [S.B[0] * W, S.B[1] * H], gx = B[0] - A[0], gy = B[1] - A[1], gl = gx * gx + gy * gy || 1;
  let dx = 0, dy = -1;
  if (S.mode === 'prog' && gl > 1) { const l = Math.sqrt(gl); dx = -gx / l; dy = -gy / l; }
  const localD = (x, y) => S.mode === 'prog' ? S.disp * (1 - clamp(((x - A[0]) * gx + (y - A[1]) * gy) / gl)) : S.disp;
  const maxDist = .8 * H;
  const i0 = Math.max(0, Math.floor(box.x / d) - 1), i1 = Math.min(cols, Math.ceil((box.x + box.w) / d) + 1);
  const j0 = Math.max(0, Math.floor(box.y / d) - 1), j1 = Math.min(rows, Math.ceil((box.y + box.h) / d) + 1);
  for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) {
    const x0 = i * d, y0 = j * d;
    let sA = 0, sR = 0, sG = 0, sB = 0;
    for (let v = 0; v < 3; v++) for (let u = 0; u < 3; u++) {
      const q = (clamp(Math.floor((y0 + (v + .5) / 3 * d) * RES), 0, PH - 1) * PW + clamp(Math.floor((x0 + (u + .5) / 3 * d) * RES), 0, PW - 1)) * 4, al = data[q + 3];
      sA += al; sR += data[q] * al; sG += data[q + 1] * al; sB += data[q + 2] * al;
    }
    const cov = sA / (9 * 255);
    if (cov < .02) continue;
    const cx = x0 + d / 2, cy = y0 + d / 2, D = localD(cx, cy);
    if (D <= .002) continue;
    const id = j * cols + i, streak = clamp(.55 + n(cx * sf, cy * sf) * 1.8, .05, 1.4);
    const chance = Math.pow(D, .5 + S.def * 2.5) * (1 + (streak - 1) * S.irreg);
    if (hash(id, sb) >= chance) continue;
    cut[id] = 1;
    if (hash(id, sb + 1) >= cov) continue;
    const loose = hash(id, sb + 2) < S.loose * .35;
    const dist = D * maxDist * (.04 + .96 * Math.pow(hash(id, sb + 3), 2.4)) * (1 + (streak - 1) * S.irreg) * (loose ? 1.6 + 2.4 * hash(id, sb + 4) : 1);
    const a = (hash(id, sb + 5) - .5) * (.12 + S.irreg * .5 + (loose ? .9 : 0)), ca = Math.cos(a), sa = Math.sin(a);
    const wob = n(cx * sf * 3 + 40, cy * sf * 3) * S.irreg * dist * .12;
    const x = cx + (dx * ca - dy * sa) * dist - dy * wob, y = cy + (dx * sa + dy * ca) * dist + dx * wob;
    pix.push(x, y, Math.round(sR / sA) << 16 | Math.round(sG / sA) << 8 | Math.round(sB / sA));
  }
  return { cols, rows, d, cut, pix };
}

// ---------- Rendering ----------
const hex = c => '#' + (c & 0xF8F8F8).toString(16).padStart(6, '0');
function draw(ctx, W, H, scale, withBg) {
  if (withBg) { ctx.fillStyle = S.paper; ctx.fillRect(0, 0, W, H); }
  const tintText = src.isText || !S.imageColors;
  // The source on its own layer: tinted, minus the cells that left.
  const layer = document.createElement('canvas'); layer.width = Math.round(W * scale); layer.height = Math.round(H * scale);
  const lx = layer.getContext('2d'); lx.scale(scale, scale);
  lx.imageSmoothingQuality = 'high'; lx.drawImage(src.canvas, 0, 0, W, H);
  if (tintText) { lx.globalCompositeOperation = 'source-in'; lx.fillStyle = S.ink; lx.fillRect(0, 0, W, H); }
  lx.globalCompositeOperation = 'destination-out'; lx.beginPath();
  const { cols, rows, d, cut } = gen;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols;) {
    if (!cut[j * cols + i]) { i++; continue; }
    let e = i; while (e < cols && cut[j * cols + e]) e++;
    lx.rect(i * d, j * d, (e - i) * d, d); i = e;
  }
  lx.fill();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0); ctx.restore();
  // Dispersed pixels, batched per colour.
  const groups = new Map(), p = gen.pix;
  for (let k = 0; k < p.length; k += 3) {
    const c = tintText ? S.ink : hex(p[k + 2]);
    let l = groups.get(c); if (!l) groups.set(c, l = []); l.push(k);
  }
  for (const [c, ks] of groups) {
    ctx.fillStyle = c; ctx.beginPath();
    for (const k of ks) ctx.rect(p[k] - d / 2, p[k + 1] - d / 2, d, d);
    ctx.fill();
  }
}

// ---------- UI ----------
const $ = s => document.getElementById(s);
const plate = $('plate'), cv = $('cv'), stage = $('stage');
let gen = null, raf = 0;
const pct = v => Math.round(v * 100) + '%';
const SLIDERS = { disp: pct, loose: pct, def: pct, irreg: pct, cell: v => v + ' px' };
for (const [key, fmt] of Object.entries(SLIDERS)) {
  const input = $(key);
  input.addEventListener('input', () => { S[key] = +input.value; sync(); });
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; sync(); });
  input.title = 'Doble clic para restablecer';
}
function seg(el, options, key, onPick) {
  el.innerHTML = '';
  for (const [v, label] of options) {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.dataset.v = v;
    b.addEventListener('click', () => { if (onPick && onPick(v) === false) return; S[key] = v; sync(); });
    el.append(b);
  }
}
seg($('source'), [['text', 'Texto'], ['image', 'Imagen']], 'source', v => { if (v === 'image' && !img) { $('file').click(); return false; } });
seg($('mode'), [['libre', 'Libre'], ['prog', 'Progresivo']], 'mode');
seg($('aspect'), Object.keys(SIZES).map(k => [k, k]), 'aspect');
$('text').addEventListener('input', e => { S.text = e.target.value; sync(); });
$('ink').addEventListener('input', e => { S.ink = e.target.value; sync(); });
$('paper').addEventListener('input', e => { S.paper = e.target.value; sync(); });
$('imageColors').addEventListener('change', e => { S.imageColors = e.target.checked; sync(); });
$('transparent').addEventListener('change', e => { S.transparent = e.target.checked; });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); sync(); };
$('reseed').addEventListener('click', reseed);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
  if (e.key.toLowerCase() === 'r') reseed();
});

function sync() {
  for (const [key, fmt] of Object.entries(SLIDERS)) { if (+$(key).value !== S[key]) $(key).value = S[key]; $(key + 'V').textContent = fmt(S[key]); }
  for (const id of ['source', 'mode', 'aspect']) [...$(id).children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S[id])));
  if ($('text').value !== S.text) $('text').value = S.text;
  $('ink').value = S.ink; $('paper').value = S.paper; $('imageColors').checked = S.imageColors; $('transparent').checked = S.transparent;
  const image = S.source === 'image' && img;
  $('text').hidden = !!image; $('fileRow').hidden = !image; $('fileName').textContent = imgName; $('imageColorsRow').hidden = !image;
  const prog = S.mode === 'prog';
  $('nodeNote').hidden = !prog; $('nodeA').hidden = $('nodeB').hidden = $('guide').hidden = !prog;
  $('seedTag').textContent = '#' + S.seed;
  schedule();
}
function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
function render() {
  const [W, H] = SIZES[S.aspect];
  const sk = JSON.stringify([S.aspect, S.source, S.text, imgName, family]);
  if (sk !== srcKey) {
    src = buildSource(W, H); srcKey = sk;
    // Until the nodes are moved by hand they span the shape: white at its top, black at its base.
    if (!nodesMoved) { const b = src.box; S.A = [.5, clamp(b.y / H)]; S.B = [.5, clamp((b.y + b.h) / H)]; }
  }
  gen = disperse(W, H);
  const r = $('stage').querySelector('.canvas').getBoundingClientRect();
  const k = Math.max(.01, Math.min(r.width / W, r.height / H));
  const w = Math.round(W * k), h = Math.round(H * k), dpr = devicePixelRatio || 1;
  plate.style.width = w + 'px'; plate.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  draw(ctx, W, H, cv.width / W, true);
  placeNodes();
  $('meta').textContent = `${(gen.pix.length / 3).toLocaleString('es')} píxeles dispersos · ${W} × ${H} · exporta a ${W * RES} × ${H * RES} px`;
}
new ResizeObserver(schedule).observe(stage);

// ---------- Nodes ----------
// White node: where dispersion is strongest. Black node: where the shape is solid. Drag either one.
function placeNodes() {
  for (const [id, p] of [['nodeA', S.A], ['nodeB', S.B]]) { $(id).style.left = p[0] * 100 + '%'; $(id).style.top = p[1] * 100 + '%'; }
  for (const l of ['lineA', 'lineB']) {
    const e = $(l); e.setAttribute('x1', S.A[0] * 100); e.setAttribute('y1', S.A[1] * 100); e.setAttribute('x2', S.B[0] * 100); e.setAttribute('y2', S.B[1] * 100);
  }
}
for (const [id, key] of [['nodeA', 'A'], ['nodeB', 'B']]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    const move = ev => {
      const r = plate.getBoundingClientRect();
      S[key] = [clamp((ev.clientX - r.left) / r.width), clamp((ev.clientY - r.top) / r.height)]; nodesMoved = true;
      schedule();
    };
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
  });
  // Arrow keys nudge the focused node.
  el.addEventListener('keydown', e => {
    const step = e.shiftKey ? .05 : .01, d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!d) return;
    e.preventDefault(); S[key] = [clamp(S[key][0] + d[0]), clamp(S[key][1] + d[1])]; nodesMoved = true; schedule();
  });
}

// ---------- Input ----------
function openFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast('Ese archivo no es una imagen.');
  const el = new Image(), url = URL.createObjectURL(file);
  el.onload = () => { img = el; imgName = file.name; S.source = 'image'; sync(); };
  el.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen.'); };
  el.src = url;
}
$('file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
$('change').addEventListener('click', () => $('file').click());
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop'); });
stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drop'); openFile(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  if (e.target.closest('input, textarea')) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) openFile(item.getAsFile());
});

// ---------- Export ----------
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
$('png').addEventListener('click', () => {
  const [W, H] = SIZES[S.aspect], c = document.createElement('canvas'); c.width = W * RES; c.height = H * RES;
  const ctx = c.getContext('2d'); ctx.setTransform(RES, 0, 0, RES, 0, 0);
  draw(ctx, W, H, RES, !S.transparent);
  c.toBlob(b => {
    if (!b) return toast('No se pudo generar el PNG.');
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `pixel-rise-${S.seed}.png`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(a.download + ' descargado');
  }, 'image/png');
});

// ---------- Fonts ----------
// Reuse the Adobe Fonts kit Text Dissolve remembers (same site), so the wordmark can be in Trust 3A.
function useTrustIfAvailable() {
  const faces = [...document.fonts].filter(f => /trust/i.test(f.family));
  Promise.allSettled(faces.map(f => f.load())).then(() => {
    const ok = faces.find(f => f.status === 'loaded');
    if (ok) { family = `"${ok.family.replace(/["']/g, '')}", "EB Garamond", serif`; schedule(); }
  });
}
try {
  const kit = localStorage.getItem('text-dissolve:adobe-kit');
  if (kit) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `https://use.typekit.net/${kit}.css`; l.onload = useTrustIfAvailable; document.head.append(l); }
} catch {}
document.fonts.load(`500 100px "EB Garamond"`).finally(() => { srcKey = ''; sync(); });
sync();
</script>
</body>
</html>
