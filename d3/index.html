<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; touch-action: none; }
main canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
main[data-tool="move"] { cursor: grab; }
main[data-tool="move"].dragging, main.panning { cursor: grabbing; }
main[data-tool="zoom"] { cursor: zoom-in; }
main[data-tool="zoom"].alt { cursor: zoom-out; }

main[data-tool="paint"], main[data-tool="erase"], main[data-tool="smudge"], main[data-tool="blur"] { cursor: none; }
.tools { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; align-items: center; padding: 4px;
  background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 4px 18px rgb(0 0 0 / .14); z-index: 1; }
.tools button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; }
.tools button:hover { background: var(--fill); }
.tools button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.tools .zoom { width: auto; min-width: 56px; padding: 0 8px; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--text-2); }
.tools i { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.brush { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1px solid rgb(255 255 255 / .9); box-shadow: 0 0 0 1px rgb(0 0 0 / .45); pointer-events: none; transform: translate(-50%, -50%); z-index: 1; }
.pop { position: fixed; z-index: 30; width: 230px; background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgb(0 0 0 / .18); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pop h3 { margin: 0; font-size: 12px; font-weight: 600; }
.pop p { margin: 0; color: var(--text-3); font-size: 12px; line-height: 1.45; }

.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; border: 1.5px dashed var(--text-2); background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--text); font-weight: 500; pointer-events: none; z-index: 2; }
.hud { position: absolute; top: 12px; right: 14px; color: var(--text-3); font: 11px var(--mono); font-variant-numeric: tabular-nums; pointer-events: none; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }

.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, .tools button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }

.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }

.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.swatch.off { opacity: .4; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }

footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
[hidden] { display: none !important; }

@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
}
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<div class="app">
  <main id="stage" data-tool="move">
    <canvas id="cv" role="img" aria-label="Forma o imagen hecha de círculos por densidad"></canvas>
    <div class="brush" id="brush" hidden></div>
    <div class="tools" role="toolbar" aria-label="Herramientas">
      <button data-tool="move" title="Mover la forma (H)" aria-label="Mover">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v13M1.5 8h13M8 1.5 6.2 3.3M8 1.5l1.8 1.8M8 14.5l-1.8-1.8M8 14.5l1.8-1.8M1.5 8l1.8-1.8M1.5 8l1.8 1.8M14.5 8l-1.8-1.8M14.5 8l-1.8 1.8"/></svg>
      </button>
      <button data-tool="zoom" title="Lupa (Z): clic acerca, Alt+clic aleja" aria-label="Lupa">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5M5 7h4M7 5v4"/></svg>
      </button>
      <i></i>
      <button data-tool="paint" title="Pincel (B): agregar puntos · clic derecho: ajustes" aria-label="Pincel">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.5 3.5l-8.6 8.6"/><path d="M12.4 9.6l1.9 1.9"/><path d="M9.6 12.3a2.8 2.8 0 0 0-3.9 0c-1.2 1.2-.7 3.3-2.2 4.7 2.6 1 5.6.6 6.9-.8a2.8 2.8 0 0 0-.8-3.9z"/></svg>
      </button>
      <button data-tool="erase" title="Goma (E): sacar puntos · clic derecho: ajustes" aria-label="Goma">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 18.5l-4-4a1.5 1.5 0 0 1 0-2.1l8.4-8.4a1.5 1.5 0 0 1 2.1 0l3.5 3.5a1.5 1.5 0 0 1 0 2.1l-7.5 7.5"/><path d="M8.5 18.5h10"/><path d="M8 9l5.5 5.5"/></svg>
      </button>
      <button data-tool="smudge" title="Dedo (D): arrastrá para dispersar · clic derecho: ajustes" aria-label="Dedo">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11.5 10V8.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14.5 10.5a1.5 1.5 0 0 1 3 0V14a5 5 0 0 1-5 5h-1.6a4 4 0 0 1-3.1-1.5l-2.6-3.3a1.5 1.5 0 0 1 2.3-1.9l1 1.2"/></svg>
      </button>
      <button data-tool="blur" title="Gota (G): desenfocar · clic derecho: ajustes" aria-label="Gota">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5S5.5 9.8 5.5 13.5a5.5 5.5 0 0 0 11 0C16.5 9.8 11 3.5 11 3.5z"/></svg>
      </button>
      <i></i>
      <button id="undo" title="Deshacer (⌘Z)" aria-label="Deshacer">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8H4V4"/><path d="M4.4 8A7 7 0 1 1 5 14.5"/></svg>
      </button>
      <button id="clear" title="Borrar retoques" aria-label="Borrar retoques">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h12"/><path d="M9 7V5h4v2"/><path d="M7 7l.8 11h6.4L15 7"/></svg>
      </button>
      <i></i>
      <button class="zoom" id="zoom-fit" title="Ajustar a la vista (0)">100%</button>
    </div>
    <div class="pop" id="pop" hidden></div>
    <div class="drop" id="drop" hidden>Soltá la imagen</div>
    <div class="hud" id="stats">—</div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Fuente</h2>
        <div class="seg" data-key="source" aria-label="Fuente">
          <button data-v="shape">Forma</button><button data-v="image">Imagen</button>
        </div>
        <button class="btn" id="upload">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
          Subir imagen
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <div id="image-controls" style="display:contents">
          <label class="check"><input type="checkbox" data-check="invert"> Invertir imagen</label>
          <div id="sl-contrast"></div>
          <div id="sl-threshold"></div>
        </div>
      </section>

      <section id="shape-section">
        <h2>Forma</h2>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Otra forma (R)" aria-label="Otra forma">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
        <button class="btn" id="shuffle">Todo al azar</button>
        <div id="sl-bulbs"></div>
        <div id="sl-waist"></div>
        <div id="sl-fold"></div>
        <div id="sl-droop"></div>
        <div id="sl-twist"></div>
        <div id="sl-yaw"></div>
      </section>

      <section>
        <h2>Puntos</h2>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-overlap"></div>
      </section>

      <section>
        <h2>Color</h2>
        <div class="row" style="grid-template-columns:64px 1fr">
          <label class="check"><input type="checkbox" data-check="fill"> Relleno</label>
          <label class="swatch"><i></i><b data-hex></b><input type="color" data-color="fillColor" aria-label="Color del relleno"></label>
        </div>
        <div class="row" style="grid-template-columns:64px 1fr">
          <label class="check"><input type="checkbox" data-check="stroke"> Trazo</label>
          <label class="swatch"><i></i><b data-hex></b><input type="color" data-color="strokeColor" aria-label="Color del trazo"></label>
        </div>
        <div id="sl-strokeW"></div>
        <div style="display:flex;gap:6px">
          <button class="btn" id="swap" style="flex:1" title="Intercambia los colores del relleno y del trazo">Relleno ⇄ trazo</button>
          <button class="btn" id="negate" style="flex:1" title="Invierte relleno, trazo y fondo">Invertir colores</button>
        </div>
        <div class="row" style="grid-template-columns:64px 1fr">
          <span>Fondo</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="paper" aria-label="Fondo"></label>
        </div>
        <label class="check"><input type="checkbox" data-check="transparent"> Exportar sin fondo</label>
      </section>
    </div>
    <footer>
      <button class="btn primary big" id="png">Exportar PNG</button>
      <button class="btn big" id="svg">Exportar SVG</button>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
const AW = 1920, AH = 1080; // artboard, in units
const RES = 2;              // exports render at 2x
const GRID = 480;           // luminance grid of the image, long side
const DEFAULTS = {
  source: 'shape', seed: 1,
  bulbs: 4, waist: .7, fold: .45, droop: .35, twist: .25, yaw: 0,
  invert: false, contrast: 1.2, threshold: .15,
  count: 18000, size: 4.5, overlap: .5,
  fill: true, fillColor: '#f4f1ea', stroke: true, strokeColor: '#0c0c0c', strokeW: .8,
  paper: '#0c0c0c', transparent: false,
};
const S = structuredClone(DEFAULTS);
let panX = 0, panY = 0; // where the hand moved the content, in artboard units

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function perlin3(rand) {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const g = (h, x, y, z) => { const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return (h & 1 ? -u : u) + (h & 2 ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    x -= X; y -= Y; z -= Z;
    const xi = X & 255, yi = Y & 255, zi = Z & 255, u = fade(x), v = fade(y), w = fade(z);
    const A = p[xi] + yi, AA = p[A] + zi, AB = p[A + 1] + zi, B = p[xi + 1] + yi, BA = p[B] + zi, BB = p[B + 1] + zi;
    return lerp(
      lerp(lerp(g(p[AA] & 15, x, y, z), g(p[BA] & 15, x - 1, y, z), u), lerp(g(p[AB] & 15, x, y - 1, z), g(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(g(p[AA + 1] & 15, x, y, z - 1), g(p[BA + 1] & 15, x - 1, y, z - 1), u), lerp(g(p[AB + 1] & 15, x, y - 1, z - 1), g(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  };
}

// ---------- Image ----------
// Read once into a luminance grid.
let src = null;
function loadImage(img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const gw = Math.max(2, Math.round(iw >= ih ? GRID : GRID * iw / ih)), gh = Math.max(2, Math.round(iw >= ih ? GRID * ih / iw : GRID));
  // Halve in steps so big photos downsample without aliasing.
  let cur = img, cw = iw, ch = ih;
  while (cw / 2 > gw && ch / 2 > gh) {
    cw = Math.round(cw / 2); ch = Math.round(ch / 2);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, cw, ch);
    cur = c;
  }
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, gw, gh);
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(cur, 0, 0, gw, gh);
  const d = ctx.getImageData(0, 0, gw, gh).data, n = gw * gh, lum = new Float32Array(n);
  for (let k = 0; k < n; k++) lum[k] = (.2126 * d[k * 4] + .7152 * d[k * 4 + 1] + .0722 * d[k * 4 + 2]) / 255;
  src = { gw, gh, lum, ar: iw / ih };
}
// The source fills 90% of the artboard, centred, keeping its proportions.
function box(ar) {
  const w0 = AW * .9, h0 = AH * .9, [w, h] = w0 / h0 > ar ? [h0 * ar, h0] : [w0, w0 / ar];
  return { x: (AW - w) / 2, y: (AH - h) / 2, w, h };
}

// Darkness above the threshold becomes density (the negative's, when inverted). Superposición below 100%
// rejects circles that would cut into their neighbours too much (at 0% they only touch); the gap asked
// for grows as the tone lightens, so packing still reads as density.
function imageDots(st) {
  const { gw, gh, lum } = src, rect = box(src.ar), n = gw * gh, cw = rect.w / gw, ch = rect.h / gh, t = st.threshold;
  const M = new Float32Array(n), cdf = new Float64Array(n);
  let sum = 0;
  for (let k = 0; k < n; k++) {
    const v = clamp(((st.invert ? lum[k] : 1 - lum[k]) - .5) * st.contrast + .5);
    M[k] = t >= 1 ? -1 : (v - t) / (1 - t);
    cdf[k] = sum += M[k] > 0 ? M[k] ** 1.2 : 0;
  }
  const rand = rng(st.seed), d = st.size, keep = 1 - st.overlap, cell = Math.max(1, d), cells = new Map(), out = [];
  const fits = (x, y, m) => {
    const min = d * keep / Math.sqrt(Math.max(m, .05)), reach = Math.ceil(min / cell);
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    for (let v = gy - reach; v <= gy + reach; v++) for (let u = gx - reach; u <= gx + reach; u++) {
      const list = cells.get(v * 65536 + u); if (!list) continue;
      for (const o of list) { const ex = x - out[o], ey = y - out[o + 1]; if (ex * ex + ey * ey < min * min) return false; }
    }
    return true;

  Object.assign(brush.style, { left: e.clientX - r.left + 'px', top: e.clientY - r.top + 'px', width: d + 'px', height: d + 'px' });
  brush.hidden = false;
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.tools, .pop') || (e.button !== 0 && e.button !== 1)) return;
  stage.setPointerCapture(e.pointerId);
  if (BRUSHES[tool] && !space && e.button === 0) {
    const a = toArt(e), b = BRUSHES[tool];
    cur = { tool, size: b.size, str: b.str, scatter: b.scatter ?? 0, seed: Math.floor(Math.random() * 1e9), pts: [[a[0] - panX, a[1] - panY]], done: 0, hit: new Set() };
    cur.rng = rng(cur.seed); ops.push(cur);
    if (tool !== 'smudge') { applyOp(cur); schedule(); }
    return;
  }
  const view = space || e.button === 1 || tool === 'zoom';
  drag = { view, x: e.clientX, y: e.clientY, moved: false, a: toArt(e), px: panX, py: panY, vx, vy, alt: e.altKey };
  stage.classList.add(view ? 'panning' : 'dragging');
});
stage.addEventListener('pointermove', e => {
  stage.classList.toggle('alt', e.altKey);
  showBrush(e);
  if (cur) { const a = toArt(e); cur.pts.push([a[0] - panX, a[1] - panY]); applyOp(cur); schedule(); return; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 3) drag.moved = true;
  if (drag.view) { if (zoom > 1) { vx = drag.vx + dx; vy = drag.vy + dy; } }
  else { const a = toArt(e); panX = drag.px + a[0] - drag.a[0]; panY = drag.py + a[1] - drag.a[1]; clampPan(); }
  schedule();
});
const endDrag = e => {
  if (cur) { if (cur.pts.length < 2 && cur.tool === 'smudge') ops.pop(); cur = null; clampPan(); schedule(); return; }
  if (!drag) return;
  if (tool === 'zoom' && !space && !drag.moved && e.type === 'pointerup') {
    const r = stage.getBoundingClientRect();
    zoomAt(drag.alt || e.altKey ? .5 : 2, e.clientX - r.left, e.clientY - r.top);
  }
  drag = null; stage.classList.remove('dragging'); if (!space) stage.classList.remove('panning');
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .002)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener('pointerleave', () => { brush.hidden = true; });
document.querySelectorAll('.tools [data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#zoom-fit').addEventListener('click', fitView);
const undo = () => { if (!ops.length) return; ops.pop(); rebuild(); schedule(); };
$('#undo').addEventListener('click', undo);
$('#clear').addEventListener('click', () => { if (!ops.length) return; ops = []; rebuild(); schedule(); toast('Retoques borrados'); });

// Right click: settings of the active tool.
function popField(label, obj, k, min, max, step) {
  const row = document.createElement('div'), f = v => Math.round(v * 100) + '%';
  row.className = 'slider';
  row.innerHTML = `<label>${label}</label><output>${f(obj[k])}</output><input type="range" min="${min}" max="${max}" step="${step}" value="${obj[k]}">`;
  const inp = row.querySelector('input'), out = row.querySelector('output'), paint = () => inp.style.setProperty('--p', (obj[k] - min) / (max - min) * 100 + '%');
  inp.oninput = () => { obj[k] = +inp.value; out.textContent = f(obj[k]); paint(); };
  paint();
  return row;
}
function fillPop() {
  pop.innerHTML = '';
  const b = BRUSHES[tool];
  if (!b) { pop.innerHTML = '<h3>Herramientas</h3><p>Elegí el pincel, la goma, el dedo o la gota en la barra de abajo; con clic derecho ajustás la que esté activa.</p>'; return; }
  const h = document.createElement('h3'); h.textContent = b.name; pop.append(h);
  pop.append(popField('Tamaño', b, 'size', .01, .3, .005), popField(tool === 'erase' ? 'Cuánto saca' : 'Fuerza', b, 'str', .05, 1, .01));
  if (tool === 'smudge') pop.append(popField('Dispersión', b, 'scatter', 0, 1, .01));
}
stage.addEventListener('contextmenu', e => {
  e.preventDefault(); fillPop(); pop.hidden = false;
  pop.style.left = Math.min(innerWidth - pop.offsetWidth - 8, e.clientX + 4) + 'px';
  pop.style.top = Math.min(innerHeight - pop.offsetHeight - 8, e.clientY + 4) + 'px';
});
addEventListener('pointerdown', e => { if (!pop.hidden && !pop.contains(e.target)) pop.hidden = true; }, true);

// ---------- Controls ----------
const pct = v => Math.round(v * 100) + '%';
const SLIDERS = {
  contrast: { label: 'Contraste', min: .3, max: 4, step: .05, fmt: v => v.toFixed(2) },
  threshold: { label: 'Umbral', min: 0, max: .99, step: .01, fmt: pct },
  bulbs: { label: 'Bulbos', min: 1, max: 8, step: 1, fmt: String },
  waist: { label: 'Cintura', min: 0, max: 1, step: .01, fmt: pct },
  fold: { label: 'Pliegues', min: 0, max: 1, step: .01, fmt: pct },
  droop: { label: 'Caída', min: -1, max: 1, step: .01, fmt: pct },
  twist: { label: 'Torsión', min: -1, max: 1, step: .01, fmt: pct },
  yaw: { label: 'Giro', min: 0, max: 360, step: 1, fmt: v => v + '°' },
  count: { label: 'Cantidad', values: [...Array.from({ length: 10 }, (_, i) => (i + 1) * 100), ...Array.from({ length: 158 }, (_, i) => 1500 + i * 500)], fmt: v => v < 10000 ? v.toLocaleString('es') : Math.round(v / 1000) + 'k' },
  size: { label: 'Diámetro', min: 1, max: 40, step: .5, fmt: v => v + ' px' },
  overlap: { label: 'Superposición', min: 0, max: 1, step: .01, fmt: pct },
  strokeW: { label: 'Grosor del trazo', min: .1, max: 8, step: .1, fmt: v => v.toFixed(1) + ' px' },
};
// A slider with a values list moves through it (uneven steps), otherwise through min..max by step.
const pos = (d, v) => d.values ? d.values.reduce((b, x, i) => Math.abs(x - v) < Math.abs(d.values[b] - v) ? i : b, 0) : v;
for (const [key, d] of Object.entries(SLIDERS)) {
  if (d.values) Object.assign(d, { min: 0, max: d.values.length - 1, step: 1 });
  const host = $('#sl-' + key);
  host.className = 'slider';
  host.innerHTML = `<label for="in-${key}">${d.label}</label><output id="out-${key}"></output><input type="range" id="in-${key}" min="${d.min}" max="${d.max}" step="${d.step}" title="Doble clic para restablecer">`;
  const input = host.querySelector('input');
  input.addEventListener('input', () => { S[key] = d.values ? d.values[+input.value] : +input.value; sync(); });
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; sync(); });
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (seg.dataset.key === 'source' && b.dataset.v === 'image' && !src) { $('#file').click(); return; }
  S[seg.dataset.key] = b.dataset.v; panX = panY = 0; sync();
}));
document.querySelectorAll('[data-color]').forEach(inp => inp.addEventListener('input', () => { S[inp.dataset.color] = inp.value; sync(); }));
document.querySelectorAll('[data-check]').forEach(inp => inp.addEventListener('change', () => { S[inp.dataset.check] = inp.checked; sync(); }));
$('#seed').addEventListener('input', e => { S.seed = Math.min(999999999, parseInt(e.target.value.replace(/\D/g, '') || '0', 10)); sync(); });
$('#swap').addEventListener('click', () => { [S.fillColor, S.strokeColor] = [S.strokeColor, S.fillColor]; sync(); });
const negHex = h => '#' + (0xFFFFFF ^ parseInt(h.slice(1), 16)).toString(16).padStart(6, '0');
$('#negate').addEventListener('click', () => { for (const k of ['fillColor', 'strokeColor', 'paper']) S[k] = negHex(S[k]); sync(); });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); sync(); };
$('#reseed').addEventListener('click', reseed);
// A new seed plus fresh values for every shape setting, within ranges that stay recognisable.
const SHUFFLE = { bulbs: [2, 6], waist: [.35, .9], fold: [.15, .75], droop: [-.4, .7], twist: [-.6, .6], yaw: [0, 360] };
$('#shuffle').addEventListener('click', () => {
  for (const [k, [a, b]] of Object.entries(SHUFFLE)) S[k] = Math.round(lerp(a, b, Math.random()) / SLIDERS[k].step) * SLIDERS[k].step;
  reseed();
});
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') pop.hidden = true;
  if (e.code === 'Space' && !e.target.closest('input, textarea, button')) { e.preventDefault(); space = true; stage.classList.add('panning'); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'r') reseed();
  else if (k === 'h' || k === 'v') setTool('move');
  else if (k === 'z') setTool('zoom');
  else if (k === 'b') setTool('paint');
  else if (k === 'e') setTool('erase');
  else if (k === 'd') setTool('smudge');
  else if (k === 'g') setTool('blur');
  else if (k === '0') fitView();
  else if (k === '+' || k === '=') { const r = stage.getBoundingClientRect(); zoomAt(2, r.width / 2, r.height / 2); }
  else if (k === '-') { const r = stage.getBoundingClientRect(); zoomAt(.5, r.width / 2, r.height / 2); }
});
addEventListener('keyup', e => { if (e.code === 'Space') { space = false; if (!drag) stage.classList.remove('panning'); } });

function paintSwatch(el, hex, on) {
  el.querySelector('i').style.background = hex;
  el.querySelector('[data-hex]').textContent = hex.toUpperCase();
  const inp = el.querySelector('input'); if (inp.value !== hex) inp.value = hex;
  el.classList.toggle('off', !on);
}
function sync() {
  for (const key of Object.keys(SLIDERS)) {
    const input = $('#in-' + key), d = SLIDERS[key];
    const at = pos(d, S[key]);
    if (+input.value !== at) input.value = at;
    input.style.setProperty('--p', ((at - d.min) / (d.max - d.min) * 100) + '%');
    $('#out-' + key).textContent = d.fmt(S[key]);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[seg.dataset.key])));
  document.querySelectorAll('[data-check]').forEach(inp => inp.checked = S[inp.dataset.check]);
  const seedEl = $('#seed'); if (seedEl.value !== String(S.seed)) seedEl.value = S.seed;
  const shape = S.source === 'shape';
  $('#shape-section').hidden = !shape;
  $('#image-controls').hidden = shape;
  $('#sl-overlap').hidden = shape;
  $('#sl-strokeW').hidden = !S.stroke;
  paintSwatch($('[data-color=fillColor]').closest('.swatch'), S.fillColor, S.fill);
  paintSwatch($('[data-color=strokeColor]').closest('.swatch'), S.strokeColor, S.stroke);
  paintSwatch($('[data-color=paper]').closest('.swatch'), S.paper, true);
  if (view) clampPan();
  schedule();
}

// ---------- Input ----------
function openFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast('Eso no parece una imagen.');
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); loadImage(img); S.source = 'image'; panX = panY = 0; dotsKey = ''; sync(); toast('Imagen cargada.'); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen.'); };
  img.src = url;
}
$('#upload').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; openFile(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) openFile(item.getAsFile());
});

// ---------- Export ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
// Inside a claude.ai artifact the viewer can't follow download links, so the file goes through its
// downloads capability (the viewer confirms the save); anywhere else, a plain link.
const saver = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function download(name, blob) {
  const dl = await saver;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast(name + ' descargado'); }
    catch (e) { if (e?.code !== 'declined') toast('No se pudo descargar ' + name + '.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' descargado');
}
$('#png').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = AW * RES; c.height = AH * RES;
  const ctx = c.getContext('2d');
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (!S.transparent) { ctx.fillStyle = S.paper; ctx.fillRect(0, 0, AW, AH); }
  draw(ctx, currentDots());
  c.toBlob(b => b ? download(`d3-${S.seed}.png`, b) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => {
  toast('Unificando el SVG…');
  setTimeout(() => download(`d3-${S.seed}.svg`, new Blob([toSvg(currentDots())], { type: 'image/svg+xml' })), 30);
});

setTool('move');
sync();
</script>
</body>
</html>
