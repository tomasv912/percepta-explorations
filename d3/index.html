<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Extrude That UI: quiet neutral chrome, one size (12px), hierarchy by weight and colour, one accent
   for canvas feedback and focus, space instead of lines. Canvas left, sidebar right. */
:root {
  --page-default: #ffffff; --surface-default: #ffffff; --surface-subtle: #f5f5f5;
  --fill-default: #ffffff; --fill-subtle: #fafafa; --fill-strong: #f5f5f5; --fill-inverse: #151515;
  --content-primary: #151515; --content-secondary: #757575; --content-muted: #a5a5a5; --content-inverse: #ffffff;
  --content-accent: #1f78ff; --line-default: #ededed;
  --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow-2xs: 0 1px 1px rgb(0 0 0 / .05); --shadow-xs: 0 1px 2px rgb(0 0 0 / .06);
  /* names the shared Percepta tab bar reads */
  --surface: var(--surface-default); --fill: var(--fill-strong); --line: var(--line-default); --text: var(--content-primary);
  --text-2: var(--content-secondary); --text-3: var(--content-muted); --accent: var(--content-accent); --font: var(--font-sans);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-default: #0f0f0f; --surface-default: #151515; --surface-subtle: #1b1b1b;
    --fill-default: #151515; --fill-subtle: #1c1c1c; --fill-strong: #242424; --fill-inverse: #f5f5f5;
    --content-primary: #ededed; --content-secondary: #a0a0a0; --content-muted: #6e6e6e; --content-inverse: #151515;
    --content-accent: #4d94ff; --line-default: #262626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-default: #0f0f0f; --surface-default: #151515; --surface-subtle: #1b1b1b;
  --fill-default: #151515; --fill-subtle: #1c1c1c; --fill-strong: #242424; --fill-inverse: #f5f5f5;
  --content-primary: #ededed; --content-secondary: #a0a0a0; --content-muted: #6e6e6e; --content-inverse: #151515;
  --content-accent: #4d94ff; --line-default: #262626;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { display: flex; flex-direction: column; background: var(--page-default); color: var(--content-primary); font: 400 12px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--content-accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 272px; }

/* ---------- Canvas ---------- */
main { position: relative; overflow: hidden; background: var(--surface-subtle); min-width: 0; min-height: 0; touch-action: none; }
main canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
main[data-tool="move"], main[data-tool="orbit"] { cursor: grab; }
main[data-tool="move"].dragging, main[data-tool="orbit"].dragging, main.panning { cursor: grabbing; }
main[data-tool="zoom"] { cursor: zoom-in; }
main[data-tool="zoom"].alt { cursor: zoom-out; }
main[data-tool="paint"], main[data-tool="erase"], main[data-tool="smudge"], main[data-tool="blur"] { cursor: none; }

.float { position: absolute; z-index: 10; background: var(--surface-default); border-radius: 12px; box-shadow: 0 0 0 1px var(--line-default), var(--shadow-2xs); }
.tools { left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; }
.tools i { width: 20px; height: 1px; background: var(--line-default); margin: 4px 0; }
.zoombar { right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; }
.ib { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--content-secondary); cursor: pointer; transition: background-color .15s, color .15s; }
.ib:hover { background: var(--fill-strong); color: var(--content-primary); }
.ib[aria-pressed="true"] { background: var(--fill-strong); color: var(--content-primary); box-shadow: inset 0 0 0 1px var(--line-default); }
.ib svg { width: 16px; height: 16px; }
.zoombar .ib { width: 28px; height: 28px; }
.zoombar .pct { width: auto; min-width: 44px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.brush { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1px solid rgb(255 255 255 / .9); box-shadow: 0 0 0 1px rgb(0 0 0 / .45); pointer-events: none; transform: translate(-50%, -50%); z-index: 10; }
.hud { position: absolute; top: 12px; right: 14px; color: var(--content-muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; outline: 1.5px dashed var(--content-accent); outline-offset: -1px; background: color-mix(in srgb, var(--surface-subtle) 85%, transparent); font-weight: 500; pointer-events: none; z-index: 20; }
.pop { position: fixed; z-index: 20; width: 232px; background: var(--surface-default); border-radius: 12px; box-shadow: 0 0 0 1px var(--line-default), var(--shadow-2xs); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.pop h3 { margin: 0; font-size: 12px; font-weight: 500; }
.pop p { margin: 0; color: var(--content-muted); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface-default); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-default), var(--shadow-2xs); z-index: 20; }

/* ---------- Sidebar ---------- */
aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface-default); border-left: 1px solid var(--line-default); }
.head { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 16px; }
.head h1 { margin: 0 auto 0 0; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.head h1 svg { width: 20px; height: 20px; }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 28px; }
section { display: flex; flex-direction: column; gap: 12px; }
h2 { margin: 0; font-size: 12px; font-weight: 500; color: var(--content-primary); }
footer { flex: none; border-top: 1px solid var(--line-default); padding: 12px 16px; }

.seg { display: flex; gap: 2px; background: var(--fill-strong); border-radius: 8px; padding: 2px; }
.seg button { flex: 1; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--content-secondary); cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button:hover { color: var(--content-primary); }
.seg button[aria-pressed="true"] { background: var(--surface-default); color: var(--content-primary); box-shadow: var(--shadow-xs); }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--content-secondary); }
.slider output { color: var(--content-primary); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--content-primary), var(--content-primary)) 0 / var(--p, 50%) 100% no-repeat, var(--fill-strong); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill-strong); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--content-primary); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--surface-default); box-shadow: 0 0 0 1px var(--line-default), var(--shadow-xs); border: 0; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-default); box-shadow: 0 0 0 1px var(--line-default), var(--shadow-xs); border: 0; }

/* Switch: label left, track right. */
.check { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; color: var(--content-secondary); cursor: pointer; }
.check input { appearance: none; position: relative; width: 28px; height: 16px; margin: 0; border-radius: 8px; background: var(--fill-strong); box-shadow: inset 0 0 0 1px var(--line-default); cursor: pointer; transition: background-color .15s; }
.check input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-default); box-shadow: var(--shadow-xs); transition: transform .15s; }
.check input:checked { background: var(--fill-inverse); box-shadow: none; }
.check input:checked::after { transform: translateX(12px); }

.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--content-secondary); }
.text { height: 32px; min-width: 0; border: 0; border-radius: 8px; background: var(--fill-default); box-shadow: inset 0 0 0 1px var(--line-default); padding: 0 8px; font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--fill-default); box-shadow: inset 0 0 0 1px var(--line-default); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .15s, opacity .15s; }
.btn:hover { background: var(--fill-subtle); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.sm { height: 28px; padding: 0 8px; }
.btn.primary { background: var(--fill-inverse); color: var(--content-inverse); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--content-secondary); }
.btn.ghost:hover { background: var(--fill-strong); color: var(--content-primary); }
.btn.icon { width: 28px; height: 28px; padding: 0; }
.btn.wide { width: 100%; height: 40px; border-radius: 12px; }
.btn.wide svg { width: 12px; height: 12px; }

.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; background: var(--fill-default); box-shadow: inset 0 0 0 1px var(--line-default); font: 12px var(--font-mono); min-width: 0; }
.swatch b { font-weight: 400; color: var(--content-primary); }
.swatch i { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); flex: none; }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.pal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pal .swatch { justify-content: center; padding: 0; }
.pal .swatch i { width: calc(100% - 12px); }

@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line-default); }
  .controls { overflow: visible; }
}
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<div class="app">
  <main id="stage" data-tool="move">
    <canvas id="cv" role="img" aria-label="Forma o imagen hecha de puntos"></canvas>
    <div class="brush" id="brush" hidden></div>
    <div class="tools float" role="toolbar" aria-label="Herramientas" aria-orientation="vertical">
      <button class="ib" data-tool="move" title="Mover (H)" aria-label="Mover"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11M8 2.5 6.5 4M8 2.5 9.5 4M8 13.5 6.5 12M8 13.5l1.5-1.5M2.5 8 4 6.5M2.5 8 4 9.5M13.5 8 12 6.5M13.5 8 12 9.5"/></svg></button>
      <button class="ib" data-tool="orbit" title="Girar (O)" aria-label="Girar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5v9M9.5 3.5v9" opacity=".5"/><path d="M13 6.5c.6.4 1 .95 1 1.5 0 1.66-2.7 3-6 3s-6-1.34-6-3 2.7-3 6-3c.35 0 .7.02 1.03.05"/><path d="M8.5 3.6 10 5.1 8.5 6.6"/></svg></button>
      <button class="ib" data-tool="zoom" title="Lupa (Z) · Alt aleja" aria-label="Lupa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></svg></button>
      <i></i>
      <button class="ib" data-tool="paint" title="Pincel (B) · clic derecho: ajustes" aria-label="Pincel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5 7.25 8.75"/><path d="M6.9 9.1a2 2 0 0 0-2.8 0c-.9.9-.5 2.4-1.6 3.4 1.9.7 4 .4 5-.6a2 2 0 0 0-.6-2.8z"/></svg></button>
      <button class="ib" data-tool="erase" title="Goma (E) · clic derecho: ajustes" aria-label="Goma"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.5 3.1 10.6a1 1 0 0 1 0-1.4l6.1-6.1a1 1 0 0 1 1.4 0l2.3 2.3a1 1 0 0 1 0 1.4L7.5 12.2"/><path d="M6 13.5h7.5M5.75 6.5l3.75 3.75"/></svg></button>
      <button class="ib" data-tool="smudge" title="Dedo (D) · clic derecho: ajustes" aria-label="Dedo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5V4a1 1 0 0 1 2 0v4"/><path d="M8 7.5V6.5a1 1 0 0 1 2 0V8"/><path d="M10 7.75a1 1 0 0 1 2 0V10a3.5 3.5 0 0 1-3.5 3.5H7.4a2.8 2.8 0 0 1-2.2-1.05L3.4 10.2a1 1 0 0 1 1.55-1.3L6 10"/></svg></button>
      <button class="ib" data-tool="blur" title="Gota (G) · clic derecho: ajustes" aria-label="Gota"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5S4 7 4 9.75a4 4 0 0 0 8 0C12 7 8 2.5 8 2.5z"/></svg></button>
      <i></i>
      <button class="ib" id="undo" title="Deshacer (⌘Z)" aria-label="Deshacer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5h7a4 4 0 0 1 0 8h-2"/></svg></button>
      <button class="ib" id="clear" title="Borrar retoques" aria-label="Borrar retoques"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5M7 7v4M9 7v4"/></svg></button>
    </div>
    <div class="zoombar float" role="toolbar" aria-label="Vista">
      <button class="ib" id="zoom-out" title="Alejar (−)" aria-label="Alejar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
      <button class="ib pct" id="zoom-fit" title="Ajustar (0)">100%</button>
      <button class="ib" id="zoom-in" title="Acercar (+)" aria-label="Acercar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
      <button class="ib" id="zoom-reset" title="Ajustar a la vista (0)" aria-label="Ajustar a la vista"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3"/></svg></button>
    </div>
    <div class="pop" id="pop" hidden></div>
    <div class="drop" id="drop" hidden>Soltá la imagen</div>
    <div class="hud" id="stats">—</div>
  </main>

  <aside>
    <div class="head">
      <h1>D3</h1>
      <button class="btn sm" id="svg">SVG</button>
      <button class="btn sm primary" id="png">Exportar PNG</button>
    </div>
    <div class="controls">
      <section>
        <h2>Fuente</h2>
        <div class="seg" data-key="source" aria-label="Fuente" style="display:grid;grid-template-columns:repeat(3,1fr)">
          <button data-v="shape">Forma</button><button data-v="murm">Murmuración</button><button data-v="cloud">Nubes</button>
          <button data-v="waves">Olas</button><button data-v="image">Imagen</button>
        </div>
        <div class="row" id="seed-row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn ghost icon" id="reseed" title="Otra (R)" aria-label="Otra semilla"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.75 8a5.25 5.25 0 1 0 1.6-3.8M2.75 2.5v2.75H5.5"/></svg></button>
        </div>
        <div id="image-controls" style="display:contents">
          <label class="check"><input type="checkbox" data-check="invert"> Invertir</label>
          <div id="sl-contrast"></div>
          <div id="sl-threshold"></div>
          <div id="sl-iShadows"></div>
          <div id="sl-iFolds"></div>
        </div>
      </section>

      <section id="murm-section">
        <h2>Murmuración</h2>
        <div id="sl-mLobes"></div>
        <div id="sl-mVol"></div>
        <div id="sl-mFold"></div>
        <div id="sl-mSoft"></div>
      </section>

      <section id="cloud-section">
        <h2>Nubes</h2>
        <div id="sl-cLobes"></div>
        <div id="sl-cScale"></div>
        <div id="sl-cTurb"></div>
        <div id="sl-cSoft"></div>
        <div id="sl-cShadows"></div>
        <div id="sl-cFolds"></div>
      </section>

      <section id="waves-section">
        <h2>Olas</h2>
        <div id="sl-wLayers"></div>
        <div id="sl-wAmp"></div>
        <div id="sl-wFreq"></div>
        <div id="sl-wComplex"></div>
        <div id="sl-wPersp"></div>
        <div id="sl-wThick"></div>
        <div id="sl-wFade"></div>
      </section>

      <section id="shape-section">
        <h2>Forma</h2>
        <button class="btn" id="shuffle">Todo al azar</button>
        <div id="sl-bulbs"></div>
        <div id="sl-waist"></div>
        <div id="sl-fold"></div>
        <div id="sl-droop"></div>
        <div id="sl-twist"></div>
        <div id="sl-yaw"></div>
        <div id="sl-shade"></div>
        <div id="sl-light"></div>
      </section>

      <section>
        <h2>Puntos</h2>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <label class="check"><input type="checkbox" data-check="grid"> Grilla</label>
        <div id="sl-pitch"></div>
        <label class="check"><input type="checkbox" data-check="am"> Amplitud modulada</label>
        <div id="sl-dmin"></div>
        <div id="sl-dmax"></div>
        <label class="check"><input type="checkbox" data-check="join"> Unir</label>
        <div id="sl-joinR"></div>
      </section>

      <section>
        <h2>Desvanecer</h2>
        <label class="check"><input type="checkbox" data-check="fadeT"> Arriba</label>
        <label class="check"><input type="checkbox" data-check="fadeB"> Abajo</label>
        <div id="sl-fadeD"></div>
      </section>

      <section>
        <h2>Color</h2>
        <div class="seg" data-key="palette" aria-label="Color de los puntos">
          <button data-v="off">Uno</button><button data-v="random">Aleatorio</button><button data-v="zones">Zonas</button>
        </div>
        <div class="pal" id="pal-row">
          <label class="swatch"><i></i><input type="color" data-color="p0" aria-label="Color 1"></label>
          <label class="swatch"><i></i><input type="color" data-color="p1" aria-label="Color 2"></label>
          <label class="swatch"><i></i><input type="color" data-color="p2" aria-label="Color 3"></label>
          <label class="swatch"><i></i><input type="color" data-color="p3" aria-label="Color 4"></label>
        </div>
        <div class="row" id="fill-row" style="grid-template-columns:56px 1fr">
          <span>Puntos</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="fillColor" aria-label="Color de los puntos"></label>
        </div>
        <div class="row" style="grid-template-columns:56px 1fr">
          <span>Fondo</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="paper" aria-label="Fondo"></label>
        </div>
        <button class="btn" id="negate">Invertir colores</button>
      </section>
    </div>
    <footer>
      <button class="btn wide" id="upload" title="Subir imagen · también ⌘V o arrastrar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>Subir imagen</button>
      <input type="file" id="file" accept="image/*" hidden>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------

function openFile(file) {
  if (!file || (file.type && !file.type.startsWith('image/'))) return toast('Eso no parece una imagen.');
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); loadImage(img); S.source = 'image'; panX = panY = 0; dotsKey = ''; sync(); toast('Imagen cargada.'); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen.'); };
  img.src = url;
}
$('#upload').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; openFile(e.dataTransfer.files[0]); });
// Ctrl+V / ⌘V: an image file or bitmap on the clipboard, an <img> with an inline (data:) source in
// copied HTML, or SVG code copied as text.
addEventListener('paste', e => {
  if (e.target.closest?.('input[type=text], input:not([type]), textarea, .text')) return;
  const cd = e.clipboardData; if (!cd) return;
  const file = [...cd.files].find(f => f.type.startsWith('image/'))
    || [...cd.items].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).find(Boolean);
  if (file) { e.preventDefault(); return openFile(file); }
  const html = cd.getData('text/html'), m = html && html.match(/<img[^>]+src=["'](data:image\/[^"']+)["']/i);
  if (m) {
    e.preventDefault();
    try {
      const [head, body] = m[1].split(','), type = head.slice(5).split(';')[0], b64 = /;base64/i.test(head);
      const bytes = b64 ? Uint8Array.from(atob(body), c => c.charCodeAt(0)) : new TextEncoder().encode(decodeURIComponent(body));
      return openFile(new Blob([bytes], { type }));
    } catch { return toast('No se pudo leer la imagen pegada.'); }
  }
  const text = cd.getData('text/plain').trim();
  if (/^<(\?xml|svg)[\s\S]*<\/svg>$/i.test(text)) { e.preventDefault(); return openFile(new Blob([text], { type: 'image/svg+xml' })); }
  toast('No hay una imagen en el portapapeles.');
});

// ---------- Export ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
// Inside a claude.ai artifact the viewer can't follow download links, so the file goes through its
// downloads capability (the viewer confirms the save); anywhere else, a plain link.
const saver = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function download(name, blob) {
  const dl = await saver;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast(name + ' descargado'); }
    catch (e) { if (e?.code !== 'declined') toast('No se pudo descargar ' + name + '.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' descargado');
}
$('#png').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = AW * RES; c.height = AH * RES;
  const ctx = c.getContext('2d');
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  draw(ctx, shownDots(), RES);
  // Transparent, cropped to the pixels the dots cover.
  const { data } = ctx.getImageData(0, 0, c.width, c.height);
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0, o = y * c.width * 4 + 3; x < c.width; x++, o += 4) if (data[o]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return toast('No hay puntos para exportar.');
  const crop = document.createElement('canvas'); crop.width = x1 - x0 + 1; crop.height = y1 - y0 + 1;
  crop.getContext('2d').drawImage(c, -x0, -y0);
  crop.toBlob(b => b ? download(`d3-${S.seed}.png`, b) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => {
  toast('Unificando el SVG…');
  setTimeout(() => download(`d3-${S.seed}.svg`, new Blob([toSvg(shownDots())], { type: 'image/svg+xml' })), 30);
});

setTool('move');
sync();
