<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Dispersion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; padding-bottom: 32px; }
.frame { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px var(--line); touch-action: none; cursor: none; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .15s ease-out; }
.frame.busy #cv { opacity: .6; }
.frame #ov { pointer-events: none; opacity: 0; transition: opacity .2s ease-out; }
.frame.show-mask #ov { opacity: 1; }
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%; border: 1px solid #fff; mix-blend-mode: difference; transform: translate(-50%, -50%); }
.cursor.erase { border-style: dashed; }
.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; border: 1.5px dashed var(--text-2); background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--text); font-weight: 500; pointer-events: none; z-index: 2; }
.hud { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; white-space: nowrap;
  background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 6px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.hud kbd { font: 500 11px var(--mono); color: var(--text); }
.hud .dim { color: var(--text-3); }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }
.hint { margin: 0; color: var(--text-3); font-size: 12px; }

.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
.slider.emph label { color: var(--text); font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }

.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.btns { display: flex; gap: 6px; }
.btns .btn { flex: 1; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }

footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
[hidden] { display: none !important; }

@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
  .hud .dim { display: none; }
}
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<div class="app">
  <main id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" role="img" aria-label="Imagen convertida en cubos, con una zona dispersada"></canvas>
      <canvas id="ov" aria-hidden="true"></canvas>
      <div class="cursor" id="cursor" hidden></div>
    </div>
    <div class="drop" id="drop" hidden>Soltá la imagen</div>
    <div class="hud"><span id="stats">—</span><span class="dim"><kbd>B</kbd> pincel · <kbd>E</kbd> borrar · <kbd>[</kbd><kbd>]</kbd> tamaño · <kbd>⌘Z</kbd> deshacer</span></div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Imagen</h2>
        <button class="btn" id="upload">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
          Subir imagen
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <p class="hint">También podés arrastrarla o pegarla.</p>
        <div class="seg" data-key="pattern" aria-label="Trama">
          <button data-v="scatter">Dispersa</button><button data-v="grid">Rejilla</button>
        </div>
        <div id="sl-contrast"></div>
        <div id="sl-threshold"></div>
        <label class="check"><input type="checkbox" data-check="invert"> Invertir luces y sombras</label>
      </section>

      <section>
        <h2>Cubos</h2>
        <div class="seg" data-key="shape" aria-label="Forma">
          <button data-v="flat">Plano</button><button data-v="iso">Isométrico</button>
        </div>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-mod"></div>
        <div id="sl-variation"></div>
      </section>

      <section>
        <h2>Selección</h2>
        <p class="hint">Pintá sobre la imagen la zona que se dispersa.</p>
        <div class="seg" data-key="tool" aria-label="Herramienta">
          <button data-v="paint">Pincel</button><button data-v="erase">Borrar</button>
        </div>
        <div id="sl-brush"></div>
        <div id="sl-soft"></div>
        <div class="btns">
          <button class="btn" id="undo">Deshacer</button>
          <button class="btn" id="mask-invert">Invertir</button>
          <button class="btn" id="mask-clear">Limpiar</button>
        </div>
        <label class="check"><input type="checkbox" data-check="showMask"> Mostrar selección</label>
      </section>

      <section>
        <h2>Dispersión</h2>
        <div class="seg" data-key="mode" aria-label="Modo de dispersión">
          <button data-v="dir">Dirección</button><button data-v="radial">Radial</button><button data-v="flow">Flujo</button>
        </div>
        <div id="sl-angle"></div>
        <div id="sl-dist"></div>
        <div id="sl-detach"></div>
        <div id="sl-spread"></div>
        <div id="sl-turb"></div>
        <div id="sl-irreg"></div>
        <div id="sl-trail"></div>
        <div id="sl-endScale"></div>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Nueva semilla (R)" aria-label="Nueva semilla">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
        <label class="check"><input type="checkbox" data-check="keep"> Conservar la imagen original</label>
      </section>

      <section>
        <h2>Color</h2>
        <div class="seg" data-key="colorMode" aria-label="Color de los cubos">
          <button data-v="ink">Tinta</button><button data-v="image">Imagen</button>
        </div>
        <div class="row" id="ink-row" style="grid-template-columns:56px 1fr">
          <span>Tinta</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="ink" aria-label="Tinta"></label>
        </div>
        <div id="sl-grain"></div>
        <div class="row" style="grid-template-columns:56px 1fr">
          <span>Fondo</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="paper" aria-label="Fondo"></label>
        </div>
        <label class="check"><input type="checkbox" data-check="bgExport"> Incluir fondo al exportar</label>
      </section>
    </div>
    <footer>
      <button class="btn primary big" id="png">Exportar PNG</button>
      <button class="btn big" id="svg">Exportar SVG</button>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
const LONG = 3000;   // export size of the long side
const GRID = 480;    // luminance grid, long side
const MASK = 320;    // selection mask, long side
const DEFAULTS = {
  seed: 1,
  pattern: 'scatter', contrast: 1.2, threshold: .15, invert: false,
  shape: 'flat', count: 50000, size: 12, mod: .7, variation: .35,
  tool: 'paint', brush: 260, soft: .6, showMask: false,
  mode: 'dir', angle: 345, dist: .3, detach: .75, spread: .2, turb: .45, irreg: .6, trail: .35, endScale: .55, keep: false,
  colorMode: 'ink', ink: '#1a1714', grain: .05, paper: '#ede6da', bgExport: false,
};
const S = structuredClone(DEFAULTS);

// ---------- Noise ----------
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function perlin(rand) {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  return (x, y) => {
    const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
    const u = fade(xf), v = fade(yf);
    const aa = p[p[xi] + yi], ab = p[p[xi] + yi + 1], ba = p[p[xi + 1] + yi], bb = p[p[xi + 1] + yi + 1];
    const x1 = g(aa, xf, yf) + u * (g(ba, xf - 1, yf) - g(aa, xf, yf));
    const x2 = g(ab, xf, yf - 1) + u * (g(bb, xf - 1, yf - 1) - g(ab, xf, yf - 1));
    return x1 + v * (x2 - x1);
  };
}
// Two-octave noise with a few independent offsets (o picks the channel).
function noiseKit(seed) {
  const rand = rng(seed * 7919 + 13), n = perlin(rand);
  const off = Array.from({ length: 6 }, () => rand() * 200);
  return (x, y, o) => n(x + off[o], y + off[o + 1]) * .67 + n(x * 2.03 + off[o], y * 2.03 + off[o + 1]) * .33;
}
// Stateless per-cube random, so painting one area never reshuffles the rest.
function hash(a, b) {
  let t = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x632BE5AB, 0xC2B2AE35);
  t ^= t >>> 15; t = Math.imul(t, 0x2C1B3C6D); t ^= t >>> 12; t = Math.imul(t, 0x297A2D39); t ^= t >>> 15;
  return (t >>> 0) / 4294967296;
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- Source image ----------
let src = null, srcId = 0;
let mask = null, MW = 0, MH = 0, maskVer = 0, centroid = [0, 0];
const undoStack = [];

function loadSource(img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const W = iw >= ih ? LONG : Math.round(LONG * iw / ih), H = iw >= ih ? Math.round(LONG * ih / iw) : LONG;
  const gw = Math.max(2, Math.round(GRID * W / LONG)), gh = Math.max(2, Math.round(GRID * H / LONG));
  // Halve in steps so big photos downsample without aliasing.
  let cur = img, cw = iw, ch = ih;
  while (cw / 2 > gw && ch / 2 > gh) {
    cw = Math.round(cw / 2); ch = Math.round(ch / 2);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, cw, ch);
    cur = c;
  }
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, gw, gh);
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(cur, 0, 0, gw, gh);
  const d = ctx.getImageData(0, 0, gw, gh).data, n = gw * gh;
  const lum = new Float32Array(n), rgb = new Uint32Array(n);
  for (let k = 0; k < n; k++) {
    const r = d[k * 4], g = d[k * 4 + 1], b = d[k * 4 + 2];
    lum[k] = (.2126 * r + .7152 * g + .0722 * b) / 255;
    rgb[k] = r << 16 | g << 8 | b;
  }
  src = { W, H, gw, gh, lum, rgb }; srcId++;
  MW = Math.max(2, Math.round(MASK * W / LONG)); MH = Math.max(2, Math.round(MASK * H / LONG));
  mask = new Float32Array(MW * MH); undoStack.length = 0; maskChanged();
}

// A shaded sphere so the page has something to disperse before an upload.
function sampleImage() {
  const c = document.createElement('canvas'); c.width = 1500; c.height = 1000;
  const x = c.getContext('2d');
  x.fillStyle = '#ebe7e0'; x.fillRect(0, 0, 1500, 1000);
  x.save(); x.translate(800, 830); x.scale(1, .2);
  let g = x.createRadialGradient(0, 0, 0, 0, 0, 480);
  g.addColorStop(0, 'rgba(20,18,16,.85)'); g.addColorStop(1, 'rgba(20,18,16,0)');
  x.fillStyle = g; x.fillRect(-520, -520, 1040, 1040); x.restore();
  g = x.createRadialGradient(600, 320, 10, 700, 450, 330);
  g.addColorStop(0, '#f4f1ec'); g.addColorStop(.45, '#8b857c'); g.addColorStop(1, '#151311');
  x.fillStyle = g; x.beginPath(); x.arc(700, 450, 330, 0, Math.PI * 2); x.fill();
  return c;
}

// ---------- Selection mask ----------
function maskChanged() {
  maskVer++;
  let sw = 0, sx = 0, sy = 0;
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) { const m = mask[j * MW + i]; sw += m; sx += m * (i + .5); sy += m * (j + .5); }
  centroid = sw > 0 ? [sx / sw / MW * src.W, sy / sw / MH * src.H] : [src.W / 2, src.H / 2];
}
function maskAt(x, y) {
  const fx = x / src.W * MW - .5, fy = y / src.H * MH - .5;
  const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j;
  const i0 = clamp(i, 0, MW - 1), i1 = clamp(i + 1, 0, MW - 1), j0 = clamp(j, 0, MH - 1), j1 = clamp(j + 1, 0, MH - 1);
  return (mask[j0 * MW + i0] * (1 - u) + mask[j0 * MW + i1] * u) * (1 - v) + (mask[j1 * MW + i0] * (1 - u) + mask[j1 * MW + i1] * u) * v;
}
function stamp(x, y, r, soft, erase) {
  const sx = MW / src.W, sy = MH / src.H, cx = x * sx, cy = y * sy, rx = r * sx, ry = r * sy, hard = 1 - soft;
  for (let j = Math.max(0, Math.floor(cy - ry)); j <= Math.min(MH - 1, Math.ceil(cy + ry)); j++) {
    for (let i = Math.max(0, Math.floor(cx - rx)); i <= Math.min(MW - 1, Math.ceil(cx + rx)); i++) {
      const d = Math.hypot((i + .5 - cx) / rx, (j + .5 - cy) / ry);
      if (d >= 1) continue;
      let v = 1;
      if (d > hard) { const t = (d - hard) / (1 - hard); v = 1 - t * t * (3 - 2 * t); }
      const k = j * MW + i;
      mask[k] = erase ? Math.min(mask[k], 1 - v) : Math.max(mask[k], v);
    }
  }
}
function pushUndo() { undoStack.push(mask.slice()); if (undoStack.length > 40) undoStack.shift(); }
function undo() { if (!undoStack.length) return; mask = undoStack.pop(); maskChanged(); schedule(); }

// ---------- Generation ----------
const SQ3 = Math.sqrt(3);
const STRIDE = 5; // x, y, size, shade, rgb
const SHADES = 9;
function buffer(n) { return { a: new Float32Array(Math.max(64, n) * STRIDE), n: 0 }; }
function push(b, x, y, s, sh, c) {
  if ((b.n + 1) * STRIDE > b.a.length) { const a = new Float32Array(b.a.length * 2); a.set(b.a); b.a = a; }
  const o = b.n++ * STRIDE;
  b.a[o] = x; b.a[o + 1] = y; b.a[o + 2] = s; b.a[o + 3] = sh; b.a[o + 4] = c;
}

// Image → cubes. Darkness above the threshold becomes density (scatter) or square size (grid).
function generateBase(st) {
  const { W, H, gw, gh, lum, rgb } = src;
  const n = gw * gh, cw = W / gw, ch = H / gh, t = st.threshold;
  const M = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const v = clamp(((st.invert ? lum[k] : 1 - lum[k]) - .5) * st.contrast + .5);
    M[k] = t >= 1 ? -1 : (v - t) / (1 - t);
  }
  const rand = rng(st.seed);
  const sizeOf = m => (1 - st.mod) + st.mod * Math.sqrt(Math.max(m, .04));
  const out = buffer(st.pattern === 'grid' ? 4096 : st.count);
  if (st.pattern === 'grid') {
    const cell = Math.max(st.size * 1.1, LONG / 500);
    for (let y = cell / 2; y < H; y += cell) for (let x = cell / 2; x < W; x += cell) {
      const k = Math.min(gh - 1, Math.floor(y / ch)) * gw + Math.min(gw - 1, Math.floor(x / cw)), m = M[k];
      if (m <= 0) continue;
      const v = 1 + st.variation * (rand() * 2 - 1) * .5, j = st.variation * cell * .3;
      push(out, x + (rand() - .5) * j, y + (rand() - .5) * j, st.size * sizeOf(m) * Math.max(.15, v), Math.floor(rand() * SHADES), rgb[k]);
    }
  } else {
    const cdf = new Float64Array(n); let sum = 0;
    for (let k = 0; k < n; k++) cdf[k] = sum += M[k] > 0 ? M[k] ** 1.2 : 0;
    if (sum > 0) for (let c = 0; c < st.count; c++) {
      const r = rand() * sum; let lo = 0, hi = n - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < r) lo = mid + 1; else hi = mid; }
      const i = lo % gw, j = (lo - i) / gw;
      const v = 1 + st.variation * (rand() * 2 - 1) * .7;
      push(out, (i + rand()) * cw, (j + rand()) * ch, st.size * sizeOf(M[lo]) * Math.max(.15, v), Math.floor(rand() * SHADES), rgb[lo]);
    }
  }
  return { W, H, items: out.a.subarray(0, out.n * STRIDE) };
}

// Cubes under the selection break loose and travel along a path (direction, radial or noise flow),
// dropping a trail of smaller cubes as they go.
function disperse(st, base) {
  const { W, H, items } = base, cnt = items.length / STRIDE;
  const out = buffer(cnt * 1.5);
  const unit = Math.min(W, H), far = Math.max(W, H);
  const noise = noiseKit(st.seed), tf = 2.4 / unit, sf = 7 / unit;
  const ang = st.angle * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
  const turb = st.mode === 'flow' ? 1 : st.turb * 1.6;
  const N = 14, px = new Float32Array(N + 1), py = new Float32Array(N + 1);
  const sb = st.seed * 64;
  let moved = 0;
  for (let i = 0; i < cnt; i++) {
    const o = i * STRIDE, x = items[o], y = items[o + 1], s = items[o + 2], sh = items[o + 3], c = items[o + 4];
    const m = maskAt(x, y);
    if (m <= .002 || hash(i, sb) >= st.detach * m) { push(out, x, y, s, sh, c); continue; }
    moved++;
    if (st.keep) push(out, x, y, s, sh, c);
    let dx = 0, dy = 0;
    if (st.mode === 'dir') { dx = ca; dy = sa; }
    else if (st.mode === 'radial') {
      dx = x - centroid[0]; dy = y - centroid[1];
      const l = Math.hypot(dx, dy);
      if (l < 1e-3) { const a = hash(i, sb + 1) * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); } else { dx /= l; dy /= l; }
    }
    const rot = (hash(i, sb + 2) - .5) * st.spread * Math.PI, rc = Math.cos(rot), rs = Math.sin(rot);
    // Low-frequency streaks make neighbours travel similar distances, so the trails read as texture.
    const streak = clamp(.55 + noise(x * sf, y * sf, 2) * 1.8, .05, 1.3);
    const L = st.dist * far * m ** .6 * lerp(1, .25 + .75 * hash(i, sb + 3), st.irreg * .8) * lerp(1, streak, st.irreg), step = L / N;
    px[0] = x; py[0] = y;
    for (let k = 1; k <= N; k++) {
      const a = noise(px[k - 1] * tf, py[k - 1] * tf, 0) * Math.PI * 3;
      let vx = dx + turb * Math.cos(a), vy = dy + turb * Math.sin(a);
      const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      px[k] = px[k - 1] + (vx * rc - vy * rs) * step;
      py[k] = py[k - 1] + (vx * rs + vy * rc) * step;
    }
    const echoes = Math.floor(st.trail * 10 * m * (.35 + .65 * hash(i, sb + 4)) + hash(i, sb + 5));
    for (let e = 1; e <= echoes; e++) {
      const t = clamp((e + (hash(i, sb + 10 + e) - .5) * .8) / (echoes + 1), 0, 1);
      const f = t * N, k0 = Math.min(N - 1, f | 0), u = f - k0;
      push(out, px[k0] + (px[k0 + 1] - px[k0]) * u, py[k0] + (py[k0 + 1] - py[k0]) * u,
        s * lerp(1, st.endScale, t) * (.55 + .45 * hash(i, sb + 30 + e)), sh, c);
    }
    push(out, px[N], py[N], s * st.endScale, sh, c);
  }
  let res = out.a.subarray(0, out.n * STRIDE);
  if (st.shape === 'iso') {
    // Iso cubes paint back to front so the faces occlude correctly.
    const idx = Array.from({ length: out.n }, (_, i) => i).sort((a, b) => res[a * STRIDE + 1] - res[b * STRIDE + 1]);
    const sorted = new Float32Array(out.n * STRIDE);
    idx.forEach((s, d) => sorted.set(res.subarray(s * STRIDE, s * STRIDE + STRIDE), d * STRIDE));
    res = sorted;
  }
  return { W, H, items: res, moved };
}

// ---------- Color (OKLab) ----------
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toLin = c => (c /= 255) <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
const toSrgb = c => Math.round(255 * Math.min(1, Math.max(0, c <= .0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - .055)));
function rgbToLab([r, g, b]) {
  r = toLin(r); g = toLin(g); b = toLin(b);
  const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
  return [.2104542553 * l + .793617785 * m - .0040720468 * s, 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .808675766 * s];
}
function labToHex([L, a, b]) {
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const rgb = [toSrgb(4.0767416621 * l - 3.3077115913 * m + .2309699292 * s), toSrgb(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s), toSrgb(-.0041960863 * l - .7034186147 * m + 1.707614701 * s)];
  return '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
}
// Ink mode: one ink split into a few shades, ±grain in lightness.
function buildLut(st) {
  const [L, a, b] = rgbToLab(hexToRgb(st.ink));
  const base = [], top = [], right = [];
  for (let i = 0; i < SHADES; i++) {
    const l = L + (i / (SHADES - 1) * 2 - 1) * st.grain;
    base.push(labToHex([l, a, b]));
    top.push(labToHex([l + .14, a, b]));
    right.push(labToHex([l - .14, a * .9, b * .9]));
  }
  return { base, top, right };
}
// Image mode: colors quantized to 5 bits per channel so flat squares can still be batched.
const faceCache = new Map();
function imageFaces(c) {
  const key = c & 0xF8F8F8;
  let f = faceCache.get(key);
  if (!f) {
    const [L, a, b] = rgbToLab([key >> 16 & 255, key >> 8 & 255, key & 255]);
    f = [labToHex([L + .12, a, b]), labToHex([L, a, b]), labToHex([L - .14, a * .9, b * .9])];
    faceCache.set(key, f);
  }
  return f;
}

// ---------- Rendering ----------
function isoFaces(x, y, e) {
  const h = e * SQ3 / 2;
  return {
    top: [x, y - e, x + h, y - e / 2, x, y, x - h, y - e / 2],
    left: [x - h, y - e / 2, x, y, x, y + e, x - h, y + e / 2],
    right: [x, y, x + h, y - e / 2, x + h, y + e / 2, x, y + e],
  };
}
function squareOf(x, y, s) {
  const h = s / 2;
  return [x - h, y - h, x + h, y - h, x + h, y + h, x - h, y + h];
}
function poly(ctx, p) { ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); }

// Flat squares are grouped per color (one fill each); iso cubes keep their back-to-front order.
function eachRun(it, st, lut, fn) {
  const ink = st.colorMode === 'ink';
  if (st.shape === 'flat') {
    const groups = new Map();
    for (let i = 0; i < it.length; i += STRIDE) {
      const key = ink ? lut.base[it[i + 3]] : imageFaces(it[i + 4])[1];
      let g = groups.get(key); if (!g) groups.set(key, g = []);
      g.push(squareOf(it[i], it[i + 1], it[i + 2]));
    }
    groups.forEach((polys, color) => fn(color, polys));
  } else {
    for (let i = 0; i < it.length; i += STRIDE) {
      const k = it[i + 3], f = isoFaces(it[i], it[i + 1], it[i + 2] / SQ3);
      const [top, left, right] = ink ? [lut.top[k], lut.base[k], lut.right[k]] : imageFaces(it[i + 4]);
      fn(top, [f.top]); fn(left, [f.left]); fn(right, [f.right]);
    }
  }
}
function draw(ctx, gen, st, lut) {
  eachRun(gen.items, st, lut, (color, polys) => {
    ctx.fillStyle = color; ctx.beginPath();
    for (const p of polys) poly(ctx, p);
    ctx.fill();
  });
}
function toSvg(gen, st, lut) {
  const r = v => Math.round(v * 10) / 10, out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${gen.W}" height="${gen.H}" viewBox="0 0 ${gen.W} ${gen.H}">`);
  if (st.bgExport) out.push(`<rect width="100%" height="100%" fill="${st.paper}"/>`);
  const pd = p => { let s = `M${r(p[0])} ${r(p[1])}`; for (let i = 2; i < p.length; i += 2) s += `L${r(p[i])} ${r(p[i + 1])}`; return s + 'Z'; };
  eachRun(gen.items, st, lut, (color, polys) => out.push(`<path fill="${color}" d="${polys.map(pd).join('')}"/>`));
  out.push('</svg>');
  return out.join('');
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), ov = $('#ov'), frame = $('#frame'), stage = $('#stage'), cursor = $('#cursor');
let base = null, baseKey = '', gen = null, genKey = '', lut = null, raf = 0, ovVer = -1, painting = false;

const pct = v => Math.round(v * 100) + '%';
const SLIDERS = {
  contrast: { label: 'Contraste', min: .3, max: 4, step: .05, fmt: v => v.toFixed(2) },
  threshold: { label: 'Umbral', min: 0, max: .99, step: .01, fmt: pct, emph: true },
  count: { label: 'Cubos', min: 1000, max: 150000, step: 500, fmt: v => v < 10000 ? v.toLocaleString('es') : Math.round(v / 1000) + 'k' },
  size: { label: 'Tamaño', min: 2, max: 80, step: .5, fmt: v => v + ' px' },
  mod: { label: 'Tamaño según tono', min: 0, max: 1, step: .01, fmt: pct },
  variation: { label: 'Variación', min: 0, max: 1, step: .01, fmt: pct },
  brush: { label: 'Tamaño del pincel', min: 20, max: 900, step: 5, fmt: v => v + ' px' },
  soft: { label: 'Suavidad', min: 0, max: 1, step: .01, fmt: pct },
  angle: { label: 'Ángulo', min: 0, max: 360, step: 1, fmt: v => v + '°' },
  dist: { label: 'Distancia', min: 0, max: 1, step: .01, fmt: pct, emph: true },
  detach: { label: 'Desprendimiento', min: 0, max: 1, step: .01, fmt: pct },
  spread: { label: 'Apertura', min: 0, max: 1, step: .01, fmt: pct },
  turb: { label: 'Turbulencia', min: 0, max: 1, step: .01, fmt: pct },
  irreg: { label: 'Irregularidad', min: 0, max: 1, step: .01, fmt: pct },
  trail: { label: 'Estela', min: 0, max: 1, step: .01, fmt: pct },
  endScale: { label: 'Escala al dispersarse', min: .1, max: 1.5, step: .01, fmt: pct },
  grain: { label: 'Variación de tono', min: 0, max: .2, step: .005, fmt: pct },
};
for (const [key, d] of Object.entries(SLIDERS)) {
  const host = $('#sl-' + key);
  host.className = 'slider' + (d.emph ? ' emph' : '');
  host.innerHTML = `<label for="in-${key}">${d.label}</label><output id="out-${key}"></output><input type="range" id="in-${key}" min="${d.min}" max="${d.max}" step="${d.step}" title="Doble clic para restablecer">`;
  const input = host.querySelector('input');
  input.addEventListener('input', () => { S[key] = +input.value; sync(); });
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; sync(); });
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[seg.dataset.key] = b.dataset.v; sync();
}));
document.querySelectorAll('[data-color]').forEach(inp => inp.addEventListener('input', () => { S[inp.dataset.color] = inp.value; sync(); }));
document.querySelectorAll('[data-check]').forEach(inp => inp.addEventListener('change', () => { S[inp.dataset.check] = inp.checked; sync(); }));
$('#seed').addEventListener('input', e => { S.seed = Math.min(999999999, parseInt(e.target.value.replace(/\D/g, '') || '0', 10)); sync(); });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); sync(); };
$('#reseed').addEventListener('click', reseed);
$('#undo').addEventListener('click', undo);
$('#mask-invert').addEventListener('click', () => { pushUndo(); for (let k = 0; k < mask.length; k++) mask[k] = 1 - mask[k]; maskChanged(); schedule(); });
$('#mask-clear').addEventListener('click', () => { pushUndo(); mask.fill(0); maskChanged(); schedule(); });
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'r') reseed();
  else if (k === 'b') { S.tool = 'paint'; sync(); }
  else if (k === 'e') { S.tool = 'erase'; sync(); }
  else if (k === '[' || k === ']') { const d = SLIDERS.brush; S.brush = clamp(Math.round(S.brush * (k === ']' ? 1.15 : 1 / 1.15) / 5) * 5, d.min, d.max); sync(); }
});

function paintSwatch(el, hex) {
  el.querySelector('i').style.background = hex;
  el.querySelector('[data-hex]').textContent = hex.toUpperCase();
  const inp = el.querySelector('input'); if (inp.value !== hex) inp.value = hex;
}

function sync() {
  for (const key of Object.keys(SLIDERS)) {
    const input = $('#in-' + key), d = SLIDERS[key];
    if (+input.value !== S[key]) input.value = S[key];
    input.style.setProperty('--p', ((S[key] - d.min) / (d.max - d.min) * 100) + '%');
    $('#out-' + key).textContent = d.fmt(S[key]);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[seg.dataset.key])));
  document.querySelectorAll('[data-check]').forEach(inp => inp.checked = S[inp.dataset.check]);
  const seedEl = $('#seed'); if (seedEl.value !== String(S.seed)) seedEl.value = S.seed;
  $('#sl-count').hidden = S.pattern === 'grid';
  $('#sl-angle').hidden = S.mode !== 'dir';
  $('#sl-turb').hidden = S.mode === 'flow';
  $('#ink-row').hidden = $('#sl-grain').hidden = S.colorMode !== 'ink';
  document.querySelectorAll('[data-color]').forEach(inp => paintSwatch(inp.closest('.swatch'), S[inp.dataset.color]));
  cursor.classList.toggle('erase', S.tool === 'erase');
  lut = buildLut(S);
  schedule();
}

const baseKeyOf = () => JSON.stringify([srcId, S.seed, S.pattern, S.contrast, S.threshold, S.invert, S.count, S.size, S.mod, S.variation]);
function fit() {
  const { W, H } = src, r = stage.getBoundingClientRect();
  const k = Math.max(0, Math.min((r.width - 64) / W, (r.height - 96) / H));
  return { w: Math.round(W * k), h: Math.round(H * k), W, H };
}
function schedule() {
  cancelAnimationFrame(raf);
  if (baseKeyOf() !== baseKey) { frame.classList.add('busy'); raf = requestAnimationFrame(() => setTimeout(render, 0)); }
  else raf = requestAnimationFrame(render);
}
function render() {
  const bk = baseKeyOf();
  if (bk !== baseKey) { base = generateBase(S); baseKey = bk; }
  const gk = JSON.stringify([bk, maskVer, S.shape, S.mode, S.angle, S.dist, S.detach, S.spread, S.turb, S.irreg, S.trail, S.endScale, S.keep]);
  if (gk !== genKey) { gen = disperse(S, base); genKey = gk; }
  const { w, h, W, H } = fit();
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; frame.style.background = S.paper;
  const dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  const ctx = cv.getContext('2d');
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  draw(ctx, gen, S, lut);
  if (ovVer !== maskVer) paintOverlay();
  frame.classList.toggle('show-mask', S.showMask || painting);
  frame.classList.remove('busy');
  const total = gen.items.length / STRIDE;
  $('#stats').textContent = `${total.toLocaleString('es')} cubos · ${gen.moved.toLocaleString('es')} sueltos · ${W} × ${H} px`;
}
function paintOverlay() {
  ov.width = MW; ov.height = MH;
  const ctx = ov.getContext('2d'), img = ctx.createImageData(MW, MH), d = img.data;
  for (let k = 0; k < mask.length; k++) { d[k * 4] = 255; d[k * 4 + 1] = 90; d[k * 4 + 2] = 31; d[k * 4 + 3] = mask[k] * 110; }
  ctx.putImageData(img, 0, 0);
  ovVer = maskVer;
}
new ResizeObserver(schedule).observe(stage);

// ---------- Painting ----------
let last = null;
function toImage(e) {
  const r = frame.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * src.W, (e.clientY - r.top) / r.height * src.H];
}
function moveCursor(e) {
  const r = frame.getBoundingClientRect(), d = 2 * S.brush * r.width / src.W;
  cursor.hidden = false;
  cursor.style.width = cursor.style.height = d + 'px';
  cursor.style.left = (e.clientX - r.left) + 'px'; cursor.style.top = (e.clientY - r.top) + 'px';
}
function strokeTo(p) {
  const erase = S.tool === 'erase';
  if (!last) stamp(p[0], p[1], S.brush, S.soft, erase);
  else {
    const dist = Math.hypot(p[0] - last[0], p[1] - last[1]), n = Math.max(1, Math.ceil(dist / (S.brush * .2)));
    for (let k = 1; k <= n; k++) stamp(lerp(last[0], p[0], k / n), lerp(last[1], p[1], k / n), S.brush, S.soft, erase);
  }
  last = p; maskChanged(); schedule();
}
frame.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  frame.setPointerCapture(e.pointerId);
  painting = true; last = null; pushUndo(); strokeTo(toImage(e)); moveCursor(e);
});
frame.addEventListener('pointermove', e => { moveCursor(e); if (painting) strokeTo(toImage(e)); });
const endStroke = () => { if (!painting) return; painting = false; last = null; schedule(); };
frame.addEventListener('pointerup', endStroke);
frame.addEventListener('pointercancel', endStroke);
frame.addEventListener('pointerleave', () => { if (!painting) cursor.hidden = true; });

// ---------- Image input ----------
function openFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast('Eso no parece una imagen.');
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); loadSource(img); schedule(); toast('Imagen cargada. Pintá la zona a dispersar.'); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen.'); };
  img.src = url;
}
$('#upload').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; openFile(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) openFile(item.getAsFile());
});

// ---------- Export ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' descargado');
}
$('#png').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = gen.W; c.height = gen.H;
  const ctx = c.getContext('2d');
  if (S.bgExport) { ctx.fillStyle = S.paper; ctx.fillRect(0, 0, gen.W, gen.H); }
  draw(ctx, gen, S, lut);
  c.toBlob(b => b ? download(`dispersion-${S.seed}.png`, b) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => download(`dispersion-${S.seed}.svg`, new Blob([toSvg(gen, S, lut)], { type: 'image/svg+xml' })));

// Start with the sample sphere and a selection over its right flank.
loadSource(sampleImage());
stamp(src.W * .6, src.H * .42, src.W * .16, .7, false); maskChanged();
sync();
</script>
</body>
