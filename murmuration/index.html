<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuraciones</title>
<link rel="stylesheet" href="../vendor/dialkit/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee; --surface: #fbfaf8; --fill: #efece7; --line: #dcd7cf;
  --text: #1a1714; --text-2: #5e5850; --text-3: #8f887e; --accent: #1a1714; --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #161513; --surface: #1d1c1a; --fill: #282624; --line: #34312d; --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #161513; --surface: #1d1c1a; --fill: #282624; --line: #34312d; --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgb(0 0 0 / .08); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.drag::after { content: "Soltá la foto"; position: absolute; inset: 12px; display: grid; place-items: center; border: 2px dashed var(--text-3); border-radius: 14px; background: color-mix(in srgb, var(--page) 80%, transparent); font: 500 15px var(--font); color: var(--text); z-index: 8; pointer-events: none; }

/* The source card, top right: generate or translate a photo, new seed, export. */
.card { position: absolute; top: 14px; right: 14px; width: 236px; display: flex; flex-direction: column; gap: 10px; padding: 12px; z-index: 5;
  background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgb(0 0 0 / .1); }
.card h2 { margin: 0; font-size: 12px; font-weight: 600; }
.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.btns { display: flex; gap: 6px; }
.btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .88; }
.seg button:focus-visible, .btn:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.drop { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; border: 1px dashed var(--line); background: var(--fill); color: var(--text-2); font-size: 12px; cursor: pointer; text-align: left; font-family: var(--font); }
.drop:hover { border-color: var(--text-3); }
.drop img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex: none; }
.drop .ph { width: 40px; height: 40px; border-radius: 6px; flex: none; display: grid; place-items: center; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.drop b { display: block; color: var(--text); font-weight: 500; }
.hint { margin: 0; color: var(--text-3); font-size: 11px; line-height: 1.45; }
.m3d { display: flex; flex-direction: column; gap: 8px; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; color: var(--text-2); font-size: 12px; }
.field select { grid-column: 1 / -1; height: 28px; border-radius: 8px; border: 0; padding: 0 8px; background: var(--fill); color: var(--text); font: 500 12px var(--font); box-shadow: inset 0 0 0 1px var(--line); }
.field output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.field input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--text); }
.field select:focus-visible, .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stats { margin: 0; font: 11px var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 12px; border-radius: 8px; background: var(--text); color: var(--page); font: 500 12px var(--font); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; }
@media (max-width: 700px) { .card { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; } }
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<main class="stage" id="stage">
  <div class="frame" id="frame"><canvas id="cv" aria-label="Murmuración de puntos"></canvas></div>
  <section class="card" aria-labelledby="src-h">
    <h2 id="src-h">Fuente</h2>
    <div class="seg" id="mode" role="group" aria-label="Fuente">
      <button type="button" data-v="gen" aria-pressed="true">Generar</button>
      <button type="button" data-v="photo" aria-pressed="false">Foto</button>
      <button type="button" data-v="model" aria-pressed="false">3D</button>
    </div>
    <button type="button" class="drop" id="drop" title="Elegí una foto o soltala sobre el lienzo">
      <span class="ph" id="thumb-ph" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="m3 14.5 4.5-4 3 2.5 3-3 4 3.5"/></svg></span>
      <img id="thumb" alt="" hidden>
      <span><b id="drop-t">Subir una foto</b><span id="drop-s">o soltala sobre el lienzo</span></span>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="m3d" id="m3d" hidden>
      <label class="field"><span>Modelo</span>
        <select id="model">
          <option value="sphere">Esfera</option><option value="cube" selected>Cubo</option><option value="cylinder">Cilindro</option><option value="cone">Cono</option>
          <option value="torus">Toro</option><option value="pyramid">Pirámide</option><option value="octahedron">Octaedro</option>
        </select>
      </label>
      <label class="field slide"><span>Vuelta</span><output id="turn-out">8 s</output><input type="range" id="turn" min="2" max="60" step="0.5" value="8" aria-label="Segundos por vuelta"></label>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="seed" title="Otra variación con los mismos parámetros (R)">Nueva semilla</button>
    </div>
    <div class="btns">
      <button type="button" class="btn primary" id="png">PNG</button>
      <button type="button" class="btn" id="svg">SVG</button>
    </div>
    <p class="stats" id="stats"></p>
    <p class="hint">Pasá el mouse por los puntos para conectarlos. Todos los parámetros están en DialKit, abajo a la izquierda.</p>
  </section>
  <div class="toast" id="toast" role="status"></div>
</main>
<script src="../vendor/dialkit/browser.global.js" data-dialkit></script>
<script>
// Murmuraciones. Clouds of dots in the Pixel Connect style (the Percepta hero wave): dots on a square lattice,
// most of them small, some mid, a few big and slightly off the grid, thinning out at the edges with a few strays.

  const P = {

    contrast: 1.3, bright: 0, invert: false, thresh: .1, grain: .25, fit: 'cover', shapeMix: 0,
    bg: '#ffffff', dot: '#ced4e8', accent: '#7d91d9', floor: true, floorColor: '#dce0f2',

    flow: false, speed: .15,
    model: 'cube', turn: 8,

  // ---- noise (seeded gradient noise + fbm) ----

    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X0 = xi & 255, Y0 = yi & 255;

  // ---- the photo: tone per lattice cell (darker = more) ----

    if (!photo) return null;
    const cols = L.cols, rows = L.rows, c = document.createElement('canvas'), k = 4;
    c.width = cols * k; c.height = rows * k;
    const g = c.getContext('2d', { willReadFrequently: true });

    const iw = photo.naturalWidth, ih = photo.naturalHeight, sc = (P.fit === 'cover' ? Math.max : Math.min)(c.width / iw, c.height / ih);
    g.drawImage(photo, (c.width - iw * sc) / 2, (c.height - ih * sc) / 2, iw * sc, ih * sc);
    const small = document.createElement('canvas'); small.width = cols; small.height = rows;
    const sg = small.getContext('2d', { willReadFrequently: true }); sg.imageSmoothingQuality = 'high'; sg.drawImage(c, 0, 0, cols, rows);

  // ---- 3D models: basic solids, ray-marched once per lattice cell, turning about the vertical axis ----
  // Each cell casts one ray (perspective, camera at z = −5). Where it hits, the tone is the shading (the side away from
  // the light gets more and bigger dots, like ink), with a light texture fixed to the surface so the turn reads on round
  // solids too; misses near the silhouette fade with distance so the outline doesn't flicker as it turns.
  const len3 = (x, y, z) => Math.sqrt(x * x + y * y + z * z);

    sphere: (x, y, z) => len3(x, y, z) - 1,
    cube: (x, y, z) => { const r = .06, qx = Math.abs(x) - .72 + r, qy = Math.abs(y) - .72 + r, qz = Math.abs(z) - .72 + r; return len3(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; },

    const { cols, rows, step: s, ox, oy } = L, out = modelTone && modelTone.length === cols * rows ? modelTone : new Float32Array(cols * rows);
    const f = SDF[P.model] || SDF.cube, th = (reduce.matches ? .6 : 2 * Math.PI * t / Math.max(.5, P.turn)) + .6;

      while (t < tt - 1e-9) { const dt = Math.min(1 / fps, tt - t); t += dt; [H.px, H.py] = pathAt(keys, t); if (P.flow) flowT += dt * P.speed; if (mode === 'model') modelT += dt; if (P.flow || mode === 'model') generate(flowT); stepHover(dt); }
      if (i === 0) [H.px, H.py] = pathAt(keys, 0);
      const s = W / AW; draw(c, s);
      c.save(); c.translate(H.px - 1, H.py - 1); c.scale(cursorScale, cursorScale);
      c.lineJoin = 'round'; c.lineWidth = 1.6; c.strokeStyle = '#fff'; c.fillStyle = '#000';
      c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 2; c.shadowOffsetY = .6; c.stroke(ARROW); c.shadowColor = 'transparent'; c.fill(ARROW); c.restore();
    };
  }
  // DialKit-shaped values ({"Forma.Semilla": 1, …}, as "Copy parameters" gives them) applied to the page and the dials
  function apply(vals) {
    const upd = {};
    for (const [path, v] of Object.entries(vals)) {
      const key = MAP[path]; if (!key) continue;
      const [g, k] = path.split('.'); (upd[g] = upd[g] || {})[k] = v;
      if (key === 'seed') applySeed(v); else P[key] = v;
    }
    if (kit) kit.setValues(upd);
    syncModelUI(); layout(); photoTone = photoField(); H.targets = []; setHub(-1); dirty = true;
  }

  seedNoise(P.seed); layout(); requestAnimationFrame(tick);
  window.Murmuraciones = { P, regenerate: () => { dirty = true; }, setMode, film, apply, release: () => { filming = false; dirty = true; }, dots: () => { const o = []; for (let i = 0; i < D.length; i++) if (D[i] > 0) o.push([X[i], Y[i], D[i]]); return o; }, loadPhotoURL: url => fetch(url).then(r => r.blob()).then(b => loadPhoto(new File([b], url.split('/').pop(), { type: b.type || 'image/png' }))) };
})();
</script>
