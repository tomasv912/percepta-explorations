<!doctype html><meta charset="utf-8"><title>Keyframe property regression tests</title>
<pre id="results">Running…</pre>
<iframe id="tool" src="../pixel-model/" style="width:1200px;height:800px"></iframe>
<script>
window.testResults = (async () => {
  const frame = document.querySelector('#tool');
  await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  const w = frame.contentWindow;
  for (let i = 0; !w.eval('!!model && !!reliefSrc'); i++) {
    if (i > 200) throw Error('Image relief did not load');
    await new Promise(r => setTimeout(r, 100));
  }
  return w.eval(`(() => {
    const results = [], assert = (ok, label) => { if (!ok) throw Error(label); results.push(label); };
    const set = (key, value) => { const input = document.querySelector('#in-' + key); input.value = value; input.dispatchEvent(new Event('input', {bubbles:true})); };
    kfOpen(true);
    set('rlDepth', 0); set('sizeMax', 2); kfInsert('depth'); kfInsert('pixels');
    kfSeek(2); set('rlDepth', 1.5); set('sizeMax', 8); kfInsert('depth'); kfInsert('pixels');
    assert(kfAnimated() && kfCount() === 4, 'New tracks enable playback and count their keys');
    kfSeek(1);
    assert(S.rlDepth === .75 && S.sizeMax === 5 && S.size === 5, 'Scrubbing interpolates depth and rendered pixel size');
    const previousModel = model, list = kfFrame(2, true);
    assert(model !== previousModel && list.length > 0 && S.rlDepth === 1.5 && S.size === 8, 'Playback/export frame rebuilds geometry and applies pixel size');
    kfSeek(2); set('rlDepth', 1.8); set('sizeMax', 10);
    assert(KF.depth[1].v[0] === 1.8 && KF.pixels[1].v[1] === 10, 'Editing sliders on an existing key updates that key');
    KF.depth[0].ease = 'hold';
    assert(kfValue('depth', 1)[0] === 0 && kfValue('depth', 2)[0] === 1.8, 'Depth respects the selected easing curve');
    assert(kfValue('pixels', -1)[1] === 2 && kfValue('pixels', 10)[1] === 10, 'Pixel size holds at timeline endpoints');
    kfSeek(0);
    assert(S.sizeMin <= S.sizeMax && S.size === S.sizeMax, 'Pixel size bounds stay consistent after seeking backwards');
    document.querySelector('#kf-clear').click();
    assert(kfCount() === 0 && !kfAnimated(), 'Clear removes keys from both new tracks');
    S.dof = true; S.dofA = [.1, .2]; S.dofB = [.5, .6];
    KF.t = 0; kfInsert('depth');
    KF.t = 2; S.dofA = [.5, .6]; S.dofB = [.9, 1]; kfInsert('depth');
    const close = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 1e-8);
    kfSeek(1);
    assert(close(S.dofA, [.3, .4]) && close(S.dofB, [.7, .8]), 'Both depth handles interpolate between keys');
    const middleScale = dofK({x: AW * .5, y: AH * .6});
    kfFrame(2, true);
    assert(close(S.dofA, [.5, .6]) && close(S.dofB, [.9, 1]) && S.dof, 'Playback/export applies both depth handle positions and enabled state');
    assert(dofK({x: AW * .5, y: AH * .6}) !== middleScale, 'Animated depth handles change rendered pixel scale');
    kfSeek(2); S.dofA = [.6, .7]; window.kfHook();
    assert(close(KF.depth[1].v.slice(1, 3), [.6, .7]) && close(KF.depth[0].v.slice(1, 3), [.1, .2]), 'Editing a depth handle updates only the current key');
    KF.depth[0].ease = 'hold'; kfSeek(1);
    assert(close(S.dofA, [.1, .2]), 'Depth handles respect hold easing');
    document.querySelector('#kf-clear').click();
    return results;
  })()`);
})().then(results => { document.querySelector('#results').textContent = results.map(r => 'PASS ' + r).join('\n'); return results; }).catch(error => { document.querySelector('#results').textContent = 'FAIL ' + error.message; throw error; });
</script>
