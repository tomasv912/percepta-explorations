<!doctype html><meta charset="utf-8"><title>Media timeline regression tests</title>
<pre id="results">Running…</pre>
<iframe id="tool" src="../pixel-model/" style="width:1200px;height:800px"></iframe>
<script>
window.testResults = (async () => {
  const frame = document.querySelector('#tool');
  await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  return frame.contentWindow.eval(`(async () => {
    const results = [], assert = (ok, name) => { if (!ok) throw Error(name); results.push(name); };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const bytes = [], writer = new GifWriter(bytes, 4, 4, {palette:[0x222222,0x888888,0xdddddd,0],loop:0});
    for (let i=0;i<3;i++) writer.addFrame(0,0,4,4,new Uint8Array(16).fill(i),{delay:100});
    writer.end();
    const gif = new File([new Uint8Array(bytes)], 'timeline.gif', {type:'image/gif'});
    async function check(file, kind) {
      await openFile(file);
      assert(videoSource?.kind === kind, kind + ': loads');
      kfOpen(true); await kfMediaWork;
      const time = videoSource.currentTime;
      await wait(120);
      assert(videoSource.paused && videoSource.currentTime === time && !KF.playing, kind + ': opening timeline pauses without autoplay');
      assert(Math.abs(KF.dur-videoSource.duration)<.001, kind + ': timeline uses clip duration');
      await kfSeek(1.5);
      assert(Math.abs(videoSource.currentTime-1.5)<.01 && !kfCount(), kind + ': scrubs before any keyframes exist');
      kfSeek(.1); kfSeek(2.5); await kfMediaWork;
      assert(Math.abs(videoSource.currentTime-2.5)<.01, kind + ': rapid scrubbing lands on latest request');
      await kfSeek(0); kfInsert('pixels'); S.dof=true; S.dofA=[.1,.2]; S.dofB=[.5,.6]; kfInsert('depth');
      await kfSeek(2); S.sizeMax=8; S.dofA=[.5,.6]; S.dofB=[.9,1]; sync(); kfInsert('pixels'); kfInsert('depth');
      await kfSeek(1);
      assert(Math.abs(videoSource.currentTime-1)<.01 && Math.abs(S.sizeMax-5.5)<.001, kind + ': video and keyframe interpolation use the same time');
      assert(Math.abs(S.dofA[0]-.3)<.001 && Math.abs(S.dofB[1]-.8)<.001, kind + ': depth handles follow the video timeline');
      document.querySelector('#kf-clear').click();
      await kfSeek(0); kfToggle(); await wait(180); kfToggle(); await kfMediaWork;
      assert(videoSource.paused && KF.t>0 && Math.abs(videoSource.currentTime-KF.t)<.01, kind + ': timeline play/pause drives source with no keys');
      await kfSeek(KF.dur);
      assert(videoSource.currentTime>2.9 && videoSource.paused, kind + ': final frame does not wrap to beginning');
      kfOpen(false); await wait(100);
      assert(videoSource.paused && !videoSource.element.inert, kind + ': closing restores source controls without autoplay');
      S.sizeMax=3; sync();
    }
    await check(gif, 'GIF');
    // Encode a small real video with known frames using the app's existing export dependencies.
    const canvas = document.createElement('canvas'); canvas.width=canvas.height=32;
    const ctx=canvas.getContext('2d');
    const mux = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:32,height:32,frameRate:4},fastStart:'in-memory'});
    let failure;
    const encoder = new VideoEncoder({output:(chunk,meta)=>mux.addVideoChunk(chunk,meta),error:e=>failure=e});
    encoder.configure({codec:'avc1.42001f',width:32,height:32,bitrate:100000,framerate:4});
    for(let i=0;i<12;i++) {
      ctx.fillStyle=['#222','#888','#ddd'][Math.floor(i/4)];ctx.fillRect(0,0,32,32);
      const f=new VideoFrame(canvas,{timestamp:i*250000,duration:250000});encoder.encode(f,{keyFrame:true});f.close();
    }
    await encoder.flush();encoder.close();if(failure)throw failure;mux.finalize();
    await check(new File([mux.target.buffer], 'timeline.mp4', {type:'video/mp4'}), 'Video');
    kfOpen(true);await kfMediaWork;
    await openFile(gif);await kfMediaWork;
    assert(videoSource.paused && KF.dur===3, 'Uploading media with timeline open stays paused');
    return results;
  })()`);
})().then(results => { document.querySelector('#results').textContent=results.map(r=>'PASS '+r).join('\n');return results; }).catch(error=>{document.querySelector('#results').textContent='FAIL '+error.message;throw error;});
</script>
