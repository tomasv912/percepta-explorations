<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; padding: 24px 24px 52px; }
.frame { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px var(--line); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hud { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 6px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; border: 1.5px dashed var(--text-2); background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--text); font-weight: 500; pointer-events: none; z-index: 2; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }
.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
.slider.emph label { color: var(--text); font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }
.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.bg-pick select { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font: 12px var(--font); cursor: pointer; padding: 0; }
.bg-pick select:focus-visible { outline: none; }
.bg-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.levels button { appearance: none; border: 0; height: 26px; border-radius: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); position: relative; }
.levels button[aria-pressed="false"] { opacity: .25; }
.levels button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
}
.inks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.inks button { appearance: none; border: 0; height: 28px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); cursor: pointer; }
.inks button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12), 0 0 0 2px var(--surface), 0 0 0 3.5px var(--text); }
.btns { display: flex; gap: 6px; } .btns .btn { flex: 1; }
.btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<script src="../vendor/mp4-muxer.js"></script>
<div class="app">
  <main id="stage">
    <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Olas de cubos en movimiento"></canvas></div>
    <div class="hud" id="stats">—</div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Ola</h2>
        <div id="sl-layers"></div>
        <div id="sl-amp"></div>
        <div id="sl-freq"></div>
        <div id="sl-complexity"></div>
        <div id="sl-persp"></div>
        <div id="sl-thickness"></div>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Nueva semilla (R)" aria-label="Nueva semilla">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
      </section>

      <section>
        <h2>Cubos</h2>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-depthSize"></div>
      </section>

      <section>
        <h2>Movimiento</h2>
        <div id="sl-fps"></div>
        <div id="sl-dur"></div>
        <div id="sl-travel"></div>
        <div id="sl-jitter"></div>
        <button class="btn" id="play" aria-pressed="true">Pausa</button>
      </section>

      <section>
        <h2>Color</h2>
        <div id="palsets"></div>
        <div class="seg" data-key="colorMode" aria-label="Color">
          <button data-v="random">Paleta</button><button data-v="ink">Un color</button>
        </div>
        <div class="inks" id="inks" aria-label="Color"></div>
        <div class="row" style="grid-template-columns:56px 1fr auto">
          <span>Fondo</span>
          <label class="swatch bg-pick"><i id="bg-chip"></i><select id="bg" aria-label="Fondo"></select></label><button class="btn icon bg-flip" id="bg-flip" hidden aria-label="Blanco o negro para el color del fondo"><i></i></button>
        </div>
        <label class="check"><input type="checkbox" data-check="bgExport"> Incluir el fondo en PNG y SVG</label>
      </section>

      <section>
        <h2>Video</h2>
        <div class="seg" data-key="vidFps" aria-label="Cuadros por segundo del archivo">
          <button data-v="8" title="Un cuadro por dibujo">8 fps</button><button data-v="24" title="Cada dibujo sostenido 3 cuadros, para plataformas que piden 24">24 fps</button>
        </div>
        <div class="seg" data-key="vidFmt" aria-label="Formato">
          <button data-v="mp4">MP4</button><button data-v="png" title="Cada cuadro como PNG, sin pérdida, en un .zip">PNG (.zip)</button>
        </div>
        <label class="check"><input type="checkbox" data-check="fullFrame"> Cuadro 4K completo (si no, recortado a los cubos)</label>
      </section>
    </div>
    <footer>
      <button class="btn primary big" id="video">Exportar video 4K</button>
      <div class="btns"><button class="btn" id="png">PNG del cuadro</button><button class="btn" id="svg">SVG del cuadro</button></div>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
// Olas' sheets drawn with a few hundred large square cubes, in motion: the waves travel along the sheets and come
// round to where they started, so the motion loops. It moves as A mano does in Pixel Model: Dibujos por segundo
// drawings a second (8 by default), each held until the next, every cube a little off its place in each one.
// The artboard is a 4K frame (3840 × 2160); cube sizes are in its pixels.
const WHITE = '#F6F6F6', INK = '#272727';
const onBg = (c, bg) => PerceptaBg.swap(c, bg, S.bgFlip);
const AW = 3840, AH = 2160;
const DEFAULTS = {
  seed: 1, layers: 2, amp: .55, freq: 1.1, complexity: 3, persp: .55, thickness: .25,
  count: 500, size: 24, depthSize: .5,
  fps: 8, dur: 4, travel: 1, jitter: .5,
  palette: window.PERCEPTA_PALETTES[0].colors.slice(), colorMode: 'random', ink: INK, bg: WHITE, bgFlip: false, bgExport: false,
  vidFps: '8', vidFmt: 'mp4', fullFrame: false,
};
const S = structuredClone(DEFAULTS);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());

// ---------- Waves ----------
// As in Pixel Waves' Olas: each layer a height field of a few long sine waves, seen in perspective from just above.
// Each cube keeps its place on its sheet (u along, v into the depth) and a colour; the waves' phases run on by a
// whole number of turns over the loop (Recorrido), so the last drawing leads back into the first.
let scene = null, fitT = null;
function build() {
  const r = rng(S.seed);
  const layers = Array.from({ length: S.layers }, (_, l) => ({
    waves: Array.from({ length: S.complexity }, (_, k) => ({
      f: S.freq * (k === 0 ? 1 : 1 + k * .7) * (.7 + r() * .6) * Math.PI * 2,
      th: (r() - .5) * 1.1, ph: r() * Math.PI * 2, a: 1 / (1 + k * 1.1), turns: (k % 2 ? -1 : 1) * Math.max(1, Math.round(S.travel * (1 + k * .5))),
    })),
    base: (l - (S.layers - 1) / 2) * .35 + (r() - .5) * .15, tilt: (r() - .5) * .3,
  }));
  const cubes = [];
  for (let tries = 0; cubes.length < S.count && tries < S.count * 30; tries++) {
    const u = r(), v = r(), L = r() * layers.length | 0;
    const keep = smooth(0, .22, v) * (1 - smooth(.65, 1, v)) * smooth(0, .11, u) * smooth(0, .11, 1 - u);
    if (r() > keep) continue;
    cubes.push({ u, v, L, n: gauss(r) * S.thickness * .06, pal: r() * S.palette.length | 0, k: 1 + (r() - .5) * .3, jx: r() * 1e4 | 0 });
  }
  scene = { layers, cubes, focal: .4 + S.persp * 1.4, zNear: 1, zFar: 1 + 1.5 + S.persp * 2.5 };
  fitT = null;
}
const frames = () => Math.max(2, Math.round(S.dur * S.fps));
// Cubes at drawing i of the loop, in artboard pixels, back to front: [x, y, size, colour index].
function cubesAt(i) {
  const { layers, cubes, focal, zNear, zFar } = scene, t = i / frames(), out = [];
  for (const c of cubes) {
    const L = layers[c.L];
    let h = 0, norm = 0;
    for (const w of L.waves) { h += w.a * Math.sin(w.f * (c.u * Math.cos(w.th) + c.v * Math.sin(w.th)) + w.ph - 2 * Math.PI * w.turns * t); norm += w.a; }
    const y = L.base + L.tilt * (c.u - .5) + h / norm * S.amp + c.n, z = zNear + c.v * (zFar - zNear), x = (c.u - .5) * 2 * z / focal * 1.1;
    out.push([x / z * focal, (.9 - y) / z * focal, (1 - S.depthSize) + S.depthSize * clamp(1.6 / z) * c.k, c.pal, z, c.jx]);
  }
  out.sort((a, b) => b[4] - a[4]);
  // Fitted once over the whole loop, so the picture holds still in the frame while the waves move.
  if (!fitT) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let k = 0; k < frames(); k += Math.max(1, frames() / 12 | 0)) for (const c of cubesRaw(k)) { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); }
    const m = S.size * 2 + 80, k = Math.min((AW - 2 * m) / (x1 - x0 || 1), (AH - 2 * m) / (y1 - y0 || 1));
    fitT = { k, ox: AW / 2 - (x0 + x1) / 2 * k, oy: AH / 2 - (y0 + y1) / 2 * k };
  }
  // A mano: each drawing, each cube up to Temblor × a fifth of its size off its place (the same in every loop).
  return out.map(c => {
    const s = S.size * c[2], jr = rng(c[5] * 7919 + i * 104729 + 1), j = S.jitter * s * .2;
    return [c[0] * fitT.k + fitT.ox + (jr() - .5) * 2 * j, c[1] * fitT.k + fitT.oy + (jr() - .5) * 2 * j, Math.max(2, Math.round(s / 2) * 2), c[3]];
  });
}
function cubesRaw(i) { const keep = fitT; fitT = { k: 1, ox: 0, oy: 0 }; const j = S.jitter; S.jitter = 0; const o = cubesAt(i).map(c => c); S.jitter = j; fitT = keep; return o; }
function colorOf(pal) { return onBg(S.colorMode === 'ink' ? S.ink : S.palette[pal % S.palette.length], S.bg); }
function draw(ctx, list, ox = 0, oy = 0) {
  for (const [x, y, s, pal] of list) { ctx.fillStyle = colorOf(pal); ctx.fillRect(Math.round(x - s / 2 - ox), Math.round(y - s / 2 - oy), s, s); }
}
function bounds(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y, s] of list) { x0 = Math.min(x0, x - s / 2); y0 = Math.min(y0, y - s / 2); x1 = Math.max(x1, x + s / 2); y1 = Math.max(y1, y + s / 2); }
  return { x0: Math.floor(Math.max(0, x0)), y0: Math.floor(Math.max(0, y0)), x1: Math.ceil(Math.min(AW, x1)), y1: Math.ceil(Math.min(AH, y1)) };
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), frame = $('#frame'), stage = $('#stage');
const pct = v => Math.round(v * 100) + '%';
const SLIDERS = {
  layers: { label: 'Capas', min: 1, max: 5, step: 1, fmt: String, emph: true },
  amp: { label: 'Altura de las olas', min: 0, max: 1.2, step: .01, fmt: pct },
  freq: { label: 'Frecuencia', min: .3, max: 3, step: .01, fmt: v => v.toFixed(2) },
  complexity: { label: 'Complejidad', min: 1, max: 6, step: 1, fmt: String },
  persp: { label: 'Perspectiva', min: 0, max: 1, step: .01, fmt: pct },
  thickness: { label: 'Grosor', min: 0, max: 1, step: .01, fmt: pct },
  count: { label: 'Cubos', min: 20, max: 700, step: 10, fmt: String, emph: true },
  size: { label: 'Tamaño', min: 10, max: 50, step: 2, fmt: v => v + ' px', emph: true },
  depthSize: { label: 'Más chicos al fondo', min: 0, max: 1, step: .01, fmt: pct },
  fps: { label: 'Dibujos por segundo', min: 2, max: 24, step: 1, fmt: String, emph: true },
  dur: { label: 'Duración del loop', min: 1, max: 20, step: .5, fmt: v => v + ' s', emph: true },
  travel: { label: 'Recorrido de la onda', min: 1, max: 4, step: 1, fmt: v => v + (v === 1 ? ' vuelta' : ' vueltas') },
  jitter: { label: 'Temblor a mano', min: 0, max: 1, step: .01, fmt: pct },
};
const REBUILD = ['layers', 'amp', 'freq', 'complexity', 'persp', 'thickness', 'count', 'size', 'depthSize', 'travel'];
for (const [key, d] of Object.entries(SLIDERS)) {
  const host = $('#sl-' + key);
  host.className = 'slider' + (d.emph ? ' emph' : '');
  host.innerHTML = `<label for="in-${key}">${d.label}</label><output id="out-${key}"></output><input type="range" id="in-${key}" min="${d.min}" max="${d.max}" step="${d.step}" title="Doble clic para restablecer">`;
  const input = host.querySelector('input');
  input.addEventListener('input', () => { S[key] = +input.value; if (REBUILD.includes(key)) build(); else fitT = null; sync(); });
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; build(); sync(); });
}
const renderInks = () => { $('#inks').innerHTML = [...S.palette, INK, WHITE].map(h => `<button data-ink="${h}" style="background:${h}" title="${h}" aria-label="${h}"></button>`).join(''); };
renderInks();
$('#inks').addEventListener('click', e => { const b = e.target.closest('[data-ink]'); if (b) { S.ink = b.dataset.ink; sync(); } });
const markPalette = palettePicker($('#palsets'), () => S.palette, colors => { S.palette = colors; renderInks(); sync(); });
const updateBg = PerceptaBg.control($('#bg'), $('#bg-chip'), $('#bg-flip'), () => S.palette, () => S.bg, v => { S.bg = v; sync(); }, () => { S.bgFlip = !S.bgFlip; sync(); });
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S[seg.dataset.key] = b.dataset.v; sync(); } }));
document.querySelectorAll('[data-check]').forEach(inp => inp.addEventListener('change', () => { S[inp.dataset.check] = inp.checked; sync(); }));
$('#seed').addEventListener('input', e => { S.seed = Math.min(999999999, parseInt(e.target.value.replace(/\D/g, '') || '0', 10)); build(); sync(); });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); build(); sync(); };
$('#reseed').addEventListener('click', reseed);
addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest('input, textarea, select') && e.key.toLowerCase() === 'r') reseed(); });

function sync() {
  for (const k of Object.keys(SLIDERS)) {
    const input = $('#in-' + k), d = SLIDERS[k];
    if (+input.value !== S[k]) input.value = S[k];
    input.style.setProperty('--p', ((S[k] - d.min) / (d.max - d.min) * 100) + '%');
    $('#out-' + k).textContent = d.fmt(S[k]);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === String(S[seg.dataset.key]))));
  document.querySelectorAll('[data-check]').forEach(inp => inp.checked = S[inp.dataset.check]);
  document.querySelectorAll('[data-ink]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ink.toLowerCase() === S.ink.toLowerCase()));
  $('#inks').hidden = S.colorMode !== 'ink';
  markPalette(); updateBg(S.bgFlip);
  const seedEl = $('#seed'); if (seedEl.value !== String(S.seed)) seedEl.value = S.seed;
  shown = -1; paint();
}

// ---------- Playback ----------
// The loop on screen: drawing i is shown for 1/fps seconds.
let playing = true, t0 = performance.now(), shown = -1, cur = 0;
function paint() {
  const r = stage.getBoundingClientRect(), k = Math.max(.01, Math.min((r.width - 48) / AW, (r.height - 84) / AH));
  const w = Math.round(AW * k), h = Math.round(AH * k), dpr = devicePixelRatio || 1;
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; frame.style.background = S.bg;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  const ctx = cv.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, pw, ph);
  ctx.setTransform(pw / AW, 0, 0, ph / AH, 0, 0);
  draw(ctx, cubesAt(cur));
  $('#stats').textContent = `${scene.cubes.length} cubos · dibujo ${cur + 1} / ${frames()} · ${S.fps} por segundo · ${AW} × ${AH}`;
}
function loop(now) {
  if (playing && !filming) {
    const i = Math.floor((now - t0) / 1000 * S.fps) % frames();
    if (i !== shown) { shown = i; cur = i; paint(); }
  }
  requestAnimationFrame(loop);
}
$('#play').addEventListener('click', () => { playing = !playing; $('#play').textContent = playing ? 'Pausa' : 'Reproducir'; $('#play').setAttribute('aria-pressed', playing); if (playing) t0 = performance.now() - cur / S.fps * 1000; });
new ResizeObserver(() => scene && paint()).observe(stage);

// ---------- Export ----------
let toastT = 0, filming = false;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(name + ' descargado');
}
// The frame on screen, at 4K (cropped to the cubes on download), background only when asked.
$('#png').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = AW; c.height = AH;
  const ctx = c.getContext('2d');
  if (S.bgExport) { ctx.fillStyle = S.bg; ctx.fillRect(0, 0, AW, AH); }
  draw(ctx, cubesAt(cur));
  c.toBlob(b => b ? download(`pixel-motion-${S.seed}.png`, b) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => {
  const out = [`<svg xmlns="http://www.w3.org/2000/svg" width="${AW}" height="${AH}" viewBox="0 0 ${AW} ${AH}">`];
  if (S.bgExport) out.push(`<rect width="${AW}" height="${AH}" fill="${S.bg}"/>`);
  for (const [x, y, s, pal] of cubesAt(cur)) out.push(`<rect x="${Math.round(x - s / 2)}" y="${Math.round(y - s / 2)}" width="${s}" height="${s}" fill="${colorOf(pal)}"/>`);
  out.push('</svg>');
  download(`pixel-motion-${S.seed}.svg`, new Blob([out.join('')], { type: 'image/svg+xml' }));
});
// A .zip of files as they are (no compression), for the PNG sequence.
function zipStored(files) {
  const crcT = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder(), parts = [], dir = [];
  let off = 0;
  for (const [name, data] of files) {
    const nm = enc.encode(name), c = crc(data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(h.buffer, nm, data);
    const d = new DataView(new ArrayBuffer(46));
    d.setUint32(0, 0x02014b50, true); d.setUint16(4, 20, true); d.setUint16(6, 20, true); d.setUint32(16, c, true); d.setUint32(20, data.length, true); d.setUint32(24, data.length, true); d.setUint16(28, nm.length, true); d.setUint32(42, off, true);
    dir.push(d.buffer, nm);
    off += 30 + nm.length + data.length;
  }
  const size = dir.reduce((t, x) => t + x.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...dir, e.buffer], { type: 'application/zip' });
}
// The loop at 4K: cropped to what the cubes cover over it (even sizes for H.264), or the full 3840 × 2160 frame.
// MP4 at a constant, high bitrate (flat squares on a flat ground lose nothing to it), tagged sRGB; or PNGs.
$('#video').addEventListener('click', async () => {
  if (filming) return;
  const png = S.vidFmt === 'png';
  if (!png && (!('VideoEncoder' in window) || !window.Mp4Muxer)) return toast('Este navegador no puede exportar video: probá con Chrome, Edge o Safari.');
  const btn = $('#video'), label = btn.textContent, N = frames(), hold = S.vidFps === '24' ? Math.max(1, Math.round(24 / S.fps)) : 1, fps = S.fps * hold;
  filming = true; btn.disabled = true;
  try {
    let b = { x0: 0, y0: 0, x1: AW, y1: AH };
    if (!S.fullFrame) {
      b = { x0: AW, y0: AH, x1: 0, y1: 0 };
      for (let i = 0; i < N; i++) { const q = bounds(cubesAt(i)); b = { x0: Math.min(b.x0, q.x0), y0: Math.min(b.y0, q.y0), x1: Math.max(b.x1, q.x1), y1: Math.max(b.y1, q.y1) }; }
      const pad = 8; b = { x0: Math.max(0, b.x0 - pad), y0: Math.max(0, b.y0 - pad), x1: Math.min(AW, b.x1 + pad), y1: Math.min(AH, b.y1 + pad) };
    }
    const W = Math.round((b.x1 - b.x0) / 2) * 2, H = Math.round((b.y1 - b.y0) / 2) * 2;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const paintFrame = i => { ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H); draw(ctx, cubesAt(i), b.x0, b.y0); };
    if (png) {
      const files = [];
      for (let i = 0; i < N; i++) {
        paintFrame(i);
        files.push([`pixel-motion-${String(i + 1).padStart(4, '0')}.png`, new Uint8Array(await (await new Promise(res => c.toBlob(res, 'image/png'))).arrayBuffer())]);
        btn.textContent = `Renderizando ${i + 1} / ${N}`;
      }
      download(`pixel-motion-${S.seed}-${S.fps}fps.zip`, zipStored(files));
      return;
    }
    let config = null, kind = '';
    search: for (const br of [80e6, 50e6, 30e6])
      for (const [codec, k2] of [['avc1.640034', 'avc'], ['avc1.640033', 'avc'], ['avc1.4d0033', 'avc'], ['avc1.42003e', 'avc'], ['vp09.00.51.08', 'vp9'], ['vp09.00.10.08', 'vp9']]) {
        const cfg = { codec, width: W, height: H, bitrate: br, bitrateMode: 'constant', latencyMode: 'quality', framerate: fps };
        if ((await VideoEncoder.isConfigSupported(cfg)).supported) { config = cfg; kind = k2; break search; }
      }
    if (!config) throw new Error('codec');
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: kind, width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
    let failed = null;
    const tag = meta => meta?.decoderConfig ? { ...meta, decoderConfig: { ...meta.decoderConfig, colorSpace: { matrix: 'bt709', fullRange: false, ...meta.decoderConfig.colorSpace, primaries: 'bt709', transfer: 'iec61966-2-1' } } } : meta;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, tag(meta)), error: e => failed = e });
    enc.configure(config);
    for (let i = 0, f = 0; i < N; i++) {
      paintFrame(i);
      for (let hcount = 0; hcount < hold; hcount++, f++) {
        if (failed) throw failed;
        const vf = new VideoFrame(c, { timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
        enc.encode(vf, { keyFrame: f % fps === 0 }); vf.close();
        while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5));
      }
      btn.textContent = `Renderizando ${i + 1} / ${N}`;
      await new Promise(r => setTimeout(r, 0));
    }
    await enc.flush(); enc.close();
    if (failed) throw failed;
    muxer.finalize();
    download(`pixel-motion-${S.seed}-${fps}fps.mp4`, new Blob([muxer.target.buffer], { type: 'video/mp4' }));
  } catch (err) {
    console.error(err); toast('No se pudo exportar el video.');
  } finally {
    filming = false; btn.disabled = false; btn.textContent = label; shown = -1;
  }
});

build();
sync();
requestAnimationFrame(loop);
</script>
</body>
</html>
