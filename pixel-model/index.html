<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; padding: 52px 24px 76px; }
.frame { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px var(--line); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame { cursor: grab; touch-action: none; }
.frame:active { cursor: grabbing; }
.busy { position: absolute; top: 12px; right: 14px; font: 11px var(--mono); color: var(--text-3); }
.hud { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 6px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.tt { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 4px 16px rgb(0 0 0 / .06); white-space: nowrap; z-index: 1; }
.tt-play { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--fill); color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.tt-play:hover { background: var(--line); }
.tt-play .i-stop, .tt-play[aria-pressed="true"] .i-play { display: none; }
.tt-play[aria-pressed="true"] .i-stop { display: block; }
.tt-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tt .slider { width: 132px; gap: 0 8px; }
.tt .slider label { font-size: 11px; }
.tt .slider output { font-size: 11px; }
.tt .seg button { flex: none; padding: 0 8px; font-variant-numeric: tabular-nums; }
.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; border: 1.5px dashed var(--text-2); background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--text); font-weight: 500; pointer-events: none; z-index: 2; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }
.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
.slider.emph label { color: var(--text); font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }
.note { margin: 0; color: var(--text-3); font-size: 11px; line-height: 1.45; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }
.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.bg-pick select { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font: 12px var(--font); cursor: pointer; padding: 0; }
.bg-pick select:focus-visible { outline: none; }
.bg-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.presets button { appearance: none; border: 0; height: 28px; border-radius: 6px; background: var(--fill); color: var(--text-2); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.presets button[aria-pressed="true"] { background: var(--text); color: var(--surface); box-shadow: none; }
.levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.levels button { appearance: none; border: 0; height: 26px; border-radius: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); position: relative; }
.levels button[aria-pressed="false"] { opacity: .25; }
.levels button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
  .tt { max-width: calc(100% - 16px); overflow-x: auto; }
}
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<script src="../stipple3d.js"></script>
<script src="../flora3d.js"></script>
<script src="../vendor/mp4-muxer.js"></script>
<div class="app">
  <main id="stage">
    <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Un modelo 3D dibujado con píxeles"></canvas></div>
    <div class="drop" id="drop" hidden>Soltá el modelo (.obj, .glb, .gltf)</div>
    <div class="hud" id="stats">—</div>
    <div class="tt" role="toolbar" aria-label="Turntable">
      <button class="tt-play" id="ttPlay" aria-pressed="false" title="Vista previa: una vuelta en loop">
        <svg class="i-play" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"/></svg>
        <svg class="i-stop" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="currentColor"/></svg>
        Turntable
      </button>
      <div id="sl-ttDur"></div>
      <div class="seg" data-key="ttFps" aria-label="Cuadros por segundo">
        <button data-v="12">12</button><button data-v="24">24</button><button data-v="30">30</button><button data-v="60">60</button>
      </div>
      <div class="seg" data-key="ttDir" aria-label="Sentido">
        <button data-v="1" title="A la derecha" aria-label="A la derecha">→</button><button data-v="-1" title="A la izquierda" aria-label="A la izquierda">←</button>
      </div>
      <button class="btn primary" id="video" title="MP4 en loop, recortado al modelo, con el fondo (MP4 no tiene transparencia)">Exportar video</button>
    </div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Modelo</h2>
        <div class="presets" id="presets" aria-label="Modelos"></div>
        <button class="btn" id="upload">Subir .obj, .glb o .gltf</button>
        <input type="file" id="file" accept=".obj,.glb,.gltf" hidden>
        <div id="sl-yaw"></div>
        <div id="sl-pitch"></div>
        <div id="sl-zoom"></div>
      </section>

      <section>
        <h2>Luz</h2>
        <div id="sl-lightAz"></div>
        <div id="sl-lightEl"></div>
        <div id="sl-ambient"></div>
        <div id="sl-shadow"></div>
      </section>

      <section>
        <h2>Píxeles</h2>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-contrast"></div>
        <div id="sl-edge"></div>
        <div id="sl-jitter"></div>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Nueva semilla (R)" aria-label="Nueva semilla">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
      </section>

      <section>
        <h2>Animación</h2>
        <div class="seg" data-key="anim" aria-label="Animación">
          <button data-v="none">Quieta</button><button data-v="boil">A mano</button><button data-v="float">Flotar</button><button data-v="hover">Hover</button>
        </div>
        <div id="sl-fps"></div>
        <div id="sl-boil"></div>
        <div id="sl-floatAmp"></div>
        <div id="sl-floatSpeed"></div>
        <div id="sl-floatScale"></div>
        <div id="sl-hoverRadius"></div>
        <div id="sl-hoverForce"></div>
      </section>

      <section>
        <h2>Color</h2>
        <div class="seg" data-key="colorMode" aria-label="Color">
          <button data-v="ink">Un color</button><button data-v="tone">Por tono</button><button data-v="random">Al azar</button>
        </div>
        <div class="levels" id="inks" aria-label="Color"></div>
        <div class="row" style="grid-template-columns:56px 1fr">
          <span>Fondo</span>
          <label class="swatch bg-pick"><i id="bg-chip"></i><select id="bg" aria-label="Fondo"></select></label>
        </div>
        <label class="check"><input type="checkbox" data-check="bgExport"> Incluir el fondo al exportar</label>
      </section>
    </div>
    <footer>
      <button class="btn primary big" id="png">Exportar PNG</button>
      <button class="btn big" id="svg">Exportar SVG</button>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
// A 3D model drawn with overlapping square pixels: rendered with depth and a light with cast shadows
// (stipple3d.js), then stippled — more pixels in the shade and on edges, where one part passes over another.
// Drag the model to turn it.
const COLORS = ['#D9D0FA', '#A8A5EC', '#A0C2FF', '#98DEDF', '#7FE4B0'];
const INKS = [...COLORS, '#272727', '#F6F6F6'];
const BACKGROUNDS = [['#F6F6F6', 'Blanco'], ['#D9D0FA', 'Lila'], ['#A8A5EC', 'Violeta'], ['#A0C2FF', 'Celeste'], ['#98DEDF', 'Agua'], ['#7FE4B0', 'Verde'], ['#14191F', 'Negro']];
const WHITE = '#F6F6F6', INK = '#14191F';
const onBg = (c, bg) => c.toLowerCase() !== bg.toLowerCase() ? c : bg.toLowerCase() === WHITE.toLowerCase() ? INK : WHITE;
const AW = 1600, AH = 1200, RES = 2;
const DEFAULTS = {
  yaw: -20, pitch: 12, zoom: 1, lightAz: 220, lightEl: 40, ambient: .25, shadow: .65,
  count: 40000, size: 3, contrast: 1.6, edge: .8, jitter: 1, seed: 1,
  anim: 'none', fps: 8, boil: .35, floatAmp: 6, floatSpeed: .4, floatScale: 1, hoverRadius: 140, hoverForce: 1,
  ttDur: 6, ttFps: '24', ttDir: '1',
  colorMode: 'ink', ink: '#272727', bg: '#F6F6F6', bgExport: false,
};
const S = structuredClone(DEFAULTS);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---------- Model ----------
// Built-in flowers and plants (flora3d.js; the seed gives a variant), a trefoil knot, or an uploaded file.
// Positions are centred and scaled to fit a unit sphere.
const PRESETS = [['hortensia', 'Hortensia'], ['florecilla', 'Florecilla'], ['tulipan', 'Tulipán'], ['cala', 'Cala'], ['margarita', 'Margarita'], ['suculenta', 'Suculenta']];
let model = null, modelName = '', preset = 'hortensia', presetSeed = -1;
function loadPreset() {
  const tris = new Float32Array(Flora3D.MODELS[preset](rng(S.seed * 7 + 3)));
  setModelTris(tris, PRESETS.find(p => p[0] === preset)[1]); presetSeed = S.seed;
}
// Triangles with normals (18 per triangle): centred and scaled like setModel, normals kept.
function setModelTris(tris, name) {
  let cx = 0, cy = 0, cz = 0, n = 0;
  for (let i = 0; i < tris.length; i += 18) for (let j = 0; j < 9; j += 3) { cx += tris[i + j]; cy += tris[i + j + 1]; cz += tris[i + j + 2]; n++; }
  cx /= n; cy /= n; cz /= n;
  let r = 0; for (let i = 0; i < tris.length; i += 18) for (let j = 0; j < 9; j += 3) r = Math.max(r, Math.hypot(tris[i + j] - cx, tris[i + j + 1] - cy, tris[i + j + 2] - cz));
  for (let i = 0; i < tris.length; i += 18) for (let j = 0; j < 9; j += 3) { tris[i + j] = (tris[i + j] - cx) / r; tris[i + j + 1] = (tris[i + j + 1] - cy) / r; tris[i + j + 2] = (tris[i + j + 2] - cz) / r; }
  model = tris; modelName = name;
}
function setModel(pos, name) {
  let cx = 0, cy = 0, cz = 0, n = pos.length / 3;
  for (let i = 0; i < pos.length; i += 3) { cx += pos[i]; cy += pos[i + 1]; cz += pos[i + 2]; }
  cx /= n; cy /= n; cz /= n;
  let r = 0; for (let i = 0; i < pos.length; i += 3) r = Math.max(r, Math.hypot(pos[i] - cx, pos[i + 1] - cy, pos[i + 2] - cz));
  const out = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 3) { out[i] = (pos[i] - cx) / r; out[i + 1] = (pos[i + 1] - cy) / r; out[i + 2] = (pos[i + 2] - cz) / r; }
  model = Stipple3D.withNormals(out); modelName = name;
}
// ---------- Render ----------
// The model turned (yaw about the vertical, then pitch) into view space: x right, y down, z towards us.
function viewTris() {
  const y = S.yaw * Math.PI / 180, p = S.pitch * Math.PI / 180, cy = Math.cos(y), sy = Math.sin(y), cp = Math.cos(p), sp = Math.sin(p), out = new Float32Array(model.length);
  const rot = (x, yy, z, o) => { const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = yy * cp - z1 * sp, z2 = yy * sp + z1 * cp; out[o] = x1; out[o + 1] = -y1; out[o + 2] = z2; };
  for (let i = 0; i < model.length; i += 18) for (let j = 0; j < 6; j++) rot(model[i + j * 3], model[i + j * 3 + 1], model[i + j * 3 + 2], i + j * 3);
  return out;
}
let pts = null;
function build(fast) {
  const tris = viewTris(), ar = AW / AH, h = 1.15 / S.zoom, box = { x0: -h * ar, y0: -h, x1: h * ar, y1: h };
  const az = S.lightAz * Math.PI / 180, el = S.lightEl * Math.PI / 180;
  const light = [Math.cos(el) * Math.cos(az), -Math.sin(el), Math.cos(el) * Math.sin(az) * -1 + .0001];
  const buf = Stipple3D.render(tris, box, fast ? 420 : 900, [light[0], light[1], Math.abs(light[2]) + .35], { ambient: S.ambient, shadowDim: 1 - S.shadow });
  const e = Stipple3D.edges(buf, .02 / S.zoom), r = rng(S.seed);
  // Cantidad is a density: the count for a model that would fill a third of the frame, scaled by the area it
  // actually covers, so a slender model is not crammed darker than a broad one.
  let area = 0; for (let i = 0; i < buf.mask.length; i++) area += buf.mask[i];
  const want = Math.round(S.count * Math.min(2, area / buf.mask.length * 3));
  scene = { buf, e, box };
  return stipple(fast ? Math.min(want, 15000) : want, r);
}
// n pixels from the last render: into artboard units, square, never rotated, each a little off its sample
// (Superposición).
let scene = null;
function stipple(n, r) {
  const { buf, e, box } = scene, raw = Stipple3D.sample(buf, e, n, r, { gamma: S.contrast, edge: S.edge, floor: .01, gain: 1.2 });
  const k = AW / (box.x1 - box.x0), out = [];
  for (let i = 0; i < raw.length; i += 3) {
    const x = (raw[i] - box.x0) * k + (r() - .5) * S.size * S.jitter, y = (raw[i + 1] - box.y0) * k + (r() - .5) * S.size * S.jitter;
    out.push({ x, y, tone: raw[i + 2], pick: r() });
  }
  return out;
}
function colorOf(p) {
  const c = S.colorMode === 'tone' ? COLORS[clamp(Math.floor((1 - p.tone) * COLORS.length), 0, COLORS.length - 1)]
    : S.colorMode === 'random' ? COLORS[Math.floor(p.pick * COLORS.length)] : S.ink;
  return onBg(c, S.bg);
}
// Pixels are drawn where they are now: home plus the animation's offset (p.dx, p.dy).
function draw(ctx, list, ox = 0, oy = 0) {
  const groups = new Map(), s = S.size;
  for (const p of list) { const c = colorOf(p); let l = groups.get(c); if (!l) groups.set(c, l = []); l.push(p); }
  for (const [c, l] of groups) {
    ctx.fillStyle = c; ctx.beginPath();
    for (const p of l) ctx.rect(Math.round((p.x + (p.dx || 0) - s / 2 - ox) * RES) / RES, Math.round((p.y + (p.dy || 0) - s / 2 - oy) * RES) / RES, s, s);
    ctx.fill();
  }
}
function bounds(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, s = S.size / 2;
  for (const p of list) { const x = p.x + (p.dx || 0), y = p.y + (p.dy || 0); x0 = Math.min(x0, x - s); y0 = Math.min(y0, y - s); x1 = Math.max(x1, x + s); y1 = Math.max(y1, y + s); }
  return x0 > x1 ? null : { x0: Math.floor(Math.max(0, x0)), y0: Math.floor(Math.max(0, y0)), x1: Math.ceil(Math.min(AW, x1)), y1: Math.ceil(Math.min(AH, y1)) };
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), frame = $('#frame'), stage = $('#stage');
let raf = 0, fastNext = false;
const pct = v => Math.round(v * 100) + '%', deg = v => Math.round(v) + '°';
const SLIDERS = {
  yaw: { label: 'Giro', min: -180, max: 180, step: 1, fmt: deg },
  pitch: { label: 'Inclinación', min: -89, max: 89, step: 1, fmt: deg },
  zoom: { label: 'Escala', min: .4, max: 2.5, step: .01, fmt: v => '×' + v.toFixed(2) },
  lightAz: { label: 'Dirección', min: 0, max: 360, step: 1, fmt: deg },
  lightEl: { label: 'Altura', min: 0, max: 85, step: 1, fmt: deg },
  ambient: { label: 'Luz ambiente', min: 0, max: .8, step: .01, fmt: pct },
  shadow: { label: 'Sombras proyectadas', min: 0, max: 1, step: .01, fmt: pct },
  count: { label: 'Densidad', min: 2000, max: 200000, step: 1000, fmt: v => Math.round(v / 1000) + 'k', emph: true },
  size: { label: 'Tamaño del píxel', min: 1, max: 24, step: .5, fmt: v => v + ' px', emph: true },
  contrast: { label: 'Contraste', min: .5, max: 4, step: .05, fmt: v => v.toFixed(2) },
  edge: { label: 'Bordes y superposiciones', min: 0, max: 2, step: .01, fmt: pct },
  fps: { label: 'Cuadros por segundo', min: 1, max: 24, step: 1, fmt: String, emph: true },
  boil: { label: 'Variación entre cuadros', min: .02, max: 1, step: .01, fmt: pct },
  floatAmp: { label: 'Amplitud', min: 0, max: 40, step: .5, fmt: v => v + ' px', emph: true },
  floatSpeed: { label: 'Velocidad', min: .02, max: 2, step: .01, fmt: v => v.toFixed(2) },
  floatScale: { label: 'Escala del ruido', min: .2, max: 4, step: .05, fmt: v => '×' + v.toFixed(2) },
  hoverRadius: { label: 'Radio', min: 30, max: 500, step: 5, fmt: v => v + ' px', emph: true },
  hoverForce: { label: 'Fuerza', min: .1, max: 3, step: .01, fmt: pct },
  ttDur: { label: 'Duración', min: 1, max: 30, step: .5, fmt: v => v + ' s', emph: true },
  jitter: { label: 'Superposición', min: 0, max: 3, step: .01, fmt: pct },
};
for (const [key, d] of Object.entries(SLIDERS)) {
  const host = $('#sl-' + key);
  host.className = 'slider' + (d.emph ? ' emph' : '');
  host.innerHTML = `<label for="in-${key}">${d.label}</label><output id="out-${key}"></output><input type="range" id="in-${key}" min="${d.min}" max="${d.max}" step="${d.step}" title="Doble clic para restablecer">`;
  const input = host.querySelector('input');
  input.addEventListener('input', () => { S[key] = +input.value; sync(true); });
  input.addEventListener('change', () => sync());
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; sync(); });
}
$('#presets').innerHTML = PRESETS.map(([k, n]) => `<button data-p="${k}">${n}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { preset = b.dataset.p; loadPreset(); key = ''; sync(); } });
$('#inks').innerHTML = INKS.map(h => `<button data-ink="${h}" style="background:${h}" title="${h}" aria-label="${h}"></button>`).join('');
$('#inks').addEventListener('click', e => { const b = e.target.closest('[data-ink]'); if (b) { S.ink = b.dataset.ink; sync(); } });
$('#bg').innerHTML = BACKGROUNDS.map(([h, n]) => `<option value="${h}">${n} · ${h}</option>`).join('');
$('#bg').addEventListener('change', e => { S.bg = e.target.value; sync(); });
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S[seg.dataset.key] = b.dataset.v; sync(); } }));
document.querySelectorAll('[data-check]').forEach(inp => inp.addEventListener('change', () => { S[inp.dataset.check] = inp.checked; sync(); }));
$('#seed').addEventListener('input', e => { S.seed = Math.min(999999999, parseInt(e.target.value.replace(/\D/g, '') || '0', 10)); sync(); });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); sync(); };
$('#reseed').addEventListener('click', reseed);
addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest('input, textarea, select') && e.key.toLowerCase() === 'r') reseed(); });

// Only colours and the background are cheap; anything else re-renders (quickly while dragging).
let key = '', prevAnim = 'none';
function sync(fast) {
  for (const k of Object.keys(SLIDERS)) {
    const input = $('#in-' + k), d = SLIDERS[k];
    if (+input.value !== S[k]) input.value = S[k];
    input.style.setProperty('--p', ((S[k] - d.min) / (d.max - d.min) * 100) + '%');
    $('#out-' + k).textContent = d.fmt(S[k]);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[seg.dataset.key])));
  document.querySelectorAll('[data-check]').forEach(inp => inp.checked = S[inp.dataset.check]);
  document.querySelectorAll('[data-ink]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ink.toLowerCase() === S.ink.toLowerCase()));
  $('#inks').hidden = S.colorMode !== 'ink';
  const A = { fps: 'boil', boil: 'boil', floatAmp: 'float', floatSpeed: 'float', floatScale: 'float', hoverRadius: 'hover', hoverForce: 'hover' };
  for (const [k2, a] of Object.entries(A)) $('#sl-' + k2).hidden = S.anim !== a;
  document.querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === preset && !modelName.includes('.')));
  if (preset && !modelName.includes('.') && presetSeed !== S.seed && !fast) loadPreset();
  $('#bg').value = S.bg; $('#bg-chip').style.background = S.bg;
  const seedEl = $('#seed'); if (seedEl.value !== String(S.seed)) seedEl.value = S.seed;
  const k = JSON.stringify([modelName, presetSeed, S.yaw, S.pitch, S.zoom, S.lightAz, S.lightEl, S.ambient, S.shadow, S.count, S.size, S.contrast, S.edge, S.jitter, S.seed]);
  if (k !== key || (!fast && fastNext)) { fastNext = !!fast; pts = build(fast); key = k; }
  if (S.anim !== prevAnim) { prevAnim = S.anim; for (const p of pts) p.dx = p.dy = p.vx = p.vy = 0; lastT = 0; }
  schedule();
}
function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
function render() {
  const r = stage.getBoundingClientRect(), k = Math.max(.01, Math.min((r.width - 48) / AW, (r.height - 128) / AH));
  const w = Math.round(AW * k), h = Math.round(AH * k), dpr = devicePixelRatio || 1;
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; frame.style.background = S.bg;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  const ctx = cv.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, pw, ph);
  ctx.setTransform(cv.width / AW, 0, 0, cv.height / AH, 0, 0);
  draw(ctx, pts);
  if (S.anim === 'boil' || S.anim === 'float') animate();
  $('#stats').textContent = `${pts.length.toLocaleString('es')} píxeles · ${modelName} · arrastrá para girar`;
}
new ResizeObserver(() => pts && schedule()).observe(stage);

// Drag turns the model; the final frame renders in full when the drag ends.
let turn = null;
frame.addEventListener('pointerdown', e => { if (spin) stopSpin(); frame.setPointerCapture(e.pointerId); turn = { x: e.clientX, y: e.clientY, yaw: S.yaw, pitch: S.pitch }; });
frame.addEventListener('pointermove', e => {
  if (!turn) return;
  S.yaw = ((turn.yaw + (e.clientX - turn.x) * .5 + 540) % 360) - 180; S.pitch = clamp(turn.pitch + (e.clientY - turn.y) * .4, -89, 89);
  sync(true);
});
const endTurn = () => { if (turn) { turn = null; sync(); } };
frame.addEventListener('pointerup', endTurn); frame.addEventListener('pointercancel', endTurn);
frame.addEventListener('wheel', e => { e.preventDefault(); S.zoom = clamp(S.zoom * Math.exp(-e.deltaY * .0015), .4, 2.5); sync(true); clearTimeout(frame.t); frame.t = setTimeout(() => sync(), 200); }, { passive: false });

// ---------- Animation ----------
// A mano: every 1/fps seconds a share of the pixels (Variación) is drawn again from the same render and every
// pixel shifts 1–3 px on each axis, so the picture boils like stop motion while keeping its tones. Flotar: each pixel drifts on a slow 3D noise field
// (x, y, time), nothing is re-drawn. Hover: pixels near the pointer are pushed away and spring back home as
// it leaves. Exports take the frame on screen.
let anim = 0, lastBoil = 0, boilN = 0, hover = null;
const noise = (() => {
  const p = new Uint8Array(512), r = rng(97);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
  const g = (h, x, y, z) => { const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return (h & 1 ? -u : u) + (h & 2 ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    x -= X; y -= Y; z -= Z;
    const xi = X & 255, yi = Y & 255, zi = Z & 255, u = fade(x), v = fade(y), w = fade(z);
    const A = p[xi] + yi, AA = p[A] + zi, AB = p[A + 1] + zi, B = p[xi + 1] + yi, BA = p[B] + zi, BB = p[B + 1] + zi;
    return lerp(lerp(lerp(g(p[AA] & 15, x, y, z), g(p[BA] & 15, x - 1, y, z), u), lerp(g(p[AB] & 15, x, y - 1, z), g(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(g(p[AA + 1] & 15, x, y, z - 1), g(p[BA + 1] & 15, x - 1, y, z - 1), u), lerp(g(p[AB + 1] & 15, x, y - 1, z - 1), g(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  };
})();
function animate() { if (S.anim !== 'none' && !anim) anim = requestAnimationFrame(tick); }
let lastT = 0;
function tick(now) {
  anim = 0;
  if (S.anim === 'none' || !pts || filming) return;
  const dt = Math.min(.05, lastT ? (now - lastT) / 1000 : 1 / 60); lastT = now;
  if (S.anim === 'boil') {
    if (now - lastBoil >= 1000 / S.fps) {
      lastBoil = now; boilN++;
      const r = rng(S.seed * 131 + boilN), fresh = stipple(Math.round(pts.length * S.boil), r);
      for (const q of fresh) pts[Math.floor(r() * pts.length)] = q;
      // And every pixel shifts 1 to 3 px on x and on y, either way, as if redrawn by hand.
      const j = () => (1 + r() * 2) * (r() < .5 ? -1 : 1);
      for (const p of pts) { p.dx = j(); p.dy = j(); }
      render();
    } else animate();
    return;
  }
  if (S.anim === 'float') {
    const t = now / 1000 * S.floatSpeed, f = .004 * S.floatScale, A = S.floatAmp;
    for (const p of pts) { p.dx = noise(p.x * f, p.y * f, t) * A * 2; p.dy = noise(p.x * f + 31.7, p.y * f + 17.3, t) * A * 2; }
  } else {
    // Spring home, pushed out of the pointer's radius.
    const R = S.hoverRadius, k = 160, damp = Math.pow(.004, dt);
    let moving = false;
    for (const p of pts) {
      let vx = p.vx || 0, vy = p.vy || 0, dx = p.dx || 0, dy = p.dy || 0;
      if (hover) {
        const ex = p.x + dx - hover[0], ey = p.y + dy - hover[1], d = Math.hypot(ex, ey);
        if (d < R) { const f = (1 - d / R) * 9000 * S.hoverForce * (.6 + .8 * p.pick); vx += (d ? ex / d : 1) * f * dt; vy += (d ? ey / d : 0) * f * dt; }
      }
      vx = (vx - dx * k * dt) * damp; vy = (vy - dy * k * dt) * damp;
      dx += vx * dt; dy += vy * dt;
      if (!hover && Math.abs(dx) + Math.abs(dy) < .15 && Math.abs(vx) + Math.abs(vy) < 2) vx = vy = dx = dy = 0; // home: snap and rest
      else moving = true;
      p.vx = vx; p.vy = vy; p.dx = dx; p.dy = dy;
    }
    render();
    if (moving || hover) animate(); // settled: sleep until the pointer comes back
    return;
  }
  render();
}
const toBoard = e => { const r = frame.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * AW, (e.clientY - r.top) / r.height * AH]; };
frame.addEventListener('pointermove', e => { if (S.anim === 'hover' && !turn) { hover = toBoard(e); animate(); } });
frame.addEventListener('pointerleave', () => { hover = null; animate(); });

// ---------- Input ----------
async function openFile(file) {
  if (!file) return;
  try {
    const name = file.name.toLowerCase();
    const pos = name.endsWith('.obj') ? Stipple3D.parseOBJ(await file.text()) : Stipple3D.parseGLB(await file.arrayBuffer());
    if (!pos.length) throw new Error('empty');
    setModel(pos, file.name); key = ''; sync(); toast(`${file.name}: ${(pos.length / 9).toLocaleString('es')} triángulos`);
  } catch (err) { toast('No se pudo leer el modelo (OBJ, GLB o glTF con los datos adentro).'); }
}
$('#upload').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; openFile(e.dataTransfer.files[0]); });

// ---------- Export ----------
// Cropped to the pixels; background only when asked.
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' descargado');
}
$('#png').addEventListener('click', () => {
  const b = bounds(pts); if (!b) return;
  const c = document.createElement('canvas'); c.width = (b.x1 - b.x0) * RES; c.height = (b.y1 - b.y0) * RES;
  const ctx = c.getContext('2d'); ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (S.bgExport) { ctx.fillStyle = S.bg; ctx.fillRect(0, 0, b.x1 - b.x0, b.y1 - b.y0); }
  draw(ctx, pts, b.x0, b.y0);
  c.toBlob(bl => bl ? download(`pixel-model-${S.seed}.png`, bl) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => {
  const b = bounds(pts); if (!b) return;
  const w = (b.x1 - b.x0) * RES, h = (b.y1 - b.y0) * RES, n = v => Math.round(v * RES * 100) / 100, s = S.size * RES, out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`);
  if (S.bgExport) out.push(`<rect width="${w}" height="${h}" fill="${S.bg}"/>`);
  const groups = new Map();
  for (const p of pts) { const c = colorOf(p); groups.set(c, (groups.get(c) || '') + `M${n(p.x + (p.dx || 0) - S.size / 2 - b.x0)} ${n(p.y + (p.dy || 0) - S.size / 2 - b.y0)}h${s}v${s}h${-s}z`); }
  for (const [c, d] of groups) out.push(`<path fill="${c}" d="${d}"/>`);
  out.push('</svg>');
  download(`pixel-model-${S.seed}.svg`, new Blob([out.join('')], { type: 'image/svg+xml' }));
});

// ---------- Turntable ----------
// One full turn about the vertical from the current Giro, in Duración seconds. The last frame is one step short
// of the first, so the video loops without a seam. Vista previa spins it on screen (drawn quickly); Exportar video
// renders every frame in full and encodes an MP4 (WebCodecs), cropped to what the model sweeps.
let spin = null, filming = false;
const wrapDeg = v => ((v + 540) % 360 + 360) % 360 - 180;
function stopSpin() { cancelAnimationFrame(spin.raf); S.yaw = spin.yaw0; spin = null; $('#ttPlay').setAttribute('aria-pressed', 'false');  sync(); }
$('#ttPlay').addEventListener('click', () => {
  if (spin) return stopSpin();
  if (filming) return;
  spin = { yaw0: S.yaw, t0: performance.now() };
  $('#ttPlay').setAttribute('aria-pressed', 'true'); 
  const step = now => {
    S.yaw = wrapDeg(spin.yaw0 + +S.ttDir * 360 * (((now - spin.t0) / 1000 / S.ttDur) % 1));
    sync(true); spin.raf = requestAnimationFrame(step);
  };
  spin.raf = requestAnimationFrame(step);
});
$('#video').addEventListener('click', async () => {
  if (filming) return;
  if (!('VideoEncoder' in window) || !window.Mp4Muxer) return toast('Este navegador no puede exportar video: probá con Chrome, Edge o Safari.');
  if (spin) stopSpin();
  const btn = $('#video'), label = btn.textContent, yaw0 = S.yaw, fps = +S.ttFps, N = Math.max(2, Math.round(S.ttDur * fps)), dir = +S.ttDir;
  const yawAt = i => wrapDeg(yaw0 + dir * 360 * i / N);
  filming = true; btn.disabled = true;
  try {
    // The crop: everything the model covers over the turn, plus room for the pixels and their jitter.
    const ar = AW / AH, h = 1.15 / S.zoom, k = AW / (2 * h * ar), pad = S.size * (1 + S.jitter) + 4;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < N; i++) {
      S.yaw = yawAt(i); const t = viewTris();
      for (let j = 0; j < t.length; j += 18) for (let v = 0; v < 9; v += 3) { const x = t[j + v], y = t[j + v + 1]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    }
    const b = { x0: Math.max(0, (x0 + h * ar) * k - pad), y0: Math.max(0, (y0 + h) * k - pad), x1: Math.min(AW, (x1 + h * ar) * k + pad), y1: Math.min(AH, (y1 + h) * k + pad) };
    // At most 1920 px on the long side, even dimensions (H.264).
    const sc = Math.min(RES, 1920 / Math.max(b.x1 - b.x0, b.y1 - b.y0)), W = Math.round((b.x1 - b.x0) * sc / 2) * 2, H = Math.round((b.y1 - b.y0) * sc / 2) * 2;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    // H.264 where the browser has it (plays everywhere); VP9 in MP4 otherwise.
    let config = null, kind = '';
    for (const [codec, k2] of [['avc1.640033', 'avc'], ['avc1.4d0033', 'avc'], ['avc1.42003e', 'avc'], ['vp09.00.51.08', 'vp9'], ['vp09.00.10.08', 'vp9']]) {
      const cfg = { codec, width: W, height: H, bitrate: Math.round(W * H * fps * .25), framerate: fps };
      if ((await VideoEncoder.isConfigSupported(cfg)).supported) { config = cfg; kind = k2; break; }
    }
    if (!config) throw new Error('codec');
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: kind, width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
    let failed = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => failed = e });
    enc.configure(config);
    for (let i = 0; i < N; i++) {
      if (failed) throw failed;
      S.yaw = yawAt(i);
      const list = build(false);
      if (S.anim === 'boil') { const r = rng(S.seed * 131 + i), j = () => (1 + r() * 2) * (r() < .5 ? -1 : 1); for (const p of list) { p.dx = j(); p.dy = j(); } }
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
      ctx.setTransform(sc, 0, 0, sc, 0, 0); draw(ctx, list, b.x0, b.y0);
      const f = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(f, { keyFrame: i % (fps * 2) === 0 }); f.close();
      btn.textContent = `Renderizando ${i + 1} / ${N}`;
      while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5));
      await new Promise(r => setTimeout(r, 0));
    }
    await enc.flush(); enc.close();
    if (failed) throw failed;
    muxer.finalize();
    download(`pixel-model-turntable-${S.seed}.mp4`, new Blob([muxer.target.buffer], { type: 'video/mp4' }));
  } catch (err) {
    console.error(err); toast('No se pudo exportar el video.');
  } finally {
    S.yaw = yaw0; filming = false; btn.disabled = false; btn.textContent = label; key = ''; sync();
  }
});

loadPreset();
sync();
</script>
</body>
</html>
