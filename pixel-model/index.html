<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; padding: 92px 24px 76px; }
.frame { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px var(--line); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame { cursor: grab; touch-action: none; }
.frame:active { cursor: grabbing; }
.frame.moving, .frame.moving:active { cursor: move; }
.busy { position: absolute; top: 12px; right: 14px; font: 11px var(--mono); color: var(--text-3); }
.hud { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 6px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.tt { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 4px 16px rgb(0 0 0 / .06); white-space: nowrap; z-index: 1; }
.tt { flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); }
.tt-sep { width: 1px; height: 28px; background: var(--line); flex: none; }
.tt-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.tt-check input { accent-color: var(--text); margin: 0; }
.tt-play { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--fill); color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.tt-play:hover { background: var(--line); }
.tt-play[aria-pressed="true"] { background: var(--text); color: var(--surface); box-shadow: none; }
.tt-play .i-stop, .tt-play[aria-pressed="true"] .i-play { display: none; }
.tt-play[aria-pressed="true"] .i-stop { display: block; }
.tt-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tt .slider { width: 120px; gap: 0 8px; }
.tt .slider label { font-size: 11px; }
.tt .slider output { font-size: 11px; }
.tt .seg button { flex: none; padding: 0 8px; font-variant-numeric: tabular-nums; }
.drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; border: 1.5px dashed var(--text-2); background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--text); font-weight: 500; pointer-events: none; z-index: 2; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }
.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
.slider.emph label { color: var(--text); font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }
.note { margin: 0; color: var(--text-3); font-size: 11px; line-height: 1.45; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }
.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.bg-pick select { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font: 12px var(--font); cursor: pointer; padding: 0; }
.bg-pick select:focus-visible { outline: none; }
.bg-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.presets button { appearance: none; border: 0; height: 28px; border-radius: 6px; background: var(--fill); color: var(--text-2); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.presets button[aria-pressed="true"] { background: var(--text); color: var(--surface); box-shadow: none; }
.levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.levels button { appearance: none; border: 0; height: 26px; border-radius: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); position: relative; }
.levels button[aria-pressed="false"] { opacity: .25; }
.levels button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
  .tt { max-width: calc(100% - 16px); overflow-x: auto; }
}
#building-controls { display: flex; flex-direction: column; gap: 10px; }
#building-controls .seg { flex-wrap: wrap; }
#building-controls .seg button, #shape-controls .seg button { flex: 1 0 30%; }
#shape-controls .seg { flex-wrap: wrap; }
.crop-hud { position: absolute; bottom: 72px; left: 14px; flex-direction: column; align-items: stretch; display: flex; gap: 4px; align-items: center; white-space: nowrap; z-index: 4; padding: 4px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: 12px; color: var(--text-2); }
.crop-hud b { color: var(--text); font-weight: 500; margin: 4px 6px; }
.crop-hud button { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--fill); color: var(--text); font: 500 12px var(--font); cursor: pointer; }
.crop-hud button:hover { background: var(--line); }
.crop-hud button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.crop-box { position: absolute; z-index: 5; pointer-events: none; border: 1px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .55), 0 0 0 9999px rgb(0 0 0 / .18); }
.frame.cropping, .frame.cropping:active { cursor: crosshair; }
</style>
</head>
<body>
<script src="../toolbar.js"></script>
<script src="../stipple3d.js"></script>
<script src="../vendor/mp4-muxer.js"></script>
<div class="app">
  <main id="stage">
    <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Un modelo 3D dibujado con píxeles"></canvas></div>
    <div class="drop" id="drop" hidden>Soltá el modelo (.obj, .fbx, .glb, .gltf)</div>
    <div class="hud" id="stats">—</div>
    <div class="crop-hud" id="crop-hud"><button id="crop-tool" aria-pressed="false" title="Recortar (C): arrastrá un recuadro sobre el modelo, o clic para acercar ×2. Las flechas lo desplazan">Recortar</button><b id="crop-label" hidden>Recorte</b><button id="crop-back" hidden title="Vuelve al recorte anterior">Vista anterior</button><button id="crop-clear" hidden title="Muestra el cuadro entero">Quitar recorte</button></div>
    <div class="tt" role="toolbar" aria-label="Animación">
      <div class="seg" data-key="anim" aria-label="Animación">
        <button data-v="none">Quieta</button><button data-v="boil">A mano</button><button data-v="float">Flotar</button><button data-v="hover">Hover</button><button data-v="reveal">Reveal</button><button data-v="enter">Entrada</button><button data-v="paint" title="Mantené apretado sobre el lienzo: los píxeles salen del cursor y van a su lugar">Interactivo</button>
      </div>
      <button class="tt-play" id="turn" aria-pressed="false" title="Turntable: una vuelta entera, sola o junto a la animación elegida">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
        Turntable
      </button>
      <i class="tt-sep" data-for="boil float hover turn"></i>
      <div id="sl-fps" data-for="boil"></div>
      <div id="sl-boil" data-for="boil"></div>
      <div id="sl-handJit" data-for="boil"></div>
      <div id="sl-floatAmp" data-for="float"></div>
      <div id="sl-floatSpeed" data-for="float"></div>
      <div id="sl-floatScale" data-for="float"></div>
      <div id="sl-hoverRadius" data-for="hover"></div>
      <div id="sl-hoverForce" data-for="hover"></div>
      <div class="seg" data-key="revDir" aria-label="Dirección del reveal" data-for="reveal">
        <button data-v="up" title="De abajo hacia arriba">↑</button><button data-v="down" title="De arriba hacia abajo">↓</button><button data-v="ltr" title="De izquierda a derecha">→</button><button data-v="rtl" title="De derecha a izquierda">←</button><button data-v="center" title="Desde el centro hacia afuera">Centro</button><button data-v="random" title="Al azar, por todo el modelo">Azar</button>
      </div>
      <div id="sl-revOrg" data-for="reveal"></div>
      <div id="sl-revSoft" data-for="reveal"></div>
      <label class="tt-check" data-for="reveal" title="Cada píxel crece de 0 a 100% al aparecer; apagado, aparece de golpe"><input type="checkbox" data-check="revScale"> Crecen de 0 a 100%</label>
      <div class="seg" data-key="entDir" aria-label="Desde dónde entran" data-for="enter">
        <button data-v="top" title="Desde arriba">↓</button><button data-v="left" title="Desde la izquierda">→</button><button data-v="bottom" title="Desde abajo">↑</button><button data-v="right" title="Desde la derecha">←</button>
      </div>
      <div id="sl-entSpread" data-for="enter"></div>
      <div id="sl-entStagger" data-for="enter"></div>
      <label class="tt-check" data-for="enter" title="El modelo se forma y los píxeles siguen entrando por un lado mientras otros tantos se van por el opuesto, en loop"><input type="checkbox" data-check="entInf"> Infinito</label>
      <div id="sl-entStay" data-for="enter"></div>
      <div id="sl-paintRate" data-for="paint"></div>
      <div id="sl-paintDur" data-for="paint"></div>
      <label class="tt-check" data-for="paint" title="Cada píxel cae en un lugar al azar del modelo, no en el más cercano al cursor"><input type="checkbox" data-check="paintRand"> Lugar al azar</label>
      <button class="tt-play" id="paint-reset" data-for="paint" title="Vacía el lienzo para pintar de nuevo">Reiniciar</button>
      <button class="tt-play" id="paint-all" data-for="paint" title="Completa el modelo desde el cursor (o el centro)">Completar</button>
      <div class="seg" data-key="ease" aria-label="Curva de movimiento" data-for="reveal enter paint">
        <button data-v="lin" title="Lineal">Lineal</button><button data-v="in" title="Arranca lento y acelera">Acelera</button><button data-v="out" title="Arranca rápido y frena">Frena</button><button data-v="inOut" title="Lento, rápido, lento">Suave</button><button data-v="back" title="Se pasa un poco y vuelve">Rebote</button>
      </div>
      <div id="sl-revHold" data-for="reveal enter"></div>
      <div class="seg" data-key="ttDir" aria-label="Sentido" data-for="turn">
        <button data-v="1" title="A la derecha" aria-label="A la derecha">→</button><button data-v="-1" title="A la izquierda" aria-label="A la izquierda">←</button>
      </div>
      <label class="tt-check" data-for="turn" title="Los píxeles quedan pegados al modelo y giran con él; apagado, cada cuadro se dibuja de nuevo"><input type="checkbox" data-check="ttFixed"> Píxeles fijos</label>
      <div id="sl-ttDur" data-for="boil float hover turn reveal enter"></div>
      <i class="tt-sep" data-for="boil float hover turn reveal enter paint"></i>
      <div class="seg" data-key="ttFps" aria-label="Cuadros por segundo del video" data-for="boil float hover turn reveal enter paint">
        <button data-v="8">8</button><button data-v="9">9</button><button data-v="12">12</button><button data-v="15">15</button><button data-v="24">24</button><button data-v="30">30</button><button data-v="60">60</button>
      </div>
      <div class="seg" data-key="vidFmt" aria-label="Formato del video" data-for="boil float hover turn reveal enter paint">
        <button data-v="mp4" title="MP4 4K, a calidad máxima">MP4</button><button data-v="png" title="Secuencia de imágenes: cada cuadro como PNG, sin pérdida, en un .zip (pesa mucho más)">Secuencia PNG (.zip)</button>
      </div>
      <button class="btn primary" id="video" data-for="boil float hover turn reveal enter paint" title="MP4 4K en loop, recortado al modelo, con el fondo (MP4 no tiene transparencia)">Exportar video</button>
    </div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Modelo</h2>
        <div class="presets" id="presets" aria-label="Modelos"></div>
        <div id="shape-controls">
          <div class="seg" data-key="shape" aria-label="Forma"><button data-v="cube">Cubo</button><button data-v="sphere">Esfera</button><button data-v="ico">Icosfera</button><button data-v="cyl">Cilindro</button><button data-v="cone">Cono</button><button data-v="pyramid">Pirámide</button><button data-v="tetra">Tetraedro</button><button data-v="torus">Toro</button><button data-v="disc">Círculo</button><button data-v="wave">Ola</button></div>
        </div>
        <div id="building-controls">
          <div class="seg" data-key="bKind" aria-label="Tipo de edificio">
            <button data-v="auto" title="Según la semilla">Al azar</button><button data-v="setback">Escalonado</button><button data-v="cyl">Cilindro</button><button data-v="taper">Afinado</button><button data-v="twist">Torcido</button>
          </div>
          <div id="sl-bH"></div>
          <div id="sl-bW"></div>
          <div id="sl-bD"></div>
          <div id="sl-bFloors"></div>
          <div id="sl-bTiers"></div>
          <div id="sl-bTaper"></div>
          <div id="sl-bTwist"></div>
          <div id="sl-bFins"></div>
          <div id="sl-bSlab"></div>
          <label class="check"><input type="checkbox" data-check="bCrown"> Coronamiento y aguja</label>
        </div>
        <button class="btn" id="upload">Subir .obj, .fbx, .glb o .gltf</button>
        <input type="file" id="file" accept=".obj,.fbx,.glb,.gltf" hidden>
        <div id="sl-yaw"></div>
        <div id="sl-pitch"></div>
        <div id="sl-zoom"></div>
      </section>

      <section>
        <h2>Luz</h2>
        <div id="sl-lightAz"></div>
        <div id="sl-lightEl"></div>
        <div id="sl-ambient"></div>
        <div id="sl-shadow"></div>
      </section>

      <section>
        <h2>Píxeles</h2>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-contrast"></div>
        <div id="sl-threshold"></div>
        <div id="sl-edge"></div>
        <div id="sl-jitter"></div>
        <label class="check" id="lines-row" title="En vez de salpicados, los píxeles corren en líneas horizontales que siguen la forma del modelo: más juntos donde es oscuro (frecuencia modulada)"><input type="checkbox" data-check="lines"> Líneas horizontales (frecuencia modulada)</label>
        <div id="sl-lineGap"></div>
        <div id="sl-lineDot"></div>
        <div id="sl-lineFollow"></div>
        <label class="check" id="lineAM-row" title="Los píxeles quedan parejos sobre la línea y se achican con la luz hasta desaparecer"><input type="checkbox" data-check="lineAM"> Modular el tamaño con la luz</label>
        <label class="check" id="snap-row" title="Los píxeles se ubican en una grilla de su tamaño, uno por celda: uno al lado del otro, sin encimarse"><input type="checkbox" data-check="snap"> Engrillar (uno al lado del otro, sin encimarse)</label>
        <div id="sl-cell"></div>
        <div id="sl-cellGap"></div>
        <div id="blend-controls">
<p class="hint">Arrastrá los manejadores sobre el lienzo: <b>Caos</b> marca dónde empieza el orden y <b>Orden</b> dónde se completa; el punto del medio mueve los dos.</p>
          <div class="btns"><button class="btn" id="blend-swap" type="button">Invertir</button><button class="btn" id="blend-reset" type="button">Restablecer</button></div>
        </div>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Nueva semilla (R)" aria-label="Nueva semilla">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
      </section>

      <section>
        <h2>Color</h2>
        <div class="seg" data-key="colorMode" aria-label="Color">
          <button data-v="ink">Un color</button><button data-v="tone">Por tono</button><button data-v="random">Al azar</button>
        </div>
        <div id="palsets"></div>
        <div class="levels" id="inks" aria-label="Color"></div>
        <div class="row" style="grid-template-columns:56px 1fr auto">
          <span>Fondo</span>
          <label class="swatch bg-pick"><i id="bg-chip"></i><select id="bg" aria-label="Fondo"></select></label><button class="btn icon bg-flip" id="bg-flip" hidden aria-label="Blanco o negro para el color del fondo"><i></i></button>
        </div>
        <label class="check" title="Los cubos usan solamente los 3 colores de la paleta: nunca blanco ni negro (tampoco el color del fondo)"><input type="checkbox" data-check="onlyPal"> Solo los 3 colores (sin blanco ni negro)</label>
        <label class="check"><input type="checkbox" data-check="bgExport"> Incluir el fondo al exportar</label>
      </section>

      <section>
        <h2>Formato</h2>
        <div class="seg" data-key="aspect" aria-label="Proporción">

  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...dir, e.buffer], { type: 'application/zip' });
}

// ---------- Video ----------
// The loop of the chosen animation, every frame drawn in full, encoded as an MP4 (WebCodecs), cropped to what
// the pixels cover over the loop. The last frame is one step short of the first, so it loops without a seam.
$('#video').addEventListener('click', async () => {
  if (filming || (S.anim === 'none' && !S.turn)) return;
  const png = S.vidFmt === 'png';
  if (!png && (!('VideoEncoder' in window) || !window.Mp4Muxer)) return toast('Este navegador no puede exportar video: probá con Chrome, Edge o Safari.');
  const btn = $('#video'), label = btn.textContent, fps = +S.ttFps;
  const run = S.anim === 'paint' ? paintRun(fps) : null;
  const T = run ? run.T : S.anim === 'boil' && !S.turn ? boilCount() / S.fps : S.ttDur, N = Math.max(2, Math.round(T * fps));
  // Hover: a pointer sweeps a figure of eight over the model; one loop to settle, then the loop that is kept.
  let sim = null;
  const hoverSim = () => {
    const b = bounds(pts), list = pts.map(p => ({ x: p.x, y: p.y, tone: p.tone, pick: p.pick, sc: p.sc })), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, rx = (b.x1 - b.x0) * .4, ry = (b.y1 - b.y0) * .3;
    const at = i => { const a = 2 * Math.PI * i / N; return [cx + rx * Math.sin(a), cy + ry * Math.sin(2 * a)]; };
    for (let i = 0; i < N; i++) hoverStep(list, at(i), 1 / fps);
    return { list, at };
  };
  const sweep = (() => { const b = bounds(pts), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, rx = (b.x1 - b.x0) * .4, ry = (b.y1 - b.y0) * .3; return i => { const a = 2 * Math.PI * i / N; return [cx + rx * Math.sin(a), cy + ry * Math.sin(2 * a)]; }; })();
  const frameAt = i => {
    if (run) return run.at(i);
    if (S.turn) return comboFrame(i / N, false, S.anim === 'hover' ? sweep(i) : null);
    if (S.anim === 'boil') return boilFrame(Math.floor(i / fps * S.fps) % boilCount());
    if (S.anim === 'float') return floatFrame(i / N);
    if (S.anim === 'hover') { hoverStep(sim.list, sim.at(i), 1 / fps); return sim.list; }
    if (isMotion()) return motionFrame(i / N);
    return turnFrame(i / N, false);
  };
  filming = true; btn.disabled = true; cancelAnimationFrame(player);
  try {
    // The crop: for a turn, everything the model sweeps; otherwise every frame's pixels.
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const pad = S.size * (1 + S.jitter) + 4 + (S.anim === 'float' ? S.floatAmp * 2 : S.anim === 'hover' ? S.hoverRadius * .5 * S.hoverForce : 0);
    if (run) { x0 = y0 = -1e9; x1 = y1 = 1e9; } // the whole frame (or the recorte): pixels fly in from the pointer
    else if (S.turn) {
      const box = viewBoxNow(), k = AW / (box.x1 - box.x0);
      for (let i = 0; i < N; i++) {
        const t = viewTris(wrapDeg(S.yaw + +S.ttDir * 360 * i / N));
        for (let j = 0; j < t.length; j += 18) for (let v = 0; v < 9; v += 3) { const x = (t[j + v] - box.x0) * k, y = (t[j + v + 1] - box.y0) * k; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      }
    } else {
      if (S.anim === 'hover') sim = hoverSim();
      for (let i = 0; i < N; i++) { const b = bounds(frameAt(i)); if (b) { x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); } }
      if (S.anim === 'hover') sim = hoverSim();
    }
    const b0 = crop ? { x0: crop.x, y0: crop.y, x1: crop.x + crop.w, y1: crop.y + crop.h } : { x0: 0, y0: 0, x1: AW, y1: AH };
    const b = { x0: Math.max(b0.x0, x0 - pad), y0: Math.max(b0.y0, y0 - pad), x1: Math.min(b0.x1, x1 + pad), y1: Math.min(b0.y1, y1 + pad) };
    // 4K: the crop drawn as large as fits 3840 × 2160 (or 2160 × 3840 when it stands up), every pixel redrawn at
    // that size so it stays sharp; even dimensions (H.264).
    const bw = b.x1 - b.x0, bh = b.y1 - b.y0, sc = Math.min(3840 / Math.max(bw, bh), 2160 / Math.min(bw, bh)), W = Math.round((b.x1 - b.x0) * sc / 2) * 2, H = Math.round((b.y1 - b.y0) * sc / 2) * 2;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const paint = i => {
      const list = frameAt(i);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
      ctx.setTransform(sc, 0, 0, sc, 0, 0); draw(ctx, list, b.x0, b.y0);
    };
    const name = [{ boil: 'a-mano', float: 'flotar', hover: 'hover', paint: 'interactivo', reveal: 'reveal-' + S.revDir, enter: 'entrada-' + S.entDir + (S.entInf ? '-infinito' : '') }[S.anim], S.turn && 'turntable'].filter(Boolean).join('-');
    if (png) {
      // Lossless: every frame a PNG, numbered, in a .zip (stored: PNGs don't shrink further).
      const files = [];
      for (let i = 0; i < N; i++) {
        paint(i);
        const blob = await new Promise(res => c.toBlob(res, 'image/png'));
        files.push([`${name}-${String(i + 1).padStart(4, '0')}.png`, new Uint8Array(await blob.arrayBuffer())]);
        btn.textContent = `Renderizando ${i + 1} / ${N}`;
      }
      download(`pixel-model-${name}-${S.seed}-${fps}fps.zip`, zipStored(files));
      return;
    }
    // H.264 where the browser has it (plays everywhere); VP9 in MP4 otherwise. Stippled pixels are noise to a video
    // codec, so the bitrate is set as high as the encoder takes (about half a bit per pixel per frame, up to 200
    // Mbps), a keyframe each second, tuned for quality over speed.
    let config = null, kind = '';
    const want = Math.round(W * H * fps * .5);
    search: for (const br of [Math.min(200e6, want), Math.min(120e6, want), Math.min(80e6, want)])
      for (const [codec, k2] of [['avc1.640034', 'avc'], ['avc1.640033', 'avc'], ['avc1.4d0033', 'avc'], ['avc1.42003e', 'avc'], ['vp09.00.51.08', 'vp9'], ['vp09.00.10.08', 'vp9']]) {
        const cfg = { codec, width: W, height: H, bitrate: br, bitrateMode: 'variable', latencyMode: 'quality', framerate: fps };
        if ((await VideoEncoder.isConfigSupported(cfg)).supported) { config = cfg; kind = k2; break search; }
      }
    if (!config) throw new Error('codec');
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: kind, width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
    let failed = null;
    // Tagged as sRGB (BT.709 primaries, sRGB curve) so players show the background as the page does, #F6F6F6,
    // instead of guessing a video gamma and shifting it.
    const tag = meta => meta?.decoderConfig ? { ...meta, decoderConfig: { ...meta.decoderConfig, colorSpace: { matrix: 'bt709', fullRange: false, ...meta.decoderConfig.colorSpace, primaries: 'bt709', transfer: 'iec61966-2-1' } } } : meta;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, tag(meta)), error: e => failed = e });
    enc.configure(config);
    for (let i = 0; i < N; i++) {
      if (failed) throw failed;
      paint(i);
      const f = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(f, { keyFrame: i % fps === 0 }); f.close();
      btn.textContent = `Renderizando ${i + 1} / ${N}`;
      while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5));
      await new Promise(r => setTimeout(r, 0));
    }
    await enc.flush(); enc.close();
    if (failed) throw failed;
    muxer.finalize();
    download(`pixel-model-${name}-${S.seed}.mp4`, new Blob([muxer.target.buffer], { type: 'video/mp4' }));
  } catch (err) {
    console.error(err); toast('No se pudo exportar el video.');
  } finally {
    for (const p of pts) p.dx = p.dy = p.vx = p.vy = 0;
    filming = false; btn.disabled = false; btn.textContent = label; key = ''; sync();
  }
});

// Pasaje's handles (toolbar.js) over the picture, and its two buttons.
PerceptaBlendHandles({ frame, visible: () => S.dir !== '1b' && S.blend, get: () => [S.blendA, S.blendB], set: (A, B) => { S.blendA = A; S.blendB = B; sync(); }, view: () => { const v = viewBox(); return { x: v.x / AW, y: v.y / AH, w: v.w / AW, h: v.h / AH }; } });
$('#blend-swap').addEventListener('click', () => { [S.blendA, S.blendB] = [S.blendB, S.blendA]; sync(); });
$('#blend-reset').addEventListener('click', () => { S.blendA = DEFAULTS.blendA.slice(); S.blendB = DEFAULTS.blendB.slice(); sync(); });

// The mode bar (top middle): in 1A Caótico (loose, overlapping), Engrillado (one per cell) or Pasaje (from one to the
// other across the picture: Dirección, Dónde ocurre, Largo); in 1B the circles' Caos.
const modeBar = PerceptaModeBar(stage, `  <div class="seg" id="pm-1a" aria-label="Modo"><button data-ord="chaos" title="Píxeles sueltos que se superponen">Caótico</button><button data-ord="grid" title="Cada píxel en su celda, separado de los demás">Engrillado</button><button data-ord="blend" title="De desorden a orden en una misma composición">Pasaje</button></div>
  <label class="pm-chaos" id="pm-1b" title="Desorden de los círculos, sin perder la forma ni superponerse">Caos <input type="range" id="pm-chaos" min="0" max="1" step="0.01" aria-label="Caos"><output id="pm-chaos-out"></output></label>`);
const ordOf = () => S.blend ? 'blend' : S.snap ? 'grid' : 'chaos';
modeBar.querySelector('#pm-1a').addEventListener('click', e => { const b = e.target.closest('[data-ord]'); if (!b) return; S.snap = b.dataset.ord === 'grid'; S.blend = b.dataset.ord === 'blend'; sync(); });
modeBar.querySelector('#pm-chaos').addEventListener('input', e => { S.chaos = +e.target.value; sync(); });
function syncModeBar() {
  const b1 = S.dir === '1b';
  modeBar.querySelector('#pm-1a').hidden = b1; modeBar.querySelector('#pm-1b').hidden = !b1;
  modeBar.querySelectorAll('[data-ord]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ord === ordOf()));
  const ch = modeBar.querySelector('#pm-chaos'); if (+ch.value !== S.chaos) ch.value = S.chaos; ch.style.setProperty('--p', S.chaos * 100 + '%');
  modeBar.querySelector('#pm-chaos-out').textContent = Math.round(S.chaos * 100) + '%';
  $('#blend-controls').hidden = b1 || !S.blend;
}

// Dirección (toolbar.js): 1A square pixels, all one size, scattered by the light; 1B round pixels on horizontal lines
// that follow the model, frequency modulated (closer together where dark), never overlapping.
PerceptaDirection({
  get: () => S.dir,
  set: v => { S.dir = v; if (v === '1a') S.lines = false; else { S.lines = true; S.snap = false; S.blend = false; } sync(); },
});
loadPreset();
sync();
</script>
</body>
</html>
