<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Noise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --page: #f4f2ee;
  --stage: #e9e6e0;
  --surface: #fbfaf8;
  --fill: #efece7;
  --line: #dcd7cf;
  --text: #1a1714;
  --text-2: #5e5850;
  --text-3: #8f887e;
  --accent: #1a1714;
  --accent-text: #fbfaf8;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
    --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #161513; --stage: #11100f; --surface: #1d1c1a; --fill: #282624; --line: #34312d;
  --text: #eeeae4; --text-2: #b0a99f; --text-3: #7d776e; --accent: #eeeae4; --accent-text: #161513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--page); color: var(--text); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }

.app { display: grid; flex: 1; min-height: 0; grid-template-columns: 1fr 280px; }
main { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--stage); min-width: 0; min-height: 0; padding-bottom: 32px; }
.frame { position: relative; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px var(--line); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .15s ease-out; }
.frame { touch-action: none; cursor: crosshair; }
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%; border: 1px solid #fff; mix-blend-mode: difference; transform: translate(-50%, -50%); }
.hud { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; white-space: nowrap;
  background: var(--surface); color: var(--text-2); border-radius: 8px; padding: 6px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.hud kbd { font: 500 11px var(--mono); color: var(--text); }
.hud .dim { color: var(--text-3); }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.controls { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; }
.hint { margin: 0; color: var(--text-3); font-size: 12px; }

.seg { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text-2); font: 500 12px var(--font); height: 26px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { color: var(--text-2); font-size: 12px; }
.slider output { font: 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
.slider.emph label { color: var(--text); font-weight: 500; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--text), var(--text)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }

.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
.row > span { color: var(--text-2); font-size: 12px; }
.text { font: 12px var(--mono); height: 28px; min-width: 0; border-radius: 8px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--fill);
  color: var(--text); font: 500 12px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: var(--line); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.big { height: 40px; width: 100%; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.swatch { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font: 12px var(--mono); min-width: 0; }
.swatch i { width: 20px; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--text); margin: 0; }

footer { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; z-index: 5; }
[hidden] { display: none !important; }

@media (max-width: 767px) {
  html, body { height: auto; min-height: 100%; }
  .app { flex: none; grid-template-columns: 1fr; grid-template-rows: minmax(300px, 55vh) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { overflow: visible; }
  .hud .dim { display: none; }
}
</style>
</head>
<body>
<script src="toolbar.js"></script>
<div class="app">
  <main id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" role="img" aria-label="Olas formadas por cubos"></canvas>
      <div class="cursor" id="cursor" hidden></div>
    </div>
    <div class="hud"><span id="stats">—</span><span class="dim">Mantené el clic para dispersar · <kbd>R</kbd> nueva semilla</span></div>
  </main>

  <aside>
    <div class="controls">
      <section>
        <h2>Olas</h2>
        <div id="sl-layers"></div>
        <div id="sl-amp"></div>
        <div id="sl-freq"></div>
        <div id="sl-complexity"></div>
        <div id="sl-persp"></div>
        <div id="sl-thickness"></div>
        <div id="sl-fade"></div>
        <div class="row">
          <span>Semilla</span>
          <input class="text" id="seed" inputmode="numeric" aria-label="Semilla">
          <button class="btn icon" id="reseed" title="Nueva semilla (R)" aria-label="Nueva semilla">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
      </section>

      <section>
        <h2>Cubos</h2>
        <div class="seg" data-key="style" aria-label="Estilo">
          <button data-v="mono">Mono</button><button data-v="variation">Variación</button>
        </div>
        <div id="sl-count"></div>
        <div id="sl-size"></div>
        <div id="sl-mod"></div>
        <div id="sl-variation"></div>
        <div id="sl-grain"></div>
      </section>

      <section>
        <h2>Dispersión</h2>
        <p class="hint">Mantené el clic sobre la imagen: los píxeles de esa zona se dispersan y siguen derivando.</p>
        <div id="sl-radius"></div>
        <div id="sl-force"></div>
        <div id="sl-drift"></div>
        <button class="btn" id="reform">Recomponer</button>
      </section>

      <section>
        <h2>Fondo y formato</h2>
        <div class="row" style="grid-template-columns:56px 1fr">
          <span>Fondo</span><label class="swatch"><i></i><b data-hex></b><input type="color" data-color="paper" aria-label="Fondo"></label>
        </div>
        <label class="check"><input type="checkbox" id="bg-export"> Incluir fondo al exportar</label>
        <div class="seg" data-key="aspect" aria-label="Proporción">
          <button data-v="3:2">3:2</button><button data-v="4:3">4:3</button><button data-v="1:1">1:1</button><button data-v="4:5">4:5</button><button data-v="16:9">16:9</button>
        </div>
      </section>
    </div>
    <footer>
      <button class="btn primary big" id="png">Exportar PNG</button>
      <button class="btn big" id="svg">Exportar SVG</button>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- State ----------
const SIZES = { '3:2': [3000, 2000], '4:3': [3000, 2250], '1:1': [3000, 3000], '4:5': [2400, 3000], '16:9': [3200, 1800] };
const INK = '#000000';
const DEFAULTS = {
  seed: 1, aspect: '3:2',
  layers: 2, amp: .55, freq: 1.1, complexity: 3, persp: .55, thickness: .25, fade: .5,
  style: 'mono', count: 45000, size: 3.5, mod: .6, variation: .35, grain: .12,
  radius: 220, force: .9, drift: .5,
  paper: '#f6f5f2', bgExport: false,
};
const S = structuredClone(DEFAULTS);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

// ---------- Noise ----------
function rng(seed) {
  let a = seed >>> 0 || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
function perlin(rand) {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  return (x, y) => {
    const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
    const u = fade(xf), v = fade(yf);
    const aa = p[p[xi] + yi], ab = p[p[xi] + yi + 1], ba = p[p[xi + 1] + yi], bb = p[p[xi + 1] + yi + 1];
    const x1 = g(aa, xf, yf) + u * (g(ba, xf - 1, yf) - g(aa, xf, yf));
    const x2 = g(ab, xf, yf - 1) + u * (g(bb, xf - 1, yf - 1) - g(ab, xf, yf - 1));
    return x1 + v * (x2 - x1);
  };
}

// ---------- Waves ----------
// Each layer is a 3D sheet: a height field made of a few long sine waves, seen in perspective from just
// above. Pixels are spread evenly over the sheet, so they pile up by themselves where it folds or turns
// edge-on (the bright crests in the references) and thin out where it faces the camera. The far edge and
// the ends fade out, and a little thickness gives the sheet some volume.
function generate(st) {
  const [W, H] = SIZES[st.aspect], r = rng(st.seed);
  const layers = Array.from({ length: st.layers }, (_, l) => {
    const waves = Array.from({ length: st.complexity }, (_, k) => ({
      f: st.freq * (k === 0 ? 1 : 1 + k * .7) * (.7 + r() * .6) * Math.PI * 2,
      th: (r() - .5) * 1.1, ph: r() * Math.PI * 2, a: 1 / (1 + k * 1.1),
    }));
    return { waves, base: (l - (st.layers - 1) / 2) * .35 + (r() - .5) * .15, tilt: (r() - .5) * .3 };
  });
  const height = (L, u, v) => {
    let h = 0, norm = 0;
    for (const w of L.waves) { h += w.a * Math.sin(w.f * (u * Math.cos(w.th) + v * Math.sin(w.th)) + w.ph); norm += w.a; }
    return L.base + L.tilt * (u - .5) + (h / norm) * st.amp;
  };
  const focal = .4 + st.persp * 1.4, zNear = 1, zFar = 1 + 1.5 + st.persp * 2.5;
  const n = st.count, mono = st.style === 'mono';
  const px = new Float32Array(n), py = new Float32Array(n), size = new Float32Array(n), shade = new Uint8Array(n);
  let got = 0;
  for (let tries = 0; got < n && tries < n * 6; tries++) {
    const L = layers[Math.floor(r() * layers.length)], u = r(), v = r();
    // Fade the far edge, the near edge a little, and both ends.
    const keep = smooth(0, .12 + st.fade * .2, v) * (1 - smooth(1 - st.fade * .7, 1, v)) * smooth(0, .05 + st.fade * .12, u) * smooth(0, .05 + st.fade * .12, 1 - u);
    if (r() > keep) continue;
    const z = zNear + v * (zFar - zNear), x = (u - .5) * 2 * z / focal * 1.1;
    const y = height(L, u, v) + gauss(r) * st.thickness * .06;
    px[got] = x / z * focal; py[got] = (.9 - y) / z * focal;
    const k = mono ? 1 : (1 - st.mod) + st.mod * clamp(1.6 / z);
    size[got] = mono ? st.size : st.size * k * Math.max(.2, 1 + st.variation * (r() * 2 - 1) * .7);
    shade[got] = mono ? MONO_SHADE : Math.floor(r() * SHADES);
    got++;
  }
  // Fit the whole projection inside the frame, every pixel included: its exact extent (plus the largest
  // pixel) is scaled into a box with a margin, so the waves shrink rather than get cut.
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, half = 0;
  for (let i = 0; i < got; i++) {
    x0 = Math.min(x0, px[i]); x1 = Math.max(x1, px[i]); y0 = Math.min(y0, py[i]); y1 = Math.max(y1, py[i]);
    half = Math.max(half, size[i] / 2);
  }
  const mx = .05 * W + half, X0 = mx, X1 = W - mx, Y0 = .14 * H + half, Y1 = .86 * H - half;
  for (let i = 0; i < got; i++) { px[i] = X0 + (px[i] - x0) / (x1 - x0) * (X1 - X0); py[i] = Y0 + (py[i] - y0) / (y1 - y0) * (Y1 - Y0); }
  return { W, H, n: got, hx: px.slice(0, got), hy: py.slice(0, got), size: size.slice(0, got), shade: shade.slice(0, got) };
}

// ---------- Color ----------
// Black split into a few greys for Variación; Mono is pure black.
const SHADES = 9, MONO_SHADE = 0;
const shadeHex = (k, grain) => { const v = Math.round(255 * k / (SHADES - 1) * grain * 2.5); return '#' + v.toString(16).padStart(2, '0').repeat(3); };

// ---------- Dispersal ----------
// Pixels have a home and an offset. While the pointer is held, each pixel that comes under it gets one kick
// outwards with a random strength (so they open into a cloud instead of being shoved into a ring); once
// moving, they drift along a slow noise flow and settle as friction takes over. "Recomponer" eases them home.
let gen = null, genKey = '', X = null, Y = null, VX = null, VY = null, active = new Set(), kicked = new Set();
let pointer = null, pressing = false, reform = null, flow = null;
function resetMotion() {
  X = gen.hx.slice(); Y = gen.hy.slice(); VX = new Float32Array(gen.n); VY = new Float32Array(gen.n);
  active = new Set(); kicked = new Set(); reform = null; flow = perlin(rng(S.seed * 31 + 7));
}
function step(dt) {
  const unit = Math.min(gen.W, gen.H);
  if (pressing && pointer) {
    const R = S.radius, R2 = R * R, kick = S.force * 1500;
    for (let i = 0; i < gen.n; i++) {
      if (kicked.has(i)) continue;
      const dx = X[i] - pointer[0], dy = Y[i] - pointer[1], d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      const d = Math.sqrt(d2), u = Math.random(), f = kick * (1 - .5 * d / R) * (.08 + .92 * u * u);
      const a = (d > 1 ? Math.atan2(dy, dx) : Math.random() * Math.PI * 2) + (Math.random() - .5) * 1.8;
      VX[i] += Math.cos(a) * f; VY[i] += Math.sin(a) * f;
      kicked.add(i); active.add(i);
    }
  }
  // The flow only steers (turns the velocity towards the local flow direction), so it adds no energy and
  // friction always brings the pixels to rest.
  const fs = 2.2 / unit, steer = Math.min(1, S.drift * dt * 2.5), damp = Math.pow(.18, dt);
  for (const i of active) {
    const ang = flow(X[i] * fs, Y[i] * fs) * Math.PI * 3, sp = Math.hypot(VX[i], VY[i]);
    VX[i] += (Math.cos(ang) * sp - VX[i]) * steer; VY[i] += (Math.sin(ang) * sp - VY[i]) * steer;
    VX[i] *= damp; VY[i] *= damp;
    X[i] += VX[i] * dt; Y[i] += VY[i] * dt;
    // Dispersed pixels stay inside the frame too: they stop softly at the edge.
    const h = gen.size[i] / 2;
    if (X[i] < h) { X[i] = h; VX[i] *= -.2; } else if (X[i] > gen.W - h) { X[i] = gen.W - h; VX[i] *= -.2; }
    if (Y[i] < h) { Y[i] = h; VY[i] *= -.2; } else if (Y[i] > gen.H - h) { Y[i] = gen.H - h; VY[i] *= -.2; }
    if (Math.abs(VX[i]) + Math.abs(VY[i]) < 3) { VX[i] = VY[i] = 0; active.delete(i); }
  }
  if (reform) {
    const t = clamp((performance.now() - reform.t0) / 900), e = t * t * (3 - 2 * t);
    for (let i = 0; i < gen.n; i++) { X[i] = reform.x[i] + (gen.hx[i] - reform.x[i]) * e; Y[i] = reform.y[i] + (gen.hy[i] - reform.y[i]) * e; }
    if (t >= 1) reform = null;
  }
}

// ---------- Rendering ----------
function eachRun(st, fn) {
  const groups = Array.from({ length: SHADES }, () => []);
  for (let i = 0; i < gen.n; i++) groups[gen.shade[i]].push(i);
  groups.forEach((idx, k) => idx.length && fn(k === MONO_SHADE && st.style === 'mono' ? INK : shadeHex(k, st.grain), idx));
}
function draw(ctx, st) {
  eachRun(st, (color, idx) => {
    ctx.fillStyle = color; ctx.beginPath();
    for (const i of idx) { const s = gen.size[i], h = s / 2; ctx.rect(X[i] - h, Y[i] - h, s, s); }
    ctx.fill();
  });
}
function toSvg(st) {
  const r = v => Math.round(v * 10) / 10, out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${gen.W}" height="${gen.H}" viewBox="0 0 ${gen.W} ${gen.H}">`);
  if (st.bgExport) out.push(`<rect width="100%" height="100%" fill="${st.paper}"/>`);
  eachRun(st, (color, idx) => {
    let d = '';
    for (const i of idx) { const s = gen.size[i], h = s / 2; d += `M${r(X[i] - h)} ${r(Y[i] - h)}h${r(s)}v${r(s)}h${r(-s)}Z`; }
    out.push(`<path fill="${color}" d="${d}"/>`);
  });
  out.push('</svg>');
  return out.join('');
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), frame = $('#frame'), stage = $('#stage'), cursor = $('#cursor');
let raf = 0, last = 0;

const pct = v => Math.round(v * 100) + '%';
const SLIDERS = {
  layers: { label: 'Capas', min: 1, max: 4, step: 1, fmt: String },
  amp: { label: 'Altura de las olas', min: 0, max: 1.5, step: .01, fmt: pct, emph: true },
  freq: { label: 'Frecuencia', min: .3, max: 3, step: .01, fmt: v => v.toFixed(2) },
  complexity: { label: 'Complejidad', min: 1, max: 6, step: 1, fmt: String },
  persp: { label: 'Perspectiva', min: 0, max: 1, step: .01, fmt: pct },
  thickness: { label: 'Grosor', min: 0, max: 1, step: .01, fmt: pct },
  fade: { label: 'Desvanecer bordes', min: 0, max: 1, step: .01, fmt: pct },
  count: { label: 'Cubos', min: 2000, max: 150000, step: 1000, fmt: v => v < 10000 ? v.toLocaleString('es') : Math.round(v / 1000) + 'k', emph: true },
  size: { label: 'Tamaño', min: 1, max: 24, step: .5, fmt: v => v + ' px' },
  mod: { label: 'Tamaño según profundidad', min: 0, max: 1, step: .01, fmt: pct },
  variation: { label: 'Variación', min: 0, max: 1, step: .01, fmt: pct },
  grain: { label: 'Variación de tono', min: 0, max: .4, step: .01, fmt: pct },
  radius: { label: 'Radio', min: 30, max: 900, step: 10, fmt: v => v + ' px' },
  force: { label: 'Fuerza', min: .05, max: 2, step: .01, fmt: pct },
  drift: { label: 'Deriva', min: 0, max: 2, step: .01, fmt: pct },
};
for (const [key, d] of Object.entries(SLIDERS)) {
  const host = $('#sl-' + key);
  host.className = 'slider' + (d.emph ? ' emph' : '');
  host.innerHTML = `<label for="in-${key}">${d.label}</label><output id="out-${key}"></output><input type="range" id="in-${key}" min="${d.min}" max="${d.max}" step="${d.step}" title="Doble clic para restablecer">`;
  const input = host.querySelector('input');
  input.addEventListener('input', () => { S[key] = +input.value; sync(); });
  input.addEventListener('dblclick', () => { S[key] = DEFAULTS[key]; sync(); });
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[seg.dataset.key] = b.dataset.v; sync();
}));
document.querySelectorAll('[data-color]').forEach(inp => inp.addEventListener('input', () => { S[inp.dataset.color] = inp.value; sync(); }));
$('#bg-export').addEventListener('change', e => { S.bgExport = e.target.checked; });
$('#seed').addEventListener('input', e => { S.seed = Math.min(999999999, parseInt(e.target.value.replace(/\D/g, '') || '0', 10)); sync(); });
const reseed = () => { S.seed = Math.floor(Math.random() * 1e6); sync(); };
$('#reseed').addEventListener('click', reseed);
$('#reform').addEventListener('click', () => { if (!gen) return; active.clear(); VX.fill(0); VY.fill(0); reform = { t0: performance.now(), x: X.slice(), y: Y.slice() }; wake(); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
  if (e.key === 'r' || e.key === 'R') reseed();
});

function paintSwatch(el, hex) {
  el.querySelector('i').style.background = hex;
  el.querySelector('[data-hex]').textContent = hex.toUpperCase();
  const inp = el.querySelector('input'); if (inp.value !== hex) inp.value = hex;
}
function sync() {
  for (const key of Object.keys(SLIDERS)) {
    const input = $('#in-' + key), d = SLIDERS[key];
    if (+input.value !== S[key]) input.value = S[key];
    input.style.setProperty('--p', ((S[key] - d.min) / (d.max - d.min) * 100) + '%');
    $('#out-' + key).textContent = d.fmt(S[key]);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[seg.dataset.key])));
  const seedEl = $('#seed'); if (seedEl.value !== String(S.seed)) seedEl.value = S.seed;
  $('#sl-mod').hidden = $('#sl-variation').hidden = $('#sl-grain').hidden = S.style === 'mono';
  document.querySelectorAll('[data-color]').forEach(inp => paintSwatch(inp.closest('.swatch'), S[inp.dataset.color]));
  const key = JSON.stringify([S.seed, S.aspect, S.layers, S.amp, S.freq, S.complexity, S.persp, S.thickness, S.fade, S.style, S.count, S.size, S.mod, S.variation]);
  if (key !== genKey) { gen = generate(S); genKey = key; resetMotion(); }
  wake();
}

function fit() {
  const r = stage.getBoundingClientRect();
  const k = Math.max(0, Math.min((r.width - 64) / gen.W, (r.height - 96) / gen.H));
  return { w: Math.round(gen.W * k), h: Math.round(gen.H * k) };
}
// Runs while something moves; otherwise draws once and sleeps.
function wake() { if (!raf) raf = requestAnimationFrame(frameLoop); }
function frameLoop(now) {
  raf = 0;
  const dt = last ? Math.min(.05, (now - last) / 1000) : 1 / 60; last = now;
  step(dt);
  const { w, h } = fit();
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; frame.style.background = S.paper;
  const dpr = devicePixelRatio || 1, pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(pw / gen.W, 0, 0, ph / gen.H, 0, 0);
  ctx.clearRect(0, 0, gen.W, gen.H);
  draw(ctx, S);
  $('#stats').textContent = `${gen.n.toLocaleString('es')} cubos · ${active.size.toLocaleString('es')} en movimiento · ${gen.W} × ${gen.H} px`;
  if (pressing || active.size || reform) raf = requestAnimationFrame(frameLoop); else last = 0;
}
new ResizeObserver(wake).observe(stage);

// ---------- Pointer ----------
function toArt(e) {
  const r = frame.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * gen.W, (e.clientY - r.top) / r.height * gen.H];
}
function moveCursor(e) {
  const r = frame.getBoundingClientRect(), d = 2 * S.radius * r.width / gen.W;
  cursor.hidden = false;
  cursor.style.width = cursor.style.height = d + 'px';
  cursor.style.left = (e.clientX - r.left) + 'px'; cursor.style.top = (e.clientY - r.top) + 'px';
}
frame.addEventListener('pointermove', e => { pointer = toArt(e); moveCursor(e); });
frame.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  frame.setPointerCapture(e.pointerId);
  pointer = toArt(e); pressing = true; reform = null; kicked = new Set(); moveCursor(e); wake();
});
const release = () => { pressing = false; kicked = new Set(); };
frame.addEventListener('pointerup', release);
frame.addEventListener('pointercancel', release);
frame.addEventListener('pointerleave', () => { if (!pressing) cursor.hidden = true; });

// ---------- Export ----------
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' descargado');
}
$('#png').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = gen.W; c.height = gen.H;
  const ctx = c.getContext('2d');
  if (S.bgExport) { ctx.fillStyle = S.paper; ctx.fillRect(0, 0, gen.W, gen.H); }
  draw(ctx, S);
  c.toBlob(b => b ? download(`cube-waves-${S.seed}.png`, b) : toast('No se pudo generar el PNG.'), 'image/png');
});
$('#svg').addEventListener('click', () => download(`cube-waves-${S.seed}.svg`, new Blob([toSvg(S)], { type: 'image/svg+xml' })));

sync();
</script>
</body>
</html>
